<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Warehouse Inventory Management System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --primary:#0f766e; --primary-dark:#115e59; --accent:#f59e0b;
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --success:#16a34a; --warning:#f59e0b; --danger:#dc2626;
    --info:#0284c7; --sidebar:#0f172a;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  button { cursor: pointer; border: none; background: none; }

  #loginScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#0f172a,#134e4a); padding: 20px; z-index: 2000; }
  .login-box { background:#fff; border-radius:16px; padding: 32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .login-box h1 { font-size:22px; margin-bottom: 6px; color: var(--primary-dark); }
  .login-box p { color: var(--muted); margin-bottom: 22px; font-size: 13px; }

  .app { display: none; min-height: 100vh; }
  .app.active { display: flex; }
  .sidebar { width: 240px; background: var(--sidebar); color: #cbd5e1; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index: 100; }
  .brand { padding: 20px; border-bottom: 1px solid #1e293b; }
  .brand h2 { color: #fff; font-size: 16px; }
  .brand small { color: #64748b; font-size: 11px; }
  .nav { flex: 1; padding: 10px 0; }
  .nav a { display: flex; align-items:center; gap: 10px; padding: 11px 20px; color:#cbd5e1; text-decoration:none; font-size: 13.5px; border-left: 3px solid transparent; cursor:pointer; }
  .nav a:hover { background: #1e293b; color:#fff; }
  .nav a.active { background:#1e293b; color:#fff; border-left-color: var(--accent); }
  .nav .section { padding: 14px 20px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color:#475569; }
  .nav .badge { margin-left:auto; background: var(--danger); color:#fff; border-radius: 10px; padding: 1px 7px; font-size: 10px; }

  .main { flex:1; margin-left:240px; min-width: 0; }
  .topbar { background:#fff; border-bottom:1px solid var(--border); padding: 12px 22px; display:flex; align-items:center; gap: 14px; position:sticky; top:0; z-index: 50; }
  .topbar h3 { font-size: 16px; flex: 1; }
  .topbar .user-chip { display:flex; align-items:center; gap:8px; font-size: 13px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-weight:600; font-size: 12px; }
  .content { padding: 20px; max-width: 1400px; }

  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
  .card .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card.warn .value { color: var(--warning); }
  .card.danger .value { color: var(--danger); }
  .card.success .value { color: var(--success); }
  .card.info .value { color: var(--info); }

  .panel { background:#fff; border-radius:12px; border:1px solid var(--border); margin-bottom: 18px; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .panel-head h4 { font-size: 14.5px; flex:1; }
  .panel-body { padding: 16px 18px; }

  .form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .field { display:flex; flex-direction:column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select, textarea { width:100%; padding: 9px 11px; border:1px solid var(--border); border-radius: 8px; background:#fff; color:var(--text); outline:none; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; background: var(--primary); color:#fff; transition: .15s; }
  .btn:hover { background: var(--primary-dark); }
  .btn.sec { background:#fff; color: var(--text); border:1px solid var(--border); }
  .btn.sec:hover { background:#f8fafc; }
  .btn.danger { background: var(--danger); }
  .btn.warn { background: var(--warning); color:#fff; }
  .btn.success { background: var(--success); }
  .btn.sm { padding: 6px 11px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); background:#fff; }
  table { width:100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th { text-align:left; padding: 10px 12px; background:#f8fafc; color: var(--muted); font-weight:600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; border-bottom:1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  tr:hover td { background: #fafbfc; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .badge-status { display:inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .s-normal { background:#dcfce7; color:#166534; }
  .s-low { background:#fef3c7; color:#92400e; }
  .s-critical { background:#fed7aa; color:#9a3412; }
  .s-out { background:#fee2e2; color:#991b1b; }
  .s-draft { background:#e2e8f0; color:#475569; }
  .s-pending { background:#fef3c7; color:#92400e; }
  .s-approved { background:#dcfce7; color:#166534; }
  .s-rejected { background:#fee2e2; color:#991b1b; }
  .s-correction { background:#e0e7ff; color:#3730a3; }
  .s-reversed { background:#f3e8ff; color:#6b21a8; }

  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index: 1000; padding: 14px; }
  .modal-overlay.active { display: flex; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width: 900px; max-height: 92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.35); }
  .modal-head { padding: 16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap: 10px; }
  .modal-head h4 { flex:1; font-size: 15.5px; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 14px 20px; border-top:1px solid var(--border); display:flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .x-btn { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size: 18px; color: var(--muted); }
  .x-btn:hover { background:#f1f5f9; }

  .filter-bar { display:flex; gap: 10px; flex-wrap: wrap; align-items:end; margin-bottom: 14px; }
  .filter-bar .field { min-width: 150px; flex: 1; max-width: 220px; }
  .empty { text-align:center; padding: 30px; color: var(--muted); font-size: 13px; }
  .empty-state { text-align:center; padding: 50px 20px; }
  .empty-state .icon { font-size: 54px; margin-bottom: 14px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 6px; }
  .empty-state p { color: var(--muted); font-size: 13px; margin-bottom: 18px; max-width: 500px; margin-left:auto; margin-right:auto; }

  .toast { position: fixed; bottom: 20px; right: 20px; background:#0f172a; color:#fff; padding: 12px 18px; border-radius:10px; z-index: 3000; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); transform: translateY(100px); opacity:0; transition: .25s; }
  .toast.show { transform: translateY(0); opacity:1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warn { background: var(--warning); }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background:#e2e8f0; color:#475569; font-weight: 600; }

  .mobile-nav { display: none; }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); transition: .25s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .content { padding: 14px; }
    .topbar { padding: 10px 14px; }
    .menu-btn { display:grid; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
    .card .value { font-size: 18px; }
    .mobile-nav { display:grid; grid-template-columns: repeat(5,1fr); position: fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); z-index: 90; }
    .mobile-nav button { padding: 9px 4px; font-size: 10.5px; display:flex; flex-direction:column; align-items:center; gap: 3px; color: var(--muted); }
    .mobile-nav button.active { color: var(--primary); }
    .mobile-nav button span:first-child { font-size: 18px; }
    .content { padding-bottom: 70px; }
  }
  .menu-btn { display:none; width:36px; height:36px; border-radius:8px; background:#f1f5f9; place-items:center; font-size:16px; }

  @media print {
    .sidebar,.topbar,.mobile-nav,.no-print { display:none !important; }
    .main { margin-left:0; }
    .panel { border:none; box-shadow: none; }
  }

  .chart-wrap { position: relative; height: 280px; }
  .stat-row { display:flex; justify-content:space-between; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .stat-row:last-child { border-bottom:none; }
  .stat-row b { font-variant-numeric: tabular-nums; }
  .tabs { display:flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { padding: 7px 13px; border-radius: 20px; font-size: 12.5px; background:#fff; border:1px solid var(--border); }
  .tabs button.active { background: var(--primary); color:#fff; border-color: var(--primary); }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>🏭 Warehouse IMS</h1>
    <p>Warehouse Inventory Management System</p>
    <div class="field" style="margin-bottom:12px">
      <label>Username</label>
      <input id="loginUser" value="store" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Password</label>
      <input id="loginPass" type="password" value="store" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
    <p style="margin-top:14px;font-size:11.5px;text-align:center;color:#94a3b8">
      Demo: admin/admin · manager/manager · store/store · auditor/auditor
    </p>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>🏭 Warehouse IMS</h2>
      <small id="brandSub">Main Warehouse</small>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h3 id="pageTitle">Dashboard</h3>
      <div style="position:relative">
        <button class="btn sec sm" onclick="toggleNotifications(event)">🔔 <span id="notifCount" class="badge" style="display:none"></span></button>
      </div>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">S</div>
        <div>
          <div style="font-weight:600" id="userName">Storekeeper</div>
          <div style="font-size:11px;color:var(--muted)" id="userRole">Storekeeper</div>
        </div>
        <button class="btn sec sm" onclick="logout()" style="margin-left:6px">Logout</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <button data-page="dashboard" onclick="go('dashboard')"><span>📊</span><span>Home</span></button>
    <button data-page="stockin" onclick="go('stockin')"><span>📥</span><span>Stock IN</span></button>
    <button data-page="stockout" onclick="go('stockout')"><span>📤</span><span>Stock OUT</span></button>
    <button data-page="currentstock" onclick="go('currentstock')"><span>📦</span><span>Stock</span></button>
    <button data-page="search" onclick="go('search')"><span>🔍</span><span>Search</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================
   WAREHOUSE INVENTORY MANAGEMENT SYSTEM — Clean Start
   No seeded items/categories/suppliers/departments.
   The storekeeper builds the master data from scratch.
   ============================================================ */

const DB_KEY = 'wms_db_v4';   // bumped version to force fresh empty DB

function defaultDB(){
  return {
    users: [
      {id:1, username:'admin',   password:'admin',   name:'System Admin',      role:'super_admin',       active:true},
      {id:2, username:'manager', password:'manager', name:'Abebe Manager',     role:'warehouse_manager', active:true},
      {id:3, username:'store',   password:'store',   name:'John Storekeeper',  role:'storekeeper',       active:true},
      {id:4, username:'auditor', password:'auditor', name:'Sara Auditor',      role:'auditor',           active:true},
    ],
    // ============ EMPTY MASTER DATA — storekeeper fills these in ============
    items: [],
    categories: [],
    suppliers: [],
    departments: [],
    units: ['pcs','kg','m','L','box','roll','set','pair','litre','ton','meter'],

    transactions: [],
    auditLogs: [],
    notifications: [],
    settings: {
      company:'Ethiopian Warehouse Co.',
      address:'Addis Ababa, Ethiopia',
      phone:'+251-11-XXX-XXXX',
      currency:'ETB',
      dateFormat:'YYYY-MM-DD',
      slaHours: 24,
      allowNegativeStock: false,
      approvalRules: {
        STOCK_IN:    {enabled:true, qtyThreshold:0,   valueThreshold:0,     level1Role:'warehouse_manager'},
        STOCK_OUT:   {enabled:true, qtyThreshold:100, valueThreshold:50000, level1Role:'warehouse_manager'},
        ADJUSTMENT:  {enabled:true, qtyThreshold:10,  valueThreshold:0,     level1Role:'warehouse_manager'},
      }
    },
    seq: {IN:1, OUT:1, ADJ:1, OPEN:1}
  };
}

let db = loadDB();

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const d = defaultDB();
  localStorage.setItem(DB_KEY, JSON.stringify(d));
  return d;
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

// ==================== AUTH & PERMISSIONS ====================
let currentUser = null;

const ROLE_LABELS = {
  super_admin: 'Super Admin',
  warehouse_manager: 'Warehouse Manager',
  storekeeper: 'Storekeeper',
  auditor: 'Auditor / Viewer'
};

// Storekeeper now has master-data permissions so they can build the catalogue.
const PERMISSIONS = {
  super_admin: ['*'],
  warehouse_manager: [
    'view_dashboard','view_items','manage_items','view_categories','manage_categories',
    'view_suppliers','manage_suppliers','view_departments','manage_departments',
    'create_stockin','create_stockout','create_adjustment','submit_transaction',
    'view_transactions','approve_transactions','reject_transactions','return_transactions',
    'reverse_transactions','view_reports','view_analysis','view_audit','view_stock',
    'manage_users','manage_settings','manage_approval_rules','view_approval_history',
    'export_data','import_data'
  ],
  storekeeper: [
    // Dashboard / stock
    'view_dashboard','view_stock','view_transactions','view_item_history',
    // MASTER DATA — storekeeper can now set up items, categories, suppliers, departments
    'view_items','manage_items',
    'view_categories','manage_categories',
    'view_suppliers','manage_suppliers',
    'view_departments','manage_departments',
    // Operations
    'create_stockin','create_stockout','create_adjustment','submit_transaction',
    'scan_barcode',
    // Reporting
    'view_reports','view_analysis','view_approval_history','export_data'
  ],
  auditor: [
    'view_dashboard','view_items','view_stock','view_categories','view_suppliers',
    'view_departments','view_transactions','view_reports','view_analysis',
    'view_audit','view_approval_history'
  ]
};

function can(perm){
  if(!currentUser) return false;
  const perms = PERMISSIONS[currentUser.role] || [];
  return perms.includes('*') || perms.includes(perm);
}

function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const user = db.users.find(x => x.username === u && x.password === p && x.active);
  if(!user){ toast('Invalid credentials','error'); return; }
  currentUser = user;
  localStorage.setItem('wms_session', user.id);
  enterApp();
}
function logout(){
  currentUser = null;
  localStorage.removeItem('wms_session');
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userRole').textContent = ROLE_LABELS[currentUser.role];
  document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
  document.getElementById('brandSub').textContent = db.settings.company;
  buildNav();
  // First-time storekeeper → force Setup Guide
  if(isEmptyMasterData()){
    go('setup');
  } else {
    go('dashboard');
  }
  updateNotifBadge();
}

function isEmptyMasterData(){
  return db.items.length === 0 && db.categories.length === 0 &&
         db.suppliers.length === 0 && db.departments.length === 0;
}

// ==================== NAV ====================
const NAV_ITEMS = [
  {section:'MAIN'},
  {page:'dashboard', label:'Dashboard', icon:'📊'},
  {page:'setup', label:'Setup Guide', icon:'🚀', perm:'manage_items'},
  {page:'approvals', label:'Approval Center', icon:'✅', badge:'pending'},

  {section:'MASTER DATA'},
  {page:'items', label:'Items / Products', icon:'📦', perm:'view_items'},
  {page:'categories', label:'Categories', icon:'🏷️', perm:'view_categories'},
  {page:'suppliers', label:'Suppliers', icon:'🚚', perm:'view_suppliers'},
  {page:'departments', label:'Departments', icon:'🏢', perm:'view_departments'},

  {section:'OPERATIONS'},
  {page:'stockin', label:'Stock IN', icon:'📥', perm:'view_transactions'},
  {page:'stockout', label:'Stock OUT', icon:'📤', perm:'view_transactions'},
  {page:'currentstock', label:'Current Stock', icon:'📋', perm:'view_stock'},
  {page:'adjustment', label:'Stock Adjustment', icon:'⚖️', perm:'view_transactions'},
  {page:'history', label:'Stock History', icon:'📜', perm:'view_transactions'},

  {section:'ANALYSIS'},
  {page:'analysis', label:'Inventory Analysis', icon:'📈', perm:'view_analysis'},
  {page:'fastmoving', label:'Fast-Moving', icon:'⚡', perm:'view_analysis'},
  {page:'slowmoving', label:'Slow-Moving', icon:'🐢', perm:'view_analysis'},
  {page:'deadstock', label:'Dead Stock', icon:'💀', perm:'view_analysis'},

  {section:'REPORTS'},
  {page:'reports', label:'Reports', icon:'📄', perm:'view_reports'},

  {section:'ADMIN'},
  {page:'users', label:'Users & Roles', icon:'👥', perm:'manage_users'},
  {page:'audit', label:'Audit Log', icon:'🔒', perm:'view_audit'},
  {page:'settings', label:'Settings', icon:'⚙️'},
];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    if(item.section){
      const s = document.createElement('div');
      s.className = 'section'; s.textContent = item.section;
      nav.appendChild(s);
      return;
    }
    if(item.perm && !can(item.perm)) return;
    const a = document.createElement('a');
    a.dataset.page = item.page;
    a.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    if(item.badge === 'pending'){
      const pending = getPendingForUser();
      if(pending.length > 0){
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = pending.length;
        a.appendChild(b);
      }
    }
    a.onclick = () => { go(item.page); document.getElementById('sidebar').classList.remove('open'); };
    nav.appendChild(a);
  });
}

// ==================== ROUTER ====================
let currentPage = 'dashboard';

function go(page){
  currentPage = page;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  document.querySelectorAll('.mobile-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const titles = {
    dashboard:'Dashboard', setup:'Setup Guide', items:'Items / Products', categories:'Categories',
    suppliers:'Suppliers', departments:'Departments / Recipients',
    stockin:'Stock IN', stockout:'Stock OUT', currentstock:'Current Stock',
    adjustment:'Stock Adjustment', history:'Stock History', analysis:'Inventory Analysis',
    fastmoving:'Fast-Moving Items', slowmoving:'Slow-Moving Items', deadstock:'Dead Stock',
    reports:'Reports', users:'Users & Roles', audit:'Audit Log', settings:'Settings',
    approvals:'Approval Center', search:'Search Item', itemdetail:'Item Details'
  };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  const c = document.getElementById('content');
  const renderers = {
    dashboard: renderDashboard, setup: renderSetup,
    items: renderItems, categories: renderCategories,
    suppliers: renderSuppliers, departments: renderDepartments,
    stockin: renderStockIn, stockout: renderStockOut, currentstock: renderCurrentStock,
    adjustment: renderAdjustment, history: renderHistory, analysis: renderAnalysis,
    fastmoving: renderFastMoving, slowmoving: renderSlowMoving, deadstock: renderDeadStock,
    reports: renderReports, users: renderUsers, audit: renderAudit, settings: renderSettings,
    approvals: renderApprovals, search: renderSearch
  };
  (renderers[page] || renderDashboard)(c);
}

// ==================== CORE HELPERS ====================
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n, dec=2){
  const num = Number(n)||0;
  return num.toLocaleString('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function fmtQty(n){ return (Number(n)||0).toLocaleString('en-US'); }
function fmtMoney(n){ return `${db.settings.currency} ${fmt(n)}`; }
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toISOString().slice(0,10);
}
function fmtDateTime(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return dt;
  return dt.toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function today(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._tid);
  t._tid = setTimeout(()=> t.classList.remove('show'), 2800);
}

function getItem(id){ return db.items.find(i => i.id === id); }
function getCategory(id){ return db.categories.find(c => c.id === id); }
function getSupplier(id){ return db.suppliers.find(s => s.id === id); }
function getDepartment(id){ return db.departments.find(d => d.id === id); }
function getUser(id){ return db.users.find(u => u.id === id); }

function nextTxnNumber(type){
  const prefix = {STOCK_IN:'IN', STOCK_OUT:'OUT', ADJUSTMENT_IN:'ADJ', ADJUSTMENT_OUT:'ADJ', OPENING:'OPEN'}[type] || 'TXN';
  const n = db.seq[prefix] || 1;
  db.seq[prefix] = n + 1;
  return `${prefix}-${String(n).padStart(5,'0')}`;
}

function getStock(itemId){
  let qty = 0;
  db.transactions.forEach(t => {
    if(t.status !== 'Approved') return;
    t.items.forEach(line => {
      if(line.itemId !== itemId) return;
      if(['STOCK_IN','OPENING','ADJUSTMENT_IN'].includes(t.type)) qty += line.qty;
      else if(['STOCK_OUT','ADJUSTMENT_OUT'].includes(t.type)) qty -= line.qty;
    });
  });
  return qty;
}

function getPendingOut(itemId){
  let qty = 0;
  db.transactions.forEach(t => {
    if(t.status !== 'Pending Approval' && t.status !== 'Submitted') return;
    if(t.type !== 'STOCK_OUT' && t.type !== 'ADJUSTMENT_OUT') return;
    t.items.forEach(line => { if(line.itemId === itemId) qty += line.qty; });
  });
  return qty;
}

function getStockStatus(item){
  const qty = getStock(item.id);
  if(qty <= 0) return {label:'Out of Stock', cls:'s-out'};
  if(qty <= item.minStock) return {label:'Critical', cls:'s-critical'};
  if(qty <= item.reorderLevel) return {label:'Low Stock', cls:'s-low'};
  return {label:'Normal', cls:'s-normal'};
}

function getInventoryValue(){
  let total = 0;
  db.items.forEach(i => {
    if(i.status === 'Inactive') return;
    const qty = getStock(i.id);
    if(qty > 0) total += qty * (i.unitCost || 0);
  });
  return total;
}

function addAudit(action, details={}){

    id: uid(),

    userName: currentUser?.name || 'System',

    txnNumber: details.txnNumber || '',

  });

// ==================== APPROVAL WORKFLOW ====================
function getRequiredApprovalRole(type, totalQty, totalValue){
  const rule = db.settings.approvalRules[type] || {enabled:false};
  if(!rule.enabled) return null;
  if(type === 'STOCK_OUT'){
    if(totalQty >= (rule.qtyThreshold || 0) || totalValue >= (rule.valueThreshold || 0)){
      return rule.level1Role || 'warehouse_manager';
    }
  } else if(type === 'ADJUSTMENT'){
    if(totalQty >= (rule.qtyThreshold || 0)){
      return rule.level1Role || 'warehouse_manager';
    }
  }
  return rule.level1Role || 'warehouse_manager';
}

function getPendingForUser(){
  if(!currentUser) return [];
  const approverRoles = ['super_admin','warehouse_manager'];
  if(!approverRoles.includes(currentUser.role)) return [];
  return db.transactions.filter(t =>
    t.status === 'Pending Approval' &&
    t.requiredRole === currentUser.role &&
    t.requestedBy !== currentUser.id
  );
}

function submitTransaction(txnId){
  const t = db.transactions.find(x => x.id === txnId);
  if(!t) return;
  const totalQty = t.items.reduce((s,i)=>s+i.qty,0);
  const totalValue = t.items.reduce((s,i)=>s+i.qty*(i.unitCost||0),0);
  const role = getRequiredApprovalRole(t.type === 'STOCK_IN' ? 'STOCK_IN' : t.type === 'STOCK_OUT' ? 'STOCK_OUT' : 'ADJUSTMENT', totalQty, totalValue);

  t.status = role ? 'Pending Approval' : 'Approved';
  t.submittedAt = nowISO();
  t.requiredRole = role;
  t.approvalLevel = 1;
  t.approvalHistory = t.approvalHistory || [];
  t.approvalHistory.push({date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Submitted',comment:'Ready for approval'});

  if(t.status === 'Approved'){
    t.approvedAt = nowISO();
    t.approvedBy = currentUser.id;
    t.approvalHistory.push({date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Auto-Approved',comment:'No approval required'});
    applyInventoryEffects(t);
    addAudit(`Approved ${t.number} (auto)`, {txnNumber:t.number, note:'No approval required'});
  } else {
    db.users.filter(u => u.role === role).forEach(u => {
      notify(u.id, 'New transaction awaiting approval', `${t.number} - ${t.type.replace('_',' ')}`, t.number);
    });
    addAudit(`Submitted ${t.number}`, {txnNumber:t.number, note:'Awaiting approval'});
  }
  saveDB();
}

function applyInventoryEffects(t){
  if(t.type === 'STOCK_IN' || t.type === 'OPENING'){
    t.items.forEach(line => {
      const item = getItem(line.itemId);
      if(!item) return;
      const currentQty = getStock(item.id) - line.qty;
      const currentVal = currentQty * (item.unitCost || 0);
      const newQty = currentQty + line.qty;
      const newVal = currentVal + line.qty * (line.unitCost || 0);
      if(newQty > 0){
        item.unitCost = +(newVal / newQty).toFixed(2);
        item.updatedAt = nowISO();
      }
    });
  }
}

function approveTransaction(txnId, comment){
  const t = db.transactions.find(x => x.id === txnId);
  if(!t) return;
  if(t.requestedBy === currentUser.id){ toast('You cannot approve your own transaction','error'); return; }
  if(t.type === 'STOCK_OUT'){
    for(const line of t.items){
      const available = getStock(line.itemId) - getPendingOut(line.itemId) + line.qty;
      if(!db.settings.allowNegativeStock && line.qty > available){
        const item = getItem(line.itemId);
        toast(`Insufficient stock for ${item?.name}: available ${available}, requested ${line.qty}`,'error');
        return;
      }
    }
  }
  t.status = 'Approved';
  t.approvedAt = nowISO();
  t.approvedBy = currentUser.id;
  t.approvalHistory = t.approvalHistory || [];
  t.approvalHistory.push({date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Approved',comment:comment||''});
  applyInventoryEffects(t);
  addAudit(`Approved ${t.number}`, {txnNumber:t.number, note:comment||''});
  notify(t.requestedBy, 'Transaction approved', `${t.number} has been approved by ${currentUser.name}`, t.number);
  saveDB();
  toast('Transaction approved','success');
}

function rejectTransaction(txnId, reason){
  const t = db.transactions.find(x => x.id === txnId);
  if(!t) return;
  if(!reason){ toast('Rejection reason required','error'); return; }
  t.status = 'Rejected';
  t.rejectedAt = nowISO();
  t.rejectedBy = currentUser.id;
  t.rejectionReason = reason;
  t.approvalHistory = t.approvalHistory || [];
  t.approvalHistory.push({date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Rejected',comment:reason});
  addAudit(`Rejected ${t.number}`, {txnNumber:t.number, note:reason});
  notify(t.requestedBy, 'Transaction rejected', `${t.number} was rejected: ${reason}`, t.number);
  saveDB();
  toast('Transaction rejected','warn');
}

function returnTransaction(txnId, comment){
  const t = db.transactions.find(x => x.id === txnId);
  if(!t) return;
  if(!comment){ toast('Comment required','error'); return; }
  t.status = 'Needs Correction';
  t.approvalHistory = t.approvalHistory || [];
  t.approvalHistory.push({date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Returned',comment});
  addAudit(`Returned ${t.number} for correction`, {txnNumber:t.number, note:comment});
  notify(t.requestedBy, 'Transaction returned for correction', `${t.number}: ${comment}`, t.number);
  saveDB();
  toast('Returned for correction','warn');
}

function reverseTransaction(txnId, reason){
  const t = db.transactions.find(x => x.id === txnId);
  if(!t || t.status !== 'Approved') return;
  if(!reason){ toast('Reversal reason required','error'); return; }
  t.status = 'Reversed';
  t.reversedAt = nowISO();
  t.reversedBy = currentUser.id;
  t.reversalReason = reason;
  t.approvalHistory = t.approvalHistory || [];
  t.approvalHistory.push({date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Reversed',comment:reason});
  addAudit(`Reversed ${t.number}`, {txnNumber:t.number, note:reason});
  saveDB();
  toast('Transaction reversed','warn');
}

function typePill(type){
  const map = {
    STOCK_IN:['📥','In','#dcfce7','#166534'],
    STOCK_OUT:['📤','Out','#fee2e2','#991b1b'],
    ADJUSTMENT_IN:['⚖️','Adj+','#dbeafe','#1e40af'],
    ADJUSTMENT_OUT:['⚖️','Adj-','#fef3c7','#92400e'],
    OPENING:['🏁','Opening','#e0e7ff','#3730a3']
  };
  const [icon,label,bg,color] = map[type] || ['•',type,'#e2e8f0','#475569'];
  return `<span class="pill" style="background:${bg};color:${color}">${icon} ${label}</span>`;
}
function statusPill(status){
  const map = {
    'Draft':'s-draft','Pending Approval':'s-pending','Submitted':'s-pending',
    'Approved':'s-approved','Rejected':'s-rejected','Needs Correction':'s-correction',
    'Reversed':'s-reversed','Cancelled':'s-rejected'
  };
  return `<span class="badge-status ${map[status]||'s-draft'}">${esc(status)}</span>`;
}

function updateChart(){
  const el = document.getElementById('chartRange');
  if(!el) return;
  const range = el.value;
  const labels = [], inData = [], outData = [], netData = [];
  let start, days = 7;
  const now = new Date();

  if(range === 'today'){
    for(let h=0; h<24; h+=3){ labels.push(`${String(h).padStart(2,'0')}:00`); inData.push(0); outData.push(0); netData.push(0); }
    const todayStr = today();
    db.transactions.filter(t => t.status==='Approved' && t.date === todayStr).forEach(t => {
      t.items.forEach(i => {
        const h = new Date(t.approvedAt || t.submittedAt || now).getHours();
        const idx = Math.floor(h/3);
        if(t.type === 'STOCK_IN') inData[idx] += i.qty;
        else if(t.type === 'STOCK_OUT') outData[idx] += i.qty;
      });
    });
    for(let i=0;i<labels.length;i++) netData[i] = inData[i] - outData[i];
  } else {
    if(range === 'week'){ start = new Date(now); start.setDate(now.getDate()-6); days = 7; }
    else if(range === 'month'){ start = new Date(now.getFullYear(), now.getMonth(), 1); days = now.getDate(); }
    else if(range === '3month'){ start = new Date(now); start.setMonth(now.getMonth()-2); start.setDate(1); days = 90; }
    else if(range === 'year'){ start = new Date(now.getFullYear(), 0, 1); days = 365; }

    const buckets = {};
    for(let d=0; d<days; d++){
      const dt = new Date(start); dt.setDate(start.getDate()+d);
      const key = dt.toISOString().slice(0,10);
      buckets[key] = {in:0,out:0};
    }
    db.transactions.filter(t => t.status === 'Approved' && t.date >= start.toISOString().slice(0,10)).forEach(t => {
      if(!buckets[t.date]) return;
      t.items.forEach(i => {
        if(t.type === 'STOCK_IN') buckets[t.date].in += i.qty;
        else if(t.type === 'STOCK_OUT') buckets[t.date].out += i.qty;
      });
    });
    Object.keys(buckets).sort().forEach(k => {
      labels.push(k.slice(5));
      inData.push(buckets[k].in);
      outData.push(buckets[k].out);
      netData.push(buckets[k].in - buckets[k].out);
    });
  }

  const ctx = document.getElementById('movementChart');
  if(!ctx) return;
  if(dashChart) dashChart.destroy();
  dashChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {label:'Stock IN', data:inData, borderColor:'#16a34a', backgroundColor:'rgba(22,163,74,.1)', fill:true, tension:.3, borderWidth:2},
        {label:'Stock OUT', data:outData, borderColor:'#dc2626', backgroundColor:'rgba(220,38,38,.1)', fill:true, tension:.3, borderWidth:2},
        {label:'Net Movement', data:netData, borderColor:'#0284c7', backgroundColor:'rgba(2,132,199,.1)', fill:true, tension:.3, borderWidth:2, borderDash:[4,4]}
      ]
    },
    options: {responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}}}
  });
}

function renderItems(c){
  if(db.categories.length === 0){
    c.innerHTML = `
      <div class="empty-state">
        <div class="icon">🏷️</div>
        <h3>Create a category first</h3>
        <p>Items must belong to a category. Start by creating at least one category, then come back to add items.</p>
        <button class="btn" onclick="go('categories')">Go to Categories</button>
      </div>`;
    return;
  }
  const filter = {q:'', cat:'', status:'', stock:''};

  function list(){
    const f = filter;
    return db.items.filter(i => {
      if(f.q){
        const q = f.q.toLowerCase();
        if(!(i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q) || (i.barcode||'').includes(q) || (i.sku||'').toLowerCase().includes(q))) return false;
      }
      if(f.cat && i.categoryId !== +f.cat) return false;
      if(f.status && i.status !== f.status) return false;
      if(f.stock){
        const s = getStockStatus(i).label;
        if(f.stock !== s) return false;
      }
      return true;
    });
  }

  function render(){
    const items = list();
    document.getElementById('itemsTableBody').innerHTML = items.length
      ? items.map(i => {
          const s = getStockStatus(i);
          const qty = getStock(i.id);
          const cat = getCategory(i.categoryId);
          return `<tr>
            <td><b>${esc(i.code)}</b></td>
            <td><b>${esc(i.name)}</b><br><span style="font-size:11px;color:var(--muted)">${esc(i.sku||'')} · ${esc(i.barcode||'')}</span></td>
            <td>${esc(cat?.name || '-')}</td>
            <td>${esc(i.warehouse||'')} · ${esc(i.rack||'')} · ${esc(i.shelf||'')} · ${esc(i.bin||'')}</td>
            <td class="num">${fmtQty(qty)} ${esc(i.unit)}</td>
            <td class="num">${fmt(i.unitCost)}</td>
            <td class="num">${fmt(qty * i.unitCost)}</td>
            <td><span class="badge-status ${s.cls}">${s.label}</span></td>
            <td><span class="pill" style="background:${i.status==='Active'?'#dcfce7':'#e2e8f0'};color:${i.status==='Active'?'#166534':'#64748b'}">${i.status}</span></td>
            <td style="white-space:nowrap">
              <button class="btn sec sm" onclick="viewItemDetail(${i.id})">View</button>
              ${can('manage_items') ? `<button class="btn sec sm" onclick="editItem(${i.id})">Edit</button>` : ''}
            </td>
          </tr>`;
        }).join('')
      : '<tr><td colspan="10" class="empty">No items match your filters</td></tr>';
  }

  c.innerHTML = `
    <div class="filter-bar">
      <div class="field"><label>Search</label><input id="itemSearch" placeholder="Name, code, barcode..."></div>
      <div class="field"><label>Category</label><select id="itemCat"><option value="">All</option>${db.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="itemStatus"><option value="">All</option><option>Active</option><option>Inactive</option></select></div>
      <div class="field"><label>Stock Status</label><select id="itemStock"><option value="">All</option><option>Normal</option><option>Low Stock</option><option>Critical</option><option>Out of Stock</option></select></div>
      <button class="btn sec" onclick="resetItemFilters()">Reset</button>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h4>📦 Items (${db.items.length})</h4>
        <button class="btn sec sm" onclick="go('search')">🔍 Scan/Search</button>
        ${can('manage_items') ? `
          <button class="btn sm" onclick="newItem()">+ Add Item</button>
          <button class="btn sec sm" onclick="exportItemsExcel()">⬇ Export</button>
        ` : ''}
      </div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Location</th><th class="num">Stock</th><th class="num">Unit Cost</th><th class="num">Value</th><th>Status</th><th>Active</th><th></th></tr></thead>
            <tbody id="itemsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;
  render();

  ['itemSearch','itemCat','itemStatus','itemStock'].forEach(id => {
    const el = document.getElementById(id);

function saveItem(id){
  const data = {
    code: document.getElementById('f_code').value.trim(),
    sku: document.getElementById('f_sku').value.trim(),
    barcode: document.getElementById('f_barcode').value.trim(),
    name: document.getElementById('f_name').value.trim(),
    desc: document.getElementById('f_desc').value.trim(),
    categoryId: +document.getElementById('f_cat').value || null,
    subcategory: document.getElementById('f_sub').value.trim(),
    unit: document.getElementById('f_unit').value,
    unitCost: +document.getElementById('f_cost').value || 0,
    minStock: +document.getElementById('f_min').value || 0,
    reorderLevel: +document.getElementById('f_reorder').value || 0,
    maxStock: +document.getElementById('f_max').value || 0,
    supplierId: +document.getElementById('f_sup').value || null,
    warehouse: document.getElementById('f_wh').value.trim(),
    building: document.getElementById('f_bld').value.trim(),
    rack: document.getElementById('f_rack').value.trim(),
    shelf: document.getElementById('f_shelf').value.trim(),
    bin: document.getElementById('f_bin').value.trim(),
    status: document.getElementById('f_status').value
  };
  if(!data.code || !data.name){ toast('Code and Name required','error'); return; }
  if(db.items.some(i => i.code === data.code && i.id !== id)){ toast('Item code already exists','error'); return; }

  if(id){
    const item = getItem(id);
    Object.assign(item, data, {updatedAt: nowISO()});
    addAudit(`Updated item ${item.code}`, {itemId:item.id, itemName:item.name});
    toast('Item updated','success');
  } else {
    const item = {...data, id: Date.now(), createdAt: nowISO(), updatedAt: nowISO()};
    db.items.push(item);
    addAudit(`Created item ${item.code}`, {itemId:item.id, itemName:item.name});
    toast('Item created','success');
  }
  saveDB();
  closeModal();
  go('items');
}

function exportItemsExcel(){
  const rows = [['Code','SKU','Barcode','Name','Category','Unit','Stock','Unit Cost','Value','Min','Reorder','Location','Status']];
  db.items.forEach(i => {
    const qty = getStock(i.id);
    rows.push([i.code, i.sku, i.barcode, i.name, getCategory(i.categoryId)?.name||'', i.unit, qty, i.unitCost, (qty*i.unitCost).toFixed(2), i.minStock, i.reorderLevel, `${i.warehouse} ${i.rack}/${i.shelf}/${i.bin}`, i.status]);
  });
  downloadCSV('items', rows);
}
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}_${today()}.csv`;
  a.click();
}

function viewItemDetail(id){

  const history = [];

    const line = t.items.find(i => i.itemId === id);
    history.push({date:t.date, type:t.type, ref:t.number, in:['STOCK_IN','OPENING','ADJUSTMENT_IN'].includes(t.type)?line.qty:0, out:['STOCK_OUT','ADJUSTMENT_OUT'].includes(t.type)?line.qty:0, status:t.status, user:getUser(t.requestedBy)?.name||'-'});

      </div>

        <div class="panel-head"><h4>Details</h4></div>
        <div class="panel-body">
          <div class="stat-row"><span>Code / SKU / Barcode</span><b>${esc(item.code)} · ${esc(item.sku||'-')} · ${esc(item.barcode||'-')}</b></div>
          <div class="stat-row"><span>Category</span><b>${esc(getCategory(item.categoryId)?.name||'-')} / ${esc(item.subcategory||'-')}</b></div>
          <div class="stat-row"><span>Location</span><b>${esc(item.warehouse)} · Bldg ${esc(item.building||'-')} · Rack ${esc(item.rack||'-')} · Shelf ${esc(item.shelf||'-')} · Bin ${esc(item.bin||'-')}</b></div>
          <div class="stat-row"><span>Supplier</span><b>${esc(getSupplier(item.supplierId)?.name||'-')}</b></div>

          <div class="stat-row"><span>Unit Cost</span><b>${fmtMoney(item.unitCost)}</b></div>
          ${item.desc?`<div class="stat-row"><span>Description</span><b>${esc(item.desc)}</b></div>`:''}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h4>📜 Transaction History</h4></div>
        <div class="panel-body" style="padding:0">
          <div class="table-wrap" style="border:none">

              <tbody>
                ${history.map(h => {
                  if(h.status === 'Approved') balance += h.in - h.out;
                  return `<tr>
                    <td>${fmtDate(h.date)}</td>
                    <td>${typePill(h.type)}</td>
                    <td>${esc(h.ref)}</td>
                    <td class="num">${h.in?fmtQty(h.in):'-'}</td>
                    <td class="num">${h.out?fmtQty(h.out):'-'}</td>

            </table>
          </div>
        </div>
      </div>
    </div>

  `);
}

function saveStockOut(mode){
  const valid = stockOutCart.filter(l => l.itemId && l.qty > 0);
  if(valid.length === 0){ toast('Add at least one item','error'); return; }

  for(const l of valid){
    const item = getItem(+l.itemId);
    const avail = getStock(item.id) - getPendingOut(item.id);
    if(!db.settings.allowNegativeStock && l.qty > avail){
      toast(`Insufficient stock for ${item.name}. Available: ${avail}`,'error');
      return;
    }
  }

  const txn = {
    id: uid(),
    number: nextTxnNumber('STOCK_OUT'),
    type: 'STOCK_OUT',
    date: document.getElementById('out_date').value || today(),
    departmentId: +document.getElementById('out_dept').value || null,

  };
  db.transactions.unshift(txn);
  addAudit(`Created ${txn.number}`, {txnNumber:txn.number, note:`${valid.length} item(s)`});

  if(mode === 'submit'){
    submitTransaction(txn.id);
    const t = db.transactions.find(x=>x.id===txn.id);
    toast(t.status === 'Approved' ? 'Stock OUT approved automatically' : 'Stock OUT submitted for approval', 'success');

function renderCurrentStock(c){
  if(db.items.length === 0){
    c.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <h3>No items in catalogue</h3>
        <p>Once you add items, their current stock will appear here.</p>
        <button class="btn" onclick="go('items')">Go to Items</button>
      </div>`;
    return;
  }
  let filter = {q:'', cat:'', status:''};
  function render(){
    const items = db.items.filter(i => {
      if(filter.q){
        const q = filter.q.toLowerCase();
        if(!(i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q))) return false;
      }
      if(filter.cat && i.categoryId !== +filter.cat) return false;
      if(filter.status && getStockStatus(i).label !== filter.status) return false;
      return true;
    });
    const totalQty = items.reduce((s,i)=>s+Math.max(0,getStock(i.id)),0);
    const totalVal = items.reduce((s,i)=>s+Math.max(0,getStock(i.id))*i.unitCost,0);

    document.getElementById('csBody').innerHTML = items.length ? items.map(i => {
      const qty = getStock(i.id);
      const s = getStockStatus(i);
      return `<tr>
        <td><b>${esc(i.code)}</b></td>
        <td><b>${esc(i.name)}</b><br><span style="font-size:11px;color:var(--muted)">${esc(getCategory(i.categoryId)?.name||'-')}</span></td>
        <td>${esc(i.warehouse)} · ${esc(i.rack)}/${esc(i.shelf)}/${esc(i.bin)}</td>
        <td class="num"><b>${fmtQty(qty)}</b> ${esc(i.unit)}</td>
        <td class="num">${fmtQty(i.minStock)}</td>
        <td class="num">${fmtQty(i.reorderLevel)}</td>
        <td class="num">${fmt(i.unitCost)}</td>
        <td class="num">${fmt(qty*i.unitCost)}</td>
        <td><span class="badge-status ${s.cls}">${s.label}</span></td>
      </tr>`;
    }).join('') : '<tr><td colspan="9" class="empty">No items match filters</td></tr>';

    document.getElementById('csSummary').innerHTML = `
      <div class="card"><div class="label">Items</div><div class="value">${items.length}</div></div>
      <div class="card info"><div class="label">Total Qty</div><div class="value">${fmtQty(totalQty)}</div></div>
      <div class="card success"><div class="label">Total Value</div><div class="value" style="font-size:18px">${fmtMoney(totalVal)}</div></div>`;
  }

  c.innerHTML = `
    <div class="filter-bar">
      <div class="field"><label>Search</label><input id="cs_q" placeholder="Item name or code"></div>
      <div class="field"><label>Category</label><select id="cs_cat"><option value="">All</option>${db.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="cs_status"><option value="">All</option><option>Normal</option><option>Low Stock</option><option>Critical</option><option>Out of Stock</option></select></div>
    </div>
    <div class="cards" id="csSummary"></div>
    <div class="panel">
      <div class="panel-head"><h4>📦 Current Stock</h4>
        <button class="btn sec sm" onclick="exportCurrentStock()">⬇ Export</button></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Code</th><th>Item</th><th>Location</th><th class="num">Qty</th><th class="num">Min</th><th class="num">Reorder</th><th class="num">Unit Cost</th><th class="num">Value</th><th>Status</th></tr></thead>
            <tbody id="csBody"></tbody>
          </table>
        </div>
      </div>
    </div>`;
  render();
  document.getElementById('cs_q').addEventListener('input', e => { filter.q = e.target.value; render(); });
  document.getElementById('cs_cat').addEventListener('change', e => { filter.cat = e.target.value; render(); });
  document.getElementById('cs_status').addEventListener('change', e => { filter.status = e.target.value; render(); });
}
function exportCurrentStock(){
  const rows = [['Code','Name','Location','Qty','Unit','Min','Reorder','Unit Cost','Value','Status']];
  db.items.forEach(i => {
    const qty = getStock(i.id);
    rows.push([i.code, i.name, `${i.warehouse} ${i.rack}/${i.shelf}/${i.bin}`, qty, i.unit, i.minStock, i.reorderLevel, i.unitCost, (qty*i.unitCost).toFixed(2), getStockStatus(i).label]);
  });
  downloadCSV('current_stock', rows);
}

            <tbody>
              ${db.transactions.filter(t=>t.type==='ADJUSTMENT_IN'||t.type==='ADJUSTMENT_OUT').slice(0,20).map(t => {
                const line = t.items[0];

function updateAdjPreview(){
  const itemId = +document.getElementById('adj_item').value;
  if(!itemId){ document.getElementById('adj_sys').value = ''; document.getElementById('adj_diff').value = ''; return; }
  const sys = getStock(itemId);
  document.getElementById('adj_sys').value = sys;
  const phys = +document.getElementById('adj_phys').value;
  if(!isNaN(phys)) document.getElementById('adj_diff').value = (phys - sys);
}
function submitAdjustment(){
  const itemId = +document.getElementById('adj_item').value;
  const sys = +document.getElementById('adj_sys').value;
  const phys = +document.getElementById('adj_phys').value;
  const reason = document.getElementById('adj_reason').value;
  const notes = document.getElementById('adj_notes').value.trim();
  const ref = document.getElementById('adj_ref').value.trim();

  if(!itemId){ toast('Select an item','error'); return; }
  if(isNaN(phys)){ toast('Enter physical quantity','error'); return; }
  const diff = phys - sys;
  if(diff === 0){ toast('No difference to adjust','warn'); return; }
  if(!notes){ toast('Explanation required','error'); return; }

  const item = getItem(itemId);
  const type = diff > 0 ? 'ADJUSTMENT_IN' : 'ADJUSTMENT_OUT';

  const txn = {
    id: uid(),
    number: nextTxnNumber(type),
    type,
    date: today(),
    reason, notes, reference: ref,
    adjSystem: sys,
    adjPhysical: phys,
    adjDiff: diff,
    items: [{itemId, qty: Math.abs(diff), unitCost:item.unitCost, unit:item.unit}],
    status: 'Pending Approval',
    requestedBy: currentUser.id,
    createdAt: nowISO(),
    submittedAt: nowISO(),
    requiredRole: 'warehouse_manager',
    approvalLevel: 1,
    approvalHistory: [
      {date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Created',comment:`System ${sys} → Physical ${phys}`},
      {date:nowISO(),userId:currentUser.id,userName:currentUser.name,action:'Submitted',comment:'Awaiting approval'}
    ]
  };
  db.transactions.unshift(txn);
  addAudit(`Submitted adjustment ${txn.number}`, {txnNumber:txn.number, itemId:item.id, itemName:item.name, oldQty:sys, newQty:phys});
  db.users.filter(u=>u.role==='warehouse_manager'||u.role==='super_admin').forEach(u => {
    notify(u.id, 'Adjustment awaiting approval', `${txn.number} - ${item.name} (${diff>0?'+':''}${diff})`, txn.number);
  });
  saveDB();
  toast('Adjustment request submitted for approval','success');
  go('adjustment');
}

              </tr>`;
            }).join('')}
            <tr><td colspan="3" style="text-align:right"><b>Total</b></td><td class="num"><b>${fmt(totalVal)}</b></td><td></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="panel-head"><h4>Approval History</h4></div>
      <div class="panel-body">
        ${(t.approvalHistory||[]).map(h => `
          <div style="padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px">

      </div>
    </div>
  </div>
  <div class="modal-foot">`;

  if(t.status === 'Draft' && t.requestedBy === currentUser.id){
    html += `<button class="btn" onclick="submitTransaction('${t.id}');closeModal();go('history')">Submit for Approval</button>`;

  if(t.status === 'Pending Approval' && t.requestedBy !== currentUser.id && can('approve_transactions')){

             <button class="btn danger" onclick="rejectFromView('${t.id}')">Reject</button>
             <button class="btn success" onclick="approveFromView('${t.id}')">Approve</button>`;
  }
  if(t.status === 'Approved' && can('reverse_transactions')){
    html += `<button class="btn danger" onclick="reverseFromView('${t.id}')">Reverse</button>`;
  }

  }

  openModal(html);
}

function waitTime(since){
  if(!since) return '-';
  const ms = new Date() - new Date(since);
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  if(h < 24) return `${h}h ${m}m`;
  return `${Math.floor(h/24)}d ${h%24}h`;
}

function renderFastMoving(c){
  let period = 30;
  function render(){
    const since = new Date(); since.setDate(since.getDate() - period);
    const sinceStr = since.toISOString().slice(0,10);
    const stats = {};
    db.transactions.filter(t => t.type === 'STOCK_OUT' && t.status === 'Approved' && t.date >= sinceStr).forEach(t => {
      t.items.forEach(l => {
        if(!stats[l.itemId]) stats[l.itemId] = {qty:0, count:0};
        stats[l.itemId].qty += l.qty;
        stats[l.itemId].count++;
      });
    });
    const rows = Object.entries(stats).sort((a,b)=>b[1].qty-a[1].qty);
    document.getElementById('fastBody').innerHTML = rows.length ? rows.map(([itemId, s], idx) => {
      const item = getItem(+itemId);
      return `<tr>
        <td><b>#${idx+1}</b></td>
        <td>${esc(item?.name||'-')}</td>
        <td>${esc(item?.code||'-')}</td>
        <td class="num"><b>${fmtQty(s.qty)}</b> ${esc(item?.unit||'')}</td>
        <td class="num">${s.count}</td>
        <td class="num">${fmtQty(getStock(+itemId))}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">No movement in period</td></tr>';
  }
  c.innerHTML = `
    <div class="tabs">
      ${[7,30,90,365].map(d => `<button class="${d===period?'active':''}" onclick="setFastPeriod(${d})">${d} days</button>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h4>⚡ Fast-Moving Items</h4></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Rank</th><th>Item</th><th>Code</th><th class="num">Qty Issued</th><th class="num">Transactions</th><th class="num">Current Stock</th></tr></thead>
            <tbody id="fastBody"></tbody>
          </table>
        </div>
      </div>
    </div>`;
  window.setFastPeriod = (d) => { period = d; renderFastMoving(document.getElementById('content')); };
  render();
}

function renderSlowMoving(c){
  let threshold = 30;
  function render(){
    const now = new Date();
    const rows = db.items.map(item => {
      const outs = db.transactions.filter(t => t.type === 'STOCK_OUT' && t.status === 'Approved' && t.items.some(l=>l.itemId===item.id));
      const lastOut = outs.length ? outs.map(t=>t.date).sort().pop() : null;
      const days = lastOut ? Math.floor((now - new Date(lastOut))/86400000) : 99999;
      return {item, lastOut, days, stock: getStock(item.id)};
    }).filter(r => r.stock > 0 && r.days >= threshold)
      .sort((a,b)=>b.days-a.days);
    document.getElementById('slowBody').innerHTML = rows.length ? rows.map(r => {
      const cls = r.days >= 365 ? 's-out' : r.days >= 180 ? 's-critical' : r.days >= 90 ? 's-low' : 's-normal';
      return `<tr>
        <td>${esc(r.item.name)}<br><span style="font-size:11px;color:var(--muted)">${esc(r.item.code)}</span></td>
        <td class="num">${fmtQty(r.stock)} ${esc(r.item.unit)}</td>
        <td>${r.lastOut?fmtDate(r.lastOut):'Never'}</td>
        <td class="num"><span class="badge-status ${cls}">${r.days} days</span></td>
        <td class="num">${fmt(r.stock * r.item.unitCost)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="5" class="empty">No slow-moving items</td></tr>';
  }
  c.innerHTML = `
    <div class="tabs">
      ${[30,60,90,180,365].map(d => `<button class="${d===threshold?'active':''}" onclick="setSlowPeriod(${d})">${d}+ days</button>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h4>🐢 Slow-Moving Items</h4></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Item</th><th class="num">Current Stock</th><th>Last OUT</th><th class="num">Days Without</th><th class="num">Stock Value</th></tr></thead>
            <tbody id="slowBody"></tbody>
          </table>
        </div>
      </div>
    </div>`;
  window.setSlowPeriod = (d) => { threshold = d; renderSlowMoving(document.getElementById('content')); };
  render();
}

function renderDeadStock(c){
  let period = 90;
  function render(){
    const now = new Date();
    const rows = db.items.map(item => {
      const stock = getStock(item.id);
      if(stock <= 0) return null;
      const outs = db.transactions.filter(t => t.type === 'STOCK_OUT' && t.status === 'Approved' && t.items.some(l=>l.itemId===item.id));
      const lastOut = outs.length ? outs.map(t=>t.date).sort().pop() : null;
      const days = lastOut ? Math.floor((now - new Date(lastOut))/86400000) : 99999;
      if(days < period) return null;
      return {item, stock, lastOut, days};
    }).filter(Boolean).sort((a,b)=>b.days-a.days);
    const totalVal = rows.reduce((s,r)=>s+r.stock*r.item.unitCost,0);
    document.getElementById('deadBody').innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td>${esc(r.item.name)}<br><span style="font-size:11px;color:var(--muted)">${esc(r.item.code)}</span></td>
        <td class="num">${fmtQty(r.stock)}</td>
        <td class="num">${fmt(r.item.unitCost)}</td>
        <td class="num"><b>${fmt(r.stock*r.item.unitCost)}</b></td>
        <td>${r.lastOut?fmtDate(r.lastOut):'Never'}</td>
        <td class="num">${r.days===99999?'Never':r.days+' days'}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty">No dead stock</td></tr>';
    document.getElementById('deadTotal').innerHTML = `<b>${fmtMoney(totalVal)}</b>`;
  }
  c.innerHTML = `
    <div class="tabs">
      ${[30,60,90,180,365].map(d => `<button class="${d===period?'active':''}" onclick="setDeadPeriod(${d})">${d}+ days</button>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h4>💀 Dead Stock Report</h4>
        <div style="font-size:13px">Capital tied up: <b id="deadTotal"></b></div></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit Cost</th><th class="num">Value</th><th>Last Movement</th><th class="num">Days Without</th></tr></thead>
            <tbody id="deadBody"></tbody>
          </table>
        </div>
      </div>
    </div>`;
  window.setDeadPeriod = (d) => { period = d; renderDeadStock(document.getElementById('content')); };
  render();
}

function runReport(id){
  const titles = {
    current_stock:'Current Stock Report', stock_in:'Stock IN Report', stock_out:'Stock OUT Report',
    stock_movement:'Stock Movement Report', low_stock:'Low Stock Report', out_of_stock:'Out-of-Stock Report',
    fast_moving:'Fast-Moving Items', slow_moving:'Slow-Moving Items', dead_stock:'Dead Stock Report',
    valuation:'Inventory Valuation Report', adjustments:'Stock Adjustment Report',
    turnover:'Stock Turnover Analysis', accuracy:'Stock Accuracy KPI'
  };
  let rows = [];

  if(id === 'current_stock'){
    rows = [['Code','Name','Category','Location','Qty','Unit','Unit Cost','Total Value','Min','Status']];
    db.items.forEach(i => {
      const qty = getStock(i.id);
      rows.push([i.code, i.name, getCategory(i.categoryId)?.name||'-', `${i.warehouse} ${i.rack}/${i.shelf}/${i.bin}`, qty, i.unit, i.unitCost, (qty*i.unitCost).toFixed(2), i.minStock, getStockStatus(i).label]);
    });
  }
  else if(id === 'stock_in' || id === 'stock_out'){
    const type = id === 'stock_in' ? 'STOCK_IN' : 'STOCK_OUT';
    rows = [['Date','Number','Party','Item','Qty','Unit Cost','Value','Status','User']];
    db.transactions.filter(t => t.type === type).forEach(t => {
      const party = t.supplierId ? getSupplier(t.supplierId)?.name : (getDepartment(t.departmentId)?.name || t.recipient || '-');
      t.items.forEach(l => {
        const item = getItem(l.itemId);
        rows.push([t.date, t.number, party||'-', item?.name||'-', l.qty, l.unitCost, (l.qty*l.unitCost).toFixed(2), t.status, getUser(t.requestedBy)?.name||'-']);
      });
    });
  }
  else if(id === 'stock_movement'){
    rows = [['Date','Item','Type','IN','OUT','Adjustment','Reference','Status']];
    db.transactions.slice().sort((a,b)=>(a.date<b.date?-1:1)).forEach(t => {
      t.items.forEach(l => {
        const item = getItem(l.itemId);
        rows.push([
          t.date, item?.name||'-', t.type,
          ['STOCK_IN','OPENING','ADJUSTMENT_IN'].includes(t.type)?l.qty:0,
          ['STOCK_OUT','ADJUSTMENT_OUT'].includes(t.type)?l.qty:0,
          t.type.includes('ADJUSTMENT')?'Yes':'',
          t.number, t.status
        ]);
      });
    });
  }
  else if(id === 'low_stock'){
    rows = [['Code','Item','Current Qty','Min','Reorder','Unit','Status']];
    db.items.filter(i => { const s = getStockStatus(i).label; return s === 'Low Stock' || s === 'Critical'; }).forEach(i => {
      rows.push([i.code, i.name, getStock(i.id), i.minStock, i.reorderLevel, i.unit, getStockStatus(i).label]);
    });
  }
  else if(id === 'out_of_stock'){
    rows = [['Code','Item','Unit Cost','Min','Reorder']];
    db.items.filter(i => getStock(i.id) <= 0).forEach(i => rows.push([i.code, i.name, i.unitCost, i.minStock, i.reorderLevel]));
  }
  else if(id === 'fast_moving'){
    const stats = {};
    db.transactions.filter(t => t.type === 'STOCK_OUT' && t.status === 'Approved').forEach(t => {
      t.items.forEach(l => { stats[l.itemId] = (stats[l.itemId]||0) + l.qty; });
    });
    rows = [['Rank','Item','Code','Qty Issued']];
    Object.entries(stats).sort((a,b)=>b[1]-a[1]).forEach(([itemId, qty], idx) => {
      const item = getItem(+itemId);
      rows.push([idx+1, item?.name||'-', item?.code||'-', qty]);
    });
  }
  else if(id === 'slow_moving' || id === 'dead_stock'){
    const now = new Date();
    const threshold = id === 'dead_stock' ? 90 : 30;
    rows = [['Item','Code','Stock Qty','Stock Value','Last OUT','Days Without']];
    db.items.forEach(item => {
      const stock = getStock(item.id);
      if(stock <= 0) return;
      const outs = db.transactions.filter(t => t.type === 'STOCK_OUT' && t.status === 'Approved' && t.items.some(l=>l.itemId===item.id));
      const lastOut = outs.length ? outs.map(t=>t.date).sort().pop() : null;
      const days = lastOut ? Math.floor((now - new Date(lastOut))/86400000) : 99999;
      if(days >= threshold){
        rows.push([item.name, item.code, stock, (stock*item.unitCost).toFixed(2), lastOut||'Never', days===99999?'Never':days]);
      }
    });
  }
  else if(id === 'valuation'){
    rows = [['Code','Item','Category','Qty','Unit Cost','Total Value']];
    db.items.forEach(i => {
      const qty = getStock(i.id);
      if(qty <= 0) return;
      rows.push([i.code, i.name, getCategory(i.categoryId)?.name||'-', qty, i.unitCost, (qty*i.unitCost).toFixed(2)]);
    });
    rows.push(['','','','','TOTAL', getInventoryValue().toFixed(2)]);
  }
  else if(id === 'adjustments'){
    rows = [['Date','Number','Item','System','Physical','Difference','Reason','Status','User']];
    db.transactions.filter(t => t.type.includes('ADJUSTMENT')).forEach(t => {
      const item = getItem(t.items[0]?.itemId);
      rows.push([t.date, t.number, item?.name||'-', t.adjSystem, t.adjPhysical, t.adjDiff, t.reason||'-', t.status, getUser(t.requestedBy)?.name||'-']);
    });
  }
  else if(id === 'turnover'){
    const since = new Date(); since.setDate(since.getDate() - 365);
    const sinceStr = since.toISOString().slice(0,10);
    const outVal = db.transactions.filter(t=>t.type==='STOCK_OUT' && t.status==='Approved' && t.date >= sinceStr)
      .reduce((s,t)=>s+t.items.reduce((a,i)=>a+i.qty*i.unitCost,0),0);
    const avgInv = getInventoryValue();
    const turnover = avgInv > 0 ? (outVal / avgInv) : 0;
    const daysOfInventory = turnover > 0 ? Math.round(365 / turnover) : 0;
    rows = [['Metric','Value']];
    rows.push(['Stock OUT Value (1Y)', outVal.toFixed(2)]);
    rows.push(['Average Inventory Value', avgInv.toFixed(2)]);
    rows.push(['Inventory Turnover', turnover.toFixed(2)]);
    rows.push(['Estimated Days of Inventory', daysOfInventory]);
  }
  else if(id === 'accuracy'){
    rows = [['Item','System Qty','Physical Qty (last adjusted)','Match']];
    let match = 0, diff = 0;
    db.transactions.filter(t => t.type.includes('ADJUSTMENT') && t.status === 'Approved').forEach(t => {
      const item = getItem(t.items[0]?.itemId);
      const matchYN = t.adjDiff === 0 ? 'Yes' : 'No';
      if(matchYN === 'Yes') match++; else diff++;
      rows.push([item?.name||'-', t.adjSystem, t.adjPhysical, matchYN]);
    });
    const total = match + diff;
    rows.push(['','','','']);
    rows.push(['Total Counted', total]);
    rows.push(['Matching', match]);
    rows.push(['Difference', diff]);
    rows.push(['Accuracy %', total>0 ? ((match/total)*100).toFixed(2) + '%' : 'N/A']);
  }

  const html = `
    <div class="modal-head"><h4>${titles[id]}</h4><button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="background:#f8fafc;padding:12px;border-radius:8px;margin-bottom:14px;font-size:12.5px">
        <b>${esc(db.settings.company)}</b> · ${esc(db.settings.address)}<br>
        Report generated: ${new Date().toLocaleString('en-GB')} · By: ${esc(currentUser.name)}
      </div>
      ${rows.length <= 1 ? '<div class="empty">No data to show</div>' : `
      <div class="table-wrap">
        <table>
          <thead><tr>${(rows[0]||[]).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.slice(1).map(r => `<tr>${r.map(cell => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
    <div class="modal-foot">
      <button class="btn sec" onclick="downloadCSV('${id}', ${JSON.stringify(rows).replace(/'/g,"\\'")})">⬇ Excel/CSV</button>
      <button class="btn sec" onclick="window.print()">🖨 Print / PDF</button>
      <button class="btn sec" onclick="closeModal()">Close</button>
    </div>`;
  openModal(html);
}

  a.href = URL.createObjectURL(blob);
  a.download = `wms_backup_${today()}.json`;
  a.click();
}
function restoreData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      db = JSON.parse(reader.result);
      saveDB();
      toast('Database restored','success');
      location.reload();
    }catch(err){ toast('Invalid backup file','error'); }
  };
  reader.readAsText(file);
}

        <div style="font-size:32px">📤</div><div style="font-weight:600;margin-top:6px">STOCK OUT</div>
      </button>
      <button class="card" style="cursor:pointer;text-align:center" onclick="go('currentstock')">
        <div style="font-size:32px">📦</div><div style="font-weight:600;margin-top:6px">CURRENT STOCK</div>
      </button>
      <button class="card" style="cursor:pointer;text-align:center" onclick="go('reports')">
        <div style="font-size:32px">📊</div><div style="font-weight:600;margin-top:6px">REPORTS</div>
      </button>
      <button class="card" style="cursor:pointer;text-align:center" onclick="go('analysis')">
        <div style="font-size:32px">📈</div><div style="font-weight:600;margin-top:6px">ANALYSIS</div>
      </button>
    </div>`;
  const input = document.getElementById('searchInput');
  input.focus();
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    const res = document.getElementById('searchResult');
    if(!q){ res.innerHTML = ''; return; }
    const matches = db.items.filter(i =>
      i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q) ||
      (i.barcode||'').includes(q) || (i.sku||'').toLowerCase().includes(q)
    ).slice(0,10);
    if(matches.length === 0){ res.innerHTML = '<div class="empty">No items found</div>'; return; }
    res.innerHTML = matches.map(i => {
      const qty = getStock(i.id);
      const s = getStockStatus(i);
      return `<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <div style="font-weight:600">${esc(i.name)}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(i.code)} · ${esc(i.warehouse)} · ${esc(i.rack)}/${esc(i.shelf)}/${esc(i.bin)}</div>
          <div style="margin-top:4px"><span class="badge-status ${s.cls}">${s.label}</span> <b style="margin-left:8px">${fmtQty(qty)} ${esc(i.unit)}</b></div>
        </div>
        <button class="btn sm" onclick="viewItemDetail(${i.id})">View</button>
      </div>`;
    }).join('');
  });
}

// ==================== BOOT ====================
(function init(){
  const sid = localStorage.getItem('wms_session');
  if(sid){
    const u = db.users.find(x => x.id === +sid);
    if(u){ currentUser = u; enterApp(); return; }
  }
  document.getElementById('loginScreen').style.display = 'flex';
})();
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
</script>
