<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AMIMTDE STORE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --primary:#0f766e; --primary-dark:#115e59; --accent:#f59e0b;
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --success:#16a34a; --warning:#f59e0b; --danger:#dc2626;
    --info:#0284c7; --sidebar:#0f172a;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  button { cursor: pointer; border: none; background: none; }
  #loginScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#0f172a,#134e4a); padding: 20px; z-index: 2000; }
  .login-box { background:#fff; border-radius:16px; padding: 32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .login-box h1 { font-size:22px; margin-bottom: 6px; color: var(--primary-dark); }
  .login-box p { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  .app { display: none; min-height: 100vh; }
  .app.active { display: flex; }
  .sidebar { width: 240px; background: var(--sidebar); color: #cbd5e1; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index: 100; }
  .brand { padding: 20px; border-bottom: 1px solid #1e293b; }
  .brand h2 { color: #fff; font-size: 16px; }
  .brand small { color: #64748b; font-size: 11px; }
  .nav { flex: 1; padding: 10px 0; }
  .nav a { display: flex; align-items:center; gap: 10px; padding: 11px 20px; color:#cbd5e1; font-size: 13.5px; border-left: 3px solid transparent; cursor:pointer; }
  .nav a:hover { background: #1e293b; color:#fff; }
  .nav a.active { background:#1e293b; color:#fff; border-left-color: var(--accent); }
  .nav .section { padding: 14px 20px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color:#475569; }
  .main { flex:1; margin-left:240px; min-width: 0; }
  .topbar { background:#fff; border-bottom:1px solid var(--border); padding: 12px 22px; display:flex; align-items:center; gap: 14px; position:sticky; top:0; z-index: 50; }
  .topbar h3 { font-size: 16px; flex: 1; }
  .user-chip { display:flex; align-items:center; gap:8px; font-size: 13px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-weight:600; font-size: 12px; }
  .content { padding: 20px; max-width: 1400px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
  .card .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card.warn .value { color: var(--warning); }
  .card.danger .value { color: var(--danger); }
  .card.success .value { color: var(--success); }
  .card.info .value { color: var(--info); }
  .panel { background:#fff; border-radius:12px; border:1px solid var(--border); margin-bottom: 18px; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .panel-head h4 { font-size: 14.5px; flex:1; }
  .panel-body { padding: 16px 18px; }
  .form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .field { display:flex; flex-direction:column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select, textarea { width:100%; padding: 9px 11px; border:1px solid var(--border); border-radius: 8px; background:#fff; color:var(--text); outline:none; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; background: var(--primary); color:#fff; transition: .15s; }
  .btn:hover { background: var(--primary-dark); }
  .btn.sec { background:#fff; color: var(--text); border:1px solid var(--border); }
  .btn.sec:hover { background:#f8fafc; }
  .btn.danger { background: var(--danger); }
  .btn.warn { background: var(--warning); color:#fff; }
  .btn.success { background: var(--success); }
  .btn.sm { padding: 6px 11px; font-size: 12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); background:#fff; }
  table { width:100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th { text-align:left; padding: 10px 12px; background:#f8fafc; color: var(--muted); font-weight:600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; border-bottom:1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  tr:hover td { background: #fafbfc; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge-status { display:inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .s-normal { background:#dcfce7; color:#166534; }
  .s-low { background:#fef3c7; color:#92400e; }
  .s-critical { background:#fed7aa; color:#9a3412; }
  .s-out { background:#fee2e2; color:#991b1b; }
  .s-draft { background:#e2e8f0; color:#475569; }
  .s-pending { background:#fef3c7; color:#92400e; }
  .s-approved { background:#dcfce7; color:#166534; }
  .s-rejected { background:#fee2e2; color:#991b1b; }
  .s-correction { background:#e0e7ff; color:#3730a3; }
  .s-reversed { background:#f3e8ff; color:#6b21a8; }
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index: 1000; padding: 14px; }
  .modal-overlay.active { display: flex; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width: 900px; max-height: 92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.35); }
  .modal-head { padding: 16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap: 10px; }
  .modal-head h4 { flex:1; font-size: 15.5px; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 14px 20px; border-top:1px solid var(--border); display:flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .x-btn { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size: 18px; color: var(--muted); }
  .x-btn:hover { background:#f1f5f9; }
  .filter-bar { display:flex; gap: 10px; flex-wrap: wrap; align-items:end; margin-bottom: 14px; }
  .filter-bar .field { min-width: 150px; flex: 1; max-width: 220px; }
  .empty { text-align:center; padding: 30px; color: var(--muted); font-size: 13px; }
  .empty-state { text-align:center; padding: 50px 20px; }
  .empty-state .icon { font-size: 54px; margin-bottom: 14px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 6px; }
  .empty-state p { color: var(--muted); font-size: 13px; margin-bottom: 18px; max-width: 500px; margin-left:auto; margin-right:auto; }
  .toast { position: fixed; bottom: 20px; right: 20px; background:#0f172a; color:#fff; padding: 12px 18px; border-radius:10px; z-index: 3000; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); transform: translateY(100px); opacity:0; transition: .25s; }
  .toast.show { transform: translateY(0); opacity:1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warn { background: var(--warning); }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background:#e2e8f0; color:#475569; font-weight: 600; }
  .mobile-nav { display: none; }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); transition: .25s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .content { padding: 14px; }
    .topbar { padding: 10px 14px; }
    .menu-btn { display:grid; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
    .card .value { font-size: 18px; }
    .mobile-nav { display:grid; grid-template-columns: repeat(5,1fr); position: fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); z-index: 90; }
    .mobile-nav button { padding: 9px 4px; font-size: 10.5px; display:flex; flex-direction:column; align-items:center; gap: 3px; color: var(--muted); }
    .mobile-nav button.active { color: var(--primary); }
    .mobile-nav button span:first-child { font-size: 18px; }
    .content { padding-bottom: 70px; }
  }
  .menu-btn { display:none; width:36px; height:36px; border-radius:8px; background:#f1f5f9; place-items:center; font-size:16px; }
  .chart-wrap { position: relative; height: 280px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>🏭 Warehouse IMS</h1>
    <p>Warehouse Inventory Management System</p>
    <div class="field" style="margin-bottom:12px">
      <label>Username</label>
      <input id="loginUser" value="store" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Password</label>
      <input id="loginPass" type="password" value="store" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
    <p style="margin-top:14px;font-size:11.5px;text-align:center;color:#94a3b8">
      Demo: admin/admin · manager/manager · store/store · auditor/auditor
    </p>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>🏭 Warehouse IMS</h2>
      <small id="brandSub">Loading…</small>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h3 id="pageTitle">Dashboard</h3>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">S</div>
        <div>
          <div style="font-weight:600" id="userName">Storekeeper</div>
          <div style="font-size:11px;color:var(--muted)" id="userRole">Storekeeper</div>
        </div>
        <button class="btn sec sm" onclick="logout()" style="margin-left:6px">Logout</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <button data-page="dashboard" onclick="go('dashboard')"><span>📊</span><span>Home</span></button>
    <button data-page="stockin" onclick="go('stockin')"><span>📥</span><span>Stock IN</span></button>
    <button data-page="stockout" onclick="go('stockout')"><span>📤</span><span>Stock OUT</span></button>
    <button data-page="currentstock" onclick="go('currentstock')"><span>📦</span><span>Stock</span></button>
    <button data-page="search" onclick="go('search')"><span>🔍</span><span>Search</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================================
   API CLIENT — every call goes to server.js (never to Supabase directly)
   ============================================================================ */
const Api = (() => {
  let token = localStorage.getItem('wms_token') || null;
  let user  = JSON.parse(localStorage.getItem('wms_user') || 'null');

  async function req(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    return res.json().catch(() => ({ success: false, error: 'BAD_JSON', message: 'Server returned invalid JSON' }));
  }

  function login(newToken, newUser) {
    token = newToken; user = newUser;
    localStorage.setItem('wms_token', newToken);
    localStorage.setItem('wms_user', JSON.stringify(newUser));
  }
  function logout() {
    token = null; user = null;
    localStorage.removeItem('wms_token');
    localStorage.removeItem('wms_user');
    location.reload();
  }

  return {
    get token(){ return token; },
    get user(){ return user; },
    login, logout,
    isLoggedIn: () => !!token,
    doLogin: (u, p) => req('POST', '/api/auth/login', { username: u, password: p }),
    me:      ()     => req('GET',  '/api/auth/me'),
    dashboard: () => req('GET', '/api/dashboard'),
    items:       ()      => req('GET',  '/api/items'),
    item:        (id)    => req('GET',  `/api/items/${id}`),
    createItem:  (body)  => req('POST', '/api/items', body),
    updateItem:  (id, b) => req('PUT',  `/api/items/${id}`, b),
    categories:      ()      => req('GET',  '/api/categories'),
    createCategory:  (b)     => req('POST', '/api/categories', b),
    updateCategory:  (id, b) => req('PUT',  `/api/categories/${id}`, b),
    suppliers:       ()      => req('GET',  '/api/suppliers'),
    createSupplier:  (b)     => req('POST', '/api/suppliers', b),
    updateSupplier:  (id, b) => req('PUT',  `/api/suppliers/${id}`, b),
    departments:       ()      => req('GET',  '/api/departments'),
    createDepartment:  (b)     => req('POST', '/api/departments', b),
    updateDepartment:  (id, b) => req('PUT',  `/api/departments/${id}`, b),
    stock: () => req('GET', '/api/stock'),
    transactions: (q = '') => req('GET', '/api/transactions' + q),
    transaction:  (id)     => req('GET', `/api/transactions/${id}`),
    submit:       (id)     => req('POST', `/api/transactions/${id}/submit`),
    createStockIn:  (body) => req('POST', '/api/stock-in', body),
    createStockOut: (body) => req('POST', '/api/stock-out', body),
    createAdjustment: (body) => req('POST', '/api/adjustments', body),
    importItems: (body) => req('POST', '/api/import/items', body),
    auditLogs: (q = '') => req('GET', '/api/audit-logs' + q),
    settings:     ()     => req('GET',  '/api/settings'),
    saveSettings: (body) => req('POST', '/api/settings', body),
  };
})();

/* ============================================================================
   IN-MEMORY CACHE
   ============================================================================ */
const db = {
  user: null,
  items: [], categories: [], suppliers: [], departments: [],
  transactions: [], stock: [],
  settings: { currency: 'ETB', company: 'Warehouse', slaHours: 24, allowNegativeStock: false },
};
let currentPage = 'dashboard';
let dashChart = null;

/* ============================================================================
   HELPERS
   ============================================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = (n,d=2) => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const fmtQty = n => (Number(n)||0).toLocaleString('en-US');
const fmtMoney = n => `${db.settings.currency} ${fmt(n)}`;
const fmtDate = d => d ? new Date(d).toISOString().slice(0,10) : '-';
const fmtDateTime = d => d ? new Date(d).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
const today = () => new Date().toISOString().slice(0,10);

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2600);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); }

const getItem       = id => db.items.find(i => i.id === id);
const getCategory   = id => db.categories.find(c => c.id === id);
const getSupplier   = id => db.suppliers.find(s => s.id === id);
const getDepartment = id => db.departments.find(d => d.id === id);
const getStockRow   = id => db.stock.find(s => s.item_id === id);
const getStock      = id => Number(getStockRow(id)?.current_stock || 0);

function getStockStatus(item){
  const qty = getStock(item.id);
  if (qty <= 0) return { label: 'Out of Stock', cls: 's-out' };
  if (qty <= Number(item.min_stock || 0)) return { label: 'Critical', cls: 's-critical' };
  if (qty <= Number(item.reorder_level || 0)) return { label: 'Low Stock', cls: 's-low' };
  return { label: 'Normal', cls: 's-normal' };
}

/* ============================================================================
   AUTH
   ============================================================================ */
async function doLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const res = await Api.doLogin(username, password);
    if (!res.success) { toast(res.message || 'Login failed', 'error'); return; }
    Api.login(res.token, res.user);
    db.user = res.user;
    await loadAll();
    enterApp();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function logout(){
  try {
    await fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: `Bearer ${Api.token}` } });
  } catch (e) {}
  Api.logout();
}

async function loadAll(){
  const [items, cats, sups, depts, txns, stock, settings] = await Promise.all([
    Api.items(), Api.categories(), Api.suppliers(), Api.departments(),
    Api.transactions(), Api.stock(), Api.settings(),
  ]);
  db.items        = items.data || [];
  db.categories   = cats.data || [];
  db.suppliers    = sups.data || [];
  db.departments  = depts.data || [];
  db.transactions = txns.data || [];
  db.stock        = stock.data || [];
  const s = settings.data || {};
  db.settings = {
    company: s.company || 'Warehouse',
    address: s.address || '',
    phone: s.phone || '',
    currency: s.currency || 'ETB',
    slaHours: parseInt(s.sla_hours || '24'),
    allowNegativeStock: s.allow_negative_stock === '1',
  };
}

async function refreshStock(){ const r = await Api.stock(); db.stock = r.data || []; }
async function refreshItems(){
  const r = await Api.items(); db.items = r.data || [];
  await refreshStock();
}
async function refreshTransactions(){
  const r = await Api.transactions(); db.transactions = r.data || [];
}

/* ============================================================================
   PERMISSIONS
   ============================================================================ */
const PERMS = {
  super_admin: ['*'],
  warehouse_manager: ['view_dashboard','view_items','manage_items','view_categories','manage_categories',
    'view_suppliers','manage_suppliers','view_departments','manage_departments',
    'view_transactions','view_stock','view_reports','view_analysis','view_audit','manage_users'],
  storekeeper: ['view_dashboard','view_items','manage_items','view_categories','manage_categories',
    'view_suppliers','manage_suppliers','view_departments','manage_departments',
    'view_transactions','view_stock','view_reports','view_analysis','view_item_history'],
  auditor: ['view_dashboard','view_items','view_stock','view_transactions','view_reports','view_analysis','view_audit'],
};
function can(p){
  if (!db.user) return false;
  const arr = PERMS[db.user.role] || [];
  return arr.includes('*') || arr.includes(p);
}

/* ============================================================================
   NAV
   ============================================================================ */
const NAV_ITEMS = [
  { section:'MAIN' },
  { page:'dashboard', label:'Dashboard', icon:'📊' },
  { page:'setup', label:'Setup Guide', icon:'🚀', perm:'manage_items' },
  { section:'MASTER DATA' },
  { page:'items', label:'Items / Products', icon:'📦', perm:'view_items' },
  { page:'importpdf', label:'Import PDF', icon:'📄', perm:'manage_items' },
  { page:'categories', label:'Categories', icon:'🏷️', perm:'view_categories' },
  { page:'suppliers', label:'Suppliers', icon:'🚚', perm:'view_suppliers' },
  { page:'departments', label:'Departments', icon:'🏢', perm:'view_departments' },
  { section:'OPERATIONS' },
  { page:'stockin', label:'Stock IN', icon:'📥', perm:'view_transactions' },
  { page:'stockout', label:'Stock OUT', icon:'📤', perm:'view_transactions' },
  { page:'currentstock', label:'Current Stock', icon:'📋', perm:'view_stock' },
  { page:'adjustment', label:'Stock Adjustment', icon:'⚖️', perm:'view_transactions' },
  { page:'history', label:'Stock History', icon:'📜', perm:'view_transactions' },
  { section:'ANALYSIS' },
  { page:'analysis', label:'Inventory Analysis', icon:'📈', perm:'view_analysis' },
  { section:'REPORTS' },
  { page:'reports', label:'Reports', icon:'📄', perm:'view_reports' },
  { section:'ADMIN' },
  { page:'audit', label:'Audit Log', icon:'🔒', perm:'view_audit' },
  { page:'settings', label:'Settings', icon:'⚙️' },
];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    if (item.section){
      const s = document.createElement('div');
      s.className = 'section'; s.textContent = item.section;
      nav.appendChild(s); return;
    }
    if (item.perm && !can(item.perm)) return;
    const a = document.createElement('a');
    a.dataset.page = item.page;
    a.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    a.onclick = () => { go(item.page); document.getElementById('sidebar').classList.remove('open'); };

  });
}

function go(page){
  currentPage = page;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  document.querySelectorAll('.mobile-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const titles = {
    dashboard:'Dashboard', setup:'Setup Guide', items:'Items / Products',
    importpdf:'Import Inventory PDF', categories:'Categories', suppliers:'Suppliers',
    departments:'Departments', stockin:'Stock IN', stockout:'Stock OUT',
    currentstock:'Current Stock', adjustment:'Stock Adjustment', history:'Stock History',
    analysis:'Inventory Analysis', reports:'Reports', audit:'Audit Log',
    settings:'Settings', search:'Search Item',
  };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  const c = document.getElementById('content');
  const R = {
    dashboard: renderDashboard, setup: renderSetup,
    items: renderItems, importpdf: renderImportPDF,
    categories: renderCategories, suppliers: renderSuppliers, departments: renderDepartments,
    stockin: renderStockIn, stockout: renderStockOut, currentstock: renderCurrentStock,
    adjustment: renderAdjustment, history: renderHistory,
    analysis: renderAnalysis, reports: renderReports,
    audit: renderAudit, settings: renderSettings, search: renderSearch,
  };
  (R[page] || renderDashboard)(c);
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = db.user.name;
  document.getElementById('userRole').textContent = db.user.role;
  document.getElementById('userAvatar').textContent = db.user.name.charAt(0).toUpperCase();

/* ============================================================================
   PILLS
   ============================================================================ */
function typePill(type){
  const map = {
    STOCK_IN:['📥','In','#dcfce7','#166534'],
    STOCK_OUT:['📤','Out','#fee2e2','#991b1b'],
    ADJUSTMENT_IN:['⚖️','Adj+','#dbeafe','#1e40af'],
    ADJUSTMENT_OUT:['⚖️','Adj-','#fef3c7','#92400e'],
    OPENING:['🏁','Opening','#e0e7ff','#3730a3'],
    REVERSAL:['↩️','Rev','#f3e8ff','#6b21a8'],
  };
  const [i,l,bg,c] = map[type] || ['•',type,'#e2e8f0','#475569'];
  return `<span class="pill" style="background:${bg};color:${c}">${i} ${l}</span>`;
}
function statusPill(s){
  const map = {
    Draft:'s-draft', 'Pending Approval':'s-pending', Approved:'s-approved',
    Rejected:'s-rejected', 'Needs Correction':'s-correction', Reversed:'s-reversed',
  };
  return `<span class="badge-status ${map[s]||'s-draft'}">${esc(s)}</span>`;
}

function renderSetup(c){
  const steps = [
    { done: db.categories.length > 0, label:'Create Categories', desc:'Group your items.', action:"go('categories')", icon:'🏷️' },
    { done: db.suppliers.length > 0,  label:'Add Suppliers',     desc:'Who you receive from.', action:"go('suppliers')", icon:'🚚' },

  ];
  const done = steps.filter(s => s.done).length;

  c.innerHTML = `

        <div style="font-size:12px;color:var(--muted);text-align:right">${done}/${steps.length} steps · ${pct}%</div>

  const todayStr = today();
  const inToday = db.transactions.filter(t => t.status === 'Approved' && t.type === 'STOCK_IN' && t.date === todayStr)

  const outToday = db.transactions.filter(t => t.status === 'Approved' && t.type === 'STOCK_OUT' && t.date === todayStr)

          <table>

            <tbody>
              ${db.items.slice(0, 10).map(i => {
                const s = getStockStatus(i);
                return `<tr onclick="viewItemDetail(${i.id})" style="cursor:pointer">
                  <td><b>${esc(i.name)}</b><br><span style="font-size:11px;color:var(--muted)">${esc(i.code)}</span></td>
                  <td>${esc(i.warehouse||'')} · ${esc(i.rack||'')}/${esc(i.shelf||'')}/${esc(i.bin||'')}</td>

async function saveItem(id){
  const data = {
    code: document.getElementById('f_code').value.trim(),
    name: document.getElementById('f_name').value.trim(),
    category_id: +document.getElementById('f_cat').value || null,
    unit: document.getElementById('f_unit').value,
    unit_cost: +document.getElementById('f_cost').value || 0,
    min_stock: +document.getElementById('f_min').value || 0,
    reorder_level: +document.getElementById('f_reorder').value || 0,
    max_stock: +document.getElementById('f_max').value || 0,
    supplier_id: +document.getElementById('f_sup').value || null,
    warehouse: document.getElementById('f_wh').value.trim() || 'Main Warehouse',
    rack: document.getElementById('f_rack').value.trim(),
    shelf: document.getElementById('f_shelf').value.trim(),
    bin: document.getElementById('f_bin').value.trim(),
    barcode: document.getElementById('f_bar').value.trim() || null,
    status: document.getElementById('f_status').value,
  };
  if (!data.code || !data.name){ toast('Code and Name required', 'error'); return; }
  const res = id ? await Api.updateItem(id, data) : await Api.createItem(data);
  if (!res.success){ toast(res.message, 'error'); return; }
  toast(id ? 'Item updated' : 'Item created', 'success');
  closeModal();
  await refreshItems();
  go('items');
}

async function saveStockOut(mode){
  const valid = stockOutCart.filter(l => l.item_id && l.qty > 0);
  if (!valid.length){ toast('Add items first', 'error'); return; }

  for (const l of valid){
    const item = getItem(l.item_id);
    const avail = getStock(item.id);
    if (!db.settings.allowNegativeStock && l.qty > avail){
      toast(`Insufficient stock for ${item.name}`, 'error'); return;
    }
  }

  const body = {
    date: document.getElementById('out_date').value || today(),
    department_id: +document.getElementById('out_dept').value || null,
    recipient: document.getElementById('out_recipient').value.trim(),
    reference_number: document.getElementById('out_ref').value.trim(),
    purpose: document.getElementById('out_purpose').value.trim(),
    notes: document.getElementById('out_notes').value.trim(),
    items: valid.map(l => ({ item_id: l.item_id, quantity: l.qty })),
  };
  const res = await Api.createStockOut(body);
  if (!res.success){ toast(res.message, 'error'); return; }

  if (mode === 'submit'){
    const s = await Api.submit(res.data.id);
    toast(s.success ? 'Submitted for approval' : s.message, s.success ? 'success' : 'error');
  } else {
    toast('Saved as draft', 'success');
  }
  await refreshTransactions();
  await refreshStock();
  go('stockout');
}

function renderAnalysis(c){
  if (db.items.length === 0){
    c.innerHTML = `<div class="empty-state"><div class="icon">📈</div><h3>Nothing to analyse</h3></div>`;
    return;
  }
  const totalValue = db.stock.reduce((s, r) => s + Math.max(0, Number(r.current_stock)) * Number(r.unit_cost), 0);
  const totalQty = db.stock.reduce((s, r) => s + Math.max(0, Number(r.current_stock)), 0);

  const catValues = {};
  db.items.forEach(i => {
    const cat = getCategory(i.category_id);
    const name = cat?.name || 'Uncategorized';
    catValues[name] = (catValues[name] || 0) + getStock(i.id) * Number(i.unit_cost);
  });

  c.innerHTML = `
    <div class="cards">
      <div class="card success"><div class="label">Inventory Value</div><div class="value" style="font-size:18px">${fmtMoney(totalValue)}</div></div>
      <div class="card info"><div class="label">Total Qty</div><div class="value">${fmtQty(totalQty)}</div></div>
      <div class="card"><div class="label">Active Items</div><div class="value">${db.items.filter(i => i.status === 'Active').length}</div></div>
      <div class="card warn"><div class="label">Empty Items</div><div class="value">${db.items.filter(i => getStock(i.id) <= 0).length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h4>💰 Value by Category</h4></div>
      <div class="panel-body"><div class="chart-wrap"><canvas id="catChart"></canvas></div></div>
    </div>`;
  setTimeout(() => {
    const ctx = document.getElementById('catChart');
    if (!ctx) return;
    if (dashChart) dashChart.destroy();
    dashChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(catValues),
        datasets: [{ data: Object.values(catValues), backgroundColor: ['#0f766e','#0284c7','#f59e0b','#dc2626','#7c3aed','#16a34a'] }],
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } },
    });
  }, 30);
}

function runReport(id){
  let rows = [];
  if (id === 'current_stock'){
    rows = [['Code','Name','Location','Qty','Unit','Value','Status']];
    db.stock.forEach(r => {
      rows.push([r.code, r.item_name, `${r.warehouse||''} ${r.rack||''}/${r.shelf||''}/${r.bin||''}`,
        r.current_stock, r.unit, (Number(r.current_stock) * Number(r.unit_cost)).toFixed(2),
        getStockStatus(getItem(r.item_id) || { id: r.item_id, min_stock: r.min_stock, reorder_level: r.reorder_level }).label]);
    });
  } else if (id === 'valuation'){
    rows = [['Code','Item','Qty','Unit Cost','Total Value']];
    db.stock.forEach(r => rows.push([r.code, r.item_name, r.current_stock, r.unit_cost, (Number(r.current_stock) * Number(r.unit_cost)).toFixed(2)]));
    rows.push(['', '', '', 'TOTAL', db.stock.reduce((s, r) => s + Number(r.current_stock) * Number(r.unit_cost), 0).toFixed(2)]);
  } else if (id === 'low_stock'){
    rows = [['Code','Item','Qty','Min','Reorder']];
    db.items.forEach(i => { const s = getStockStatus(i).label; if (s === 'Low Stock' || s === 'Critical') rows.push([i.code, i.name, getStock(i.id), i.min_stock, i.reorder_level]); });
  } else if (id === 'out_of_stock'){
    rows = [['Code','Item','Unit Cost']];
    db.items.filter(i => getStock(i.id) <= 0).forEach(i => rows.push([i.code, i.name, i.unit_cost]));
  }

  openModal(`
    <div class="modal-head"><h4>${esc(id)}</h4><button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="table-wrap"><table>
        <thead><tr>${(rows[0] || []).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="modal-foot">
      <button class="btn sec" onclick="downloadCSV('${id}', ${JSON.stringify(rows).replace(/'/g, "\\'")})">⬇ CSV</button>
      <button class="btn sec" onclick="closeModal()">Close</button>
    </div>`);
}
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}_${today()}.csv`;
  a.click();
}

/* ============================================================================
   PDF IMPORT
   ============================================================================ */
let pdfImportState = {
  file: null, rows: [],
  categoryId: null, supplierId: null,
  warehouse: 'Main Warehouse', building: '',
  txnDate: today(), status: 'Draft',
};

const UNITS_LIST = [
  'Kg/pcs','Kg','kg','pcs','Pcs','PCS','pc','Pc','meter','m','M',
  'roll','Roll','packet','Packet','Pack','pack','Packt','Pkt','Set','set',
  'pail','Pail','gallon','Gallon','Litter','litter','L','ton','Ton',
  'pair','Pair','m2','sqm','Bag','bag','sheet','Sheet',
];
const UNIT_PATTERN = UNITS_LIST
  .map(u => u.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
  .sort((a, b) => b.length - a.length).join('|');

function parseNum(s){
  if (s == null) return 0;
  let x = String(s).trim();
  if (!x) return 0;
  if (x.includes('.') && x.includes(',')) x = x.replace(/,/g, '');
  else if (x.includes(',')) x = x.replace(/,/g, '');
  const n = parseFloat(x);
  return isNaN(n) ? 0 : n;
}

function parseInventoryLine(raw){
  let line = String(raw || '').replace(/\s+/g, ' ').trim();
  if (!line) return null;
  if (/ተ\.ቁ|የእቃው|መለኪያ|ብዛት|ያንዱ|ጠቅላላ|ምርመራ/.test(line)) return null;
  if (/^በአማራ|^የአስቆጠሪ|^የቆጠሪ|^ፈርማ/.test(line)) return null;

  const RE = new RegExp(
    '^(\\d{1,4})\\s*' +
    '(.+?)\\s*' +
    '(' + UNIT_PATTERN + ')\\s*' +
    '([\\d,]+(?:\\.\\d+)?)\\s*' +
    '([\\d,]+(?:\\.\\d+)?)\\s*' +
    '([\\d,]+(?:\\.\\d+)?)' +
    '\\s*(.*)$'
  );
  const m = line.match(RE);
  if (!m) return null;

  const no = parseInt(m[1], 10);
  const name = m[2].trim().replace(/[;:,]+$/, '');
  const unit = m[3];
  const qty  = parseNum(m[4]);
  const cost = parseNum(m[5]);
  const tot  = parseNum(m[6]);
  const rem  = (m[7] || '').trim();

  if (!name || name.length < 2) return null;
  if (qty <= 0) return null;

  const expected = qty * cost;
  const variance = expected > 0 ? Math.abs(tot - expected) / expected : 1;
  const plausible = tot === 0 || variance < 0.05;

  return {
    no, name, unit, qty,
    unit_cost: plausible ? cost : (tot > 0 && qty > 0 ? +(tot / qty).toFixed(4) : cost),
    total: tot, remark: rem, _keep: true,
  };
}

async function extractPdfLines(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const allLines = [];
  const totalPages = pdf.numPages;

  for (let p = 1; p <= totalPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent({ includeMarkedContent: false });
    const lineMap = new Map();
    for (const item of content.items){
      if (!item.str || !item.str.trim()) continue;
      const y = Math.round(item.transform[5]);
      let bucket = null;
      for (const k of lineMap.keys()){
        if (Math.abs(k - y) <= 3){ bucket = k; break; }
      }
      const key = bucket !== null ? bucket : y;
      if (!lineMap.has(key)) lineMap.set(key, []);
      lineMap.get(key).push({ x: item.transform[4], text: item.str });
    }
    const sortedRows = [...lineMap.entries()]
      .sort((a, b) => b[0] - a[0])
      .map(([_, items]) => items.sort((a, b) => a.x - b.x).map(i => i.text).join(' ').trim())
      .filter(Boolean);
    for (const line of sortedRows) allLines.push({ page: p, text: line });
  }
  return { totalPages, lines: allLines };
}

async function handlePdfUpload(file){
  if (file.type !== 'application/pdf'){ toast('Please select a PDF file', 'error'); return; }
  const statusEl = document.getElementById('pdfStatus');
  statusEl.innerHTML = `<div style="padding:12px;background:#eff6ff;border-radius:8px;font-size:13px">⏳ Reading <b>${esc(file.name)}</b>…</div>`;
  try {
    const buf = await file.arrayBuffer();
    const { totalPages, lines } = await extractPdfLines(buf);
    statusEl.innerHTML = `<div style="padding:12px;background:#eff6ff;border-radius:8px;font-size:13px">🔍 Extracted <b>${lines.length}</b> lines from <b>${totalPages}</b> page(s). Parsing…</div>`;
    const rows = [];
    let parsed = 0, skipped = 0;
    for (const { text } of lines){
      const row = parseInventoryLine(text);
      if (row){ rows.push(row); parsed++; } else skipped++;
    }
    pdfImportState.rows = rows;
    pdfImportState.file = file.name;
    statusEl.innerHTML = `<div style="padding:12px;background:${rows.length ? '#dcfce7' : '#fef3c7'};border-radius:8px;font-size:13px">
      ${rows.length ? '✅' : '⚠️'} Parsed <b>${parsed}</b> rows from <b>${totalPages}</b> page(s). ${skipped ? `<span style="color:var(--muted)">(skipped ${skipped})</span>` : ''}
    </div>`;
    renderPdfPreview();
  } catch (err){
    console.error(err);
    statusEl.innerHTML = `<div style="padding:12px;background:#fef2f2;color:#991b1b;border-radius:8px;font-size:13px">❌ Failed: ${esc(err.message)}</div>`;
  }
}

        <h4>📋 Preview (${keptCount} of ${rows.length} kept)</h4>

      </div>
      <div class="panel-body" style="padding:0;max-height:520px;overflow:auto">
        <div class="table-wrap" style="border:none">
          <table style="min-width:900px">

                <th style="width:110px">Unit cost</th><th style="width:110px">Total</th>
                <th style="width:100px">Remark</th></tr>
            </thead>
            <tbody id="impRowsBody">
              ${rows.map((r, idx) => `
                <tr data-idx="${idx}" style="${r._keep ? '' : 'opacity:.45;text-decoration:line-through'}">
                  <td><input type="checkbox" ${r._keep ? 'checked' : ''} onchange="toggleImportRow(${idx}, this.checked)" style="width:auto"></td>

                  <td><input type="number" step="0.01" value="${r.total}" onchange="editImportRow(${idx},'total',+this.value)" style="font-size:13px;padding:5px 8px;text-align:right"></td>
                  <td><input value="${esc(r.remark)}" onchange="editImportRow(${idx},'remark',this.value)" style="font-size:12px;padding:5px 8px"></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

          <button class="btn sec sm" onclick="toggleAllImportRows(true)">Select all</button>
          <button class="btn sec sm" onclick="toggleAllImportRows(false)">Deselect all</button>
        </div>
        <button class="btn" id="impBtn" onclick="runPdfImport()">📥 Import ${keptCount} item(s)</button>

function toggleImportRow(idx, keep){
  pdfImportState.rows[idx]._keep = keep;
  const tr = document.querySelector(`tr[data-idx="${idx}"]`);
  if (tr){ tr.style.opacity = keep ? '1' : '.45'; tr.style.textDecoration = keep ? 'none' : 'line-through'; }
}
function toggleAllImportRows(keep){
  pdfImportState.rows.forEach((r, i) => toggleImportRow(i, keep));
  document.querySelectorAll('#impRowsBody input[type=checkbox]').forEach(cb => cb.checked = keep);
}
function editImportRow(idx, key, val){
  pdfImportState.rows[idx][key] = val;
  if (key === 'qty' || key === 'unit_cost'){
    const r = pdfImportState.rows[idx];
    r.total = +(r.qty * r.unit_cost).toFixed(2);
    const tr = document.querySelector(`tr[data-idx="${idx}"]`);
    const inputs = tr.querySelectorAll('input');
    if (inputs[5]) inputs[5].value = r.total;
  }
}

async function runPdfImport(){
  const btn = document.getElementById('impBtn');
  const rows = pdfImportState.rows.filter(r => r._keep && r.name && r.qty > 0);
  if (!rows.length){ toast('No rows selected', 'error'); return; }
  if (!pdfImportState.categoryId){ toast('Please select a category', 'error'); return; }
  if (!confirm(`Import ${rows.length} items?`)) return;

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = '⏳ Importing…';

  try {
    const res = await Api.importItems({
      rows: rows.map(r => ({ name: r.name, unit: r.unit, qty: r.qty, unit_cost: r.unit_cost, remark: r.remark })),
      categoryId: pdfImportState.categoryId,
      supplierId: pdfImportState.supplierId,
      warehouse: pdfImportState.warehouse,
      building: pdfImportState.building,
      txnDate: pdfImportState.txnDate,
      autoApprove: pdfImportState.status === 'Approved',
    });
    if (!res.success) throw new Error(res.message || 'Import failed');
    toast(`✅ Imported ${res.data.items_imported} items (${res.data.items_created} new)`, 'success');
    await refreshItems();
    await refreshTransactions();
    await refreshStock();
    setTimeout(() => go('items'), 600);
  } catch (err){
    console.error(err);
    toast('Import failed: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
