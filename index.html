<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amhara Metal Industry - Store Inventory System</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ... same styles as before ... */
        .login-container {
            max-width: 420px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .login-container h3 {
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
        }
        .login-container .form-control {
            border-radius: 10px;
            padding: 12px 16px;
        }
        .login-container .btn {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Toast container -->
    <div class="toast-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // ============================================================
    // API CLIENT
    // ============================================================
    const API = {
        baseURL: '/api',
        token: localStorage.getItem('token') || null,

        setToken(token) {
            this.token = token;
            if (token) {
                localStorage.setItem('token', token);
            } else {
                localStorage.removeItem('token');
            }
        },

        getHeaders() {
            return {
                'Content-Type': 'application/json',
                ...(this.token ? { 'Authorization': `Bearer ${this.token}` } : {})
            };
        },

        async request(method, endpoint, data = null) {
            const url = `${this.baseURL}${endpoint}`;
            const options = {
                method,
                headers: this.getHeaders()
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            const response = await fetch(url, options);
            const result = await response.json();

            if (!response.ok) {
                if (response.status === 401) {
                    this.setToken(null);
                    window.location.reload();
                }
                throw new Error(result.error || result.message || 'Request failed');
            }

            return result;
        },

        // Auth
        login(username, password) {
            return this.request('POST', '/auth/login', { username, password });
        },
        register(userData) {
            return this.request('POST', '/auth/register', userData);
        },

        // Items
        getItems(params = {}) {
            const query = new URLSearchParams(params).toString();
            return this.request('GET', `/items?${query}`);
        },
        getItem(id) {
            return this.request('GET', `/items/${id}`);
        },
        createItem(data) {
            return this.request('POST', '/items', data);
        },
        updateItem(id, data) {
            return this.request('PUT', `/items/${id}`, data);
        },
        deleteItem(id) {
            return this.request('DELETE', `/items/${id}`);
        },

        // Transactions
        getTransactions(params = {}) {
            const query = new URLSearchParams(params).toString();
            return this.request('GET', `/transactions?${query}`);
        },
        createTransaction(data) {
            return this.request('POST', '/transactions', data);
        },
        getItemTransactions(itemId) {
            return this.request('GET', `/items/${itemId}/transactions`);
        },

        // Dashboard
        getDashboardStats() {
            return this.request('GET', '/dashboard/stats');
        },

        // Categories
        getCategories() {
            return this.request('GET', '/categories');
        },
        createCategory(data) {
            return this.request('POST', '/categories', data);
        },

        // Suppliers
        getSuppliers() {
            return this.request('GET', '/suppliers');
        },
        createSupplier(data) {
            return this.request('POST', '/suppliers', data);
        },

        // Reports
        getTopItems(limit = 10) {
            return this.request('GET', `/reports/top-items?limit=${limit}`);
        },
        getMonthlySummary(year) {
            return this.request('GET', `/reports/monthly-summary${year ? `?year=${year}` : ''}`);
        },
        getLowStock() {
            return this.request('GET', '/reports/low-stock');
        },

        // Users
        getUsers() {
            return this.request('GET', '/users');
        }
    };

    // ============================================================
    // TOAST NOTIFICATIONS
    // ============================================================
    function showToast(message, type = 'success') {
        const container = document.querySelector('.toast-container');
        const colors = {
            success: 'bg-success',
            error: 'bg-danger',
            warning: 'bg-warning',
            info: 'bg-info'
        };

        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white ${colors[type] || colors.info} border-0 show`;
        toast.role = 'alert';
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 5000);
    }

    // ============================================================
    // MAIN APPLICATION
    // ============================================================
    class StoreInventorySystem {
        constructor() {
            this.isAuthenticated = !!API.token;
            this.currentView = 'dashboard';
            this.items = [];
            this.transactions = [];
            this.categories = [];
            this.suppliers = [];
            this.editItemId = null;
            this.searchQuery = '';
            this.filterCategory = 'all';
            this.filterStatus = 'all';
            this.transactionFilter = 'all';
            this.sortField = 'id';
            this.sortDirection = 'asc';
            this.itemsPerPage = 15;
            this.currentPage = 1;
            this.totalItems = 0;
            this.totalPages = 1;
            this.user = null;

            this.initUI();
            this.checkAuth();
        }

        initUI() {
            const app = document.getElementById('app');
            if (!app) {
                document.body.innerHTML = `
                    <div id="app">
                        <div id="content"></div>
                    </div>
                `;
            }
            this.content = document.getElementById('content');
        }

        checkAuth() {
            if (this.isAuthenticated) {
                this.loadDashboard();
                this.renderNav();
            } else {
                this.renderLogin();
            }
        }

        renderNav() {
            const nav = document.createElement('nav');
            nav.className = 'navbar navbar-expand-lg navbar-dark bg-primary sticky-top';
            nav.innerHTML = `
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <i class="fas fa-warehouse"></i> Amhara Metal - Inventory
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav me-auto" id="navMenuItems">
                            <li class="nav-item"><a class="nav-link active" data-view="dashboard" href="#"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
                            <li class="nav-item"><a class="nav-link" data-view="inventory" href="#"><i class="fas fa-boxes"></i> Inventory</a></li>
                            <li class="nav-item"><a class="nav-link" data-view="transactions" href="#"><i class="fas fa-exchange-alt"></i> Transactions</a></li>
                            <li class="nav-item"><a class="nav-link" data-view="report" href="#"><i class="fas fa-file-alt"></i> Reports</a></li>
                        </ul>
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <span class="nav-link text-light" style="opacity:0.7">
                                    <i class="fas fa-user"></i> ${this.user?.fullName || 'User'}
                                </span>
                            </li>
                            <li class="nav-item">
                                <button class="btn btn-outline-light btn-sm" onclick="inventorySystem.logout()">
                                    <i class="fas fa-sign-out-alt"></i> Logout
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            `;

            // Insert nav after app
            const app = document.getElementById('app');
            app.insertBefore(nav, app.firstChild);

            // Setup nav click events
            document.querySelectorAll('[data-view]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const view = link.dataset.view;
                    this.switchView(view);
                    document.querySelectorAll('[data-view]').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                });
            });

            this.nav = nav;
        }

        renderLogin() {
            this.content.innerHTML = `
                <div class="login-container">
                    <h3><i class="fas fa-warehouse text-primary"></i> Store Inventory System</h3>
                    <p class="text-muted text-center">Amhara Metal Industry & Technology Development</p>
                    <hr>
                    <form id="loginForm" onsubmit="inventorySystem.handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" value="admin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" value="admin123" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>
                    <hr>
                    <p class="text-muted text-center small">Default: admin / admin123</p>
                </div>
            `;
        }

        async handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const result = await API.login(username, password);
                API.setToken(result.token);
                this.isAuthenticated = true;
                this.user = result.user;
                showToast('Login successful!', 'success');
                this.checkAuth();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        logout() {
            API.setToken(null);
            this.isAuthenticated = false;
            this.user = null;
            this.content.innerHTML = '';
            if (this.nav) this.nav.remove();
            this.renderLogin();
            showToast('Logged out successfully', 'info');
        }

        switchView(view) {
            this.currentView = view;
            this.content.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
            switch (view) {
                case 'dashboard': this.loadDashboard(); break;
                case 'inventory': this.loadInventory(); break;
                case 'transactions': this.loadTransactions(); break;
                case 'report': this.loadReport(); break;
                default: this.loadDashboard();
            }
        }

        // ==================== DASHBOARD ====================
        async loadDashboard() {
            try {
                const stats = await API.getDashboardStats();

                this.content.innerHTML = `
                    <div class="container-fluid mt-3">
                        <div class="row mb-4">
                            <div class="col-12">
                                <h4><i class="fas fa-chart-pie text-primary"></i> Dashboard Overview</h4>
                                <p class="text-muted">Real-time inventory status and summary</p>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-3 col-sm-6">
                                <div class="stat-card">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <div class="stat-number">${stats.totalItems}</div>
                                            <div class="stat-label">Total Items</div>
                                        </div>
                                        <div class="stat-icon text-primary"><i class="fas fa-cubes"></i></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 col-sm-6">
                                <div class="stat-card">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <div class="stat-number">${Number(stats.totalValue).toLocaleString()}</div>
                                            <div class="stat-label">Total Value (Birr)</div>
                                        </div>
                                        <div class="stat-icon text-success"><i class="fas fa-money-bill-wave"></i></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 col-sm-6">
                                <div class="stat-card">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <div class="stat-number text-danger">${stats.lowStockItems}</div>
                                            <div class="stat-label">Low Stock Items</div>
                                        </div>
                                        <div class="stat-icon text-warning"><i class="fas fa-exclamation-triangle"></i></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 col-sm-6">
                                <div class="stat-card">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <div class="stat-number">${stats.recentTransactions?.length || 0}</div>
                                            <div class="stat-label">Recent Transactions</div>
                                        </div>
                                        <div class="stat-icon text-info"><i class="fas fa-exchange-alt"></i></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <div class="stat-card">
                                    <h6><i class="fas fa-list"></i> Category Breakdown</h6>
                                    <table class="table table-sm mb-0">
                                        <tbody>
                                            ${(stats.categoryBreakdown || []).map(cat => `
                                                <tr>
                                                    <td><span class="badge badge-${cat.category}">${cat.category.replace('_', ' ').toUpperCase()}</span></td>
                                                    <td class="text-end">${cat.count} items</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stat-card">
                                    <h6><i class="fas fa-circle"></i> Status Breakdown</h6>
                                    <table class="table table-sm mb-0">
                                        <tbody>
                                            ${(stats.statusBreakdown || []).map(st => `
                                                <tr>
                                                    <td><span class="badge badge-${st.status}">${st.status || 'Active'}</span></td>
                                                    <td class="text-end">${st.count} items</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-12">
                                <div class="stat-card">
                                    <h6><i class="fas fa-history"></i> Recent Transactions</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm mb-0">
                                            <thead><tr><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th>Description</th></tr></thead>
                                            <tbody>
                                                ${(stats.recentTransactions || []).map(txn => `
                                                    <tr>
                                                        <td>${new Date(txn.created_at).toLocaleDateString()}</td>
                                                        <td>${txn.item_name}</td>
                                                        <td><span class="badge badge-${txn.type.toLowerCase()}">${txn.type}</span></td>
                                                        <td>${txn.quantity}</td>
                                                        <td>${txn.description || '-'}</td>
                                                    </tr>
                                                `).join('')}
                                                ${(!stats.recentTransactions || stats.recentTransactions.length === 0) ? `
                                                    <tr><td colspan="5" class="text-center text-muted">No transactions found</td></tr>
                                                ` : ''}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                showToast(error.message, 'error');
                this.content.innerHTML = `<div class="alert alert-danger">Error loading dashboard: ${error.message}</div>`;
            }
        }

        // ==================== INVENTORY ====================
        async loadInventory() {
            try {
                const params = {
                    page: this.currentPage,
                    limit: this.itemsPerPage,
                    sort: this.sortField,
                    order: this.sortDirection === 'asc' ? 'ASC' : 'DESC'
                };

                if (this.searchQuery) params.search = this.searchQuery;
                if (this.filterCategory !== 'all') params.category = this.filterCategory;
                if (this.filterStatus !== 'all') params.status = this.filterStatus;

                const result = await API.getItems(params);
                this.items = result.items;
                this.totalItems = result.pagination.total;
                this.totalPages = result.pagination.pages;

                // Get categories for filter
                const categories = await API.getCategories();
                const catNames = categories.map(c => c.name);

                // Get statuses from items
                const statuses = [...new Set(this.items.map(i => i.status || 'active'))];

                // Build the HTML (same as before but using API data)
                this.renderInventoryTable(catNames, statuses);
            } catch (error) {
                showToast(error.message, 'error');
                this.content.innerHTML = `<div class="alert alert-danger">Error loading inventory: ${error.message}</div>`;
            }
        }

        renderInventoryTable(categories, statuses) {
            const start = (this.currentPage - 1) * this.itemsPerPage;

            this.content.innerHTML = `
                <div class="container-fluid mt-3">
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <h4><i class="fas fa-boxes text-primary"></i> Inventory Management</h4>
                                <div>
                                    <button class="btn btn-success btn-sm" onclick="inventorySystem.openAddItemModal()">
                                        <i class="fas fa-plus"></i> Add Item
                                    </button>
                                    <button class="btn btn-outline-primary btn-sm" onclick="inventorySystem.exportInventory()">
                                        <i class="fas fa-file-export"></i> Export
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <div class="search-wrapper">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" class="form-control" id="inventorySearch" 
                                       placeholder="Search items..." value="${this.searchQuery}"
                                       oninput="inventorySystem.onSearch(this.value)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="categoryFilter" onchange="inventorySystem.onCategoryFilter(this.value)">
                                <option value="all">All Categories</option>
                                ${categories.map(cat => `
                                    <option value="${cat}" ${this.filterCategory === cat ? 'selected' : ''}>
                                        ${cat.replace('_', ' ').toUpperCase()}
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="statusFilter" onchange="inventorySystem.onStatusFilter(this.value)">
                                <option value="all">All Status</option>
                                ${statuses.map(status => `
                                    <option value="${status}" ${this.filterStatus === status ? 'selected' : ''}>
                                        ${status || 'Active'}
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" id="sortSelect" onchange="inventorySystem.onSort(this.value)">
                                <option value="id">Sort by ID</option>
                                <option value="name">Sort by Name</option>
                                <option value="quantity">Sort by Qty</option>
                                <option value="total_price">Sort by Value</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th style="width:60px">ID</th>
                                    <th>Item Name</th>
                                    <th style="width:70px">Unit</th>
                                    <th style="width:70px">Qty</th>
                                    <th style="width:100px">Unit Price</th>
                                    <th style="width:110px">Total Value</th>
                                    <th style="width:110px">Category</th>
                                    <th style="width:90px">Status</th>
                                    <th style="width:180px">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${this.items.length > 0 ? this.items.map(item => `
                                    <tr>
                                        <td>${item.id}</td>
                                        <td><strong class="text-truncate-2">${item.name}</strong></td>
                                        <td>${item.unit}</td>
                                        <td class="${item.quantity <= (item.min_stock_level || 5) && item.quantity > 0 ? 'text-danger fw-bold' : ''}">${item.quantity}</td>
                                        <td>${Number(item.unit_price).toFixed(2)}</td>
                                        <td>${Number(item.total_price || item.quantity * item.unit_price).toFixed(2)}</td>
                                        <td><span class="badge badge-${item.category}">${item.category.replace('_', ' ').toUpperCase()}</span></td>
                                        <td><span class="badge badge-${item.status || 'active'}">${item.status || 'Active'}</span></td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="inventorySystem.editItem(${item.id})" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-success btn-action" onclick="inventorySystem.stockIn(${item.id})" title="Stock In">
                                                <i class="fas fa-arrow-down"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-warning btn-action" onclick="inventorySystem.stockOut(${item.id})" title="Stock Out">
                                                <i class="fas fa-arrow-up"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger btn-action" onclick="inventorySystem.deleteItem(${item.id})" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `).join('') : `
                                    <tr><td colspan="9" class="text-center text-muted py-4">No items found matching your criteria</td></tr>
                                `}
                            </tbody>
                        </table>
                    </div>

                    ${this.totalPages > 1 ? `
                        <nav class="mt-3">
                            <ul class="pagination justify-content-center">
                                <li class="page-item ${this.currentPage <= 1 ? 'disabled' : ''}">
                                    <a class="page-link" onclick="inventorySystem.goToPage(${this.currentPage - 1})">Previous</a>
                                </li>
                                ${Array.from({length: Math.min(this.totalPages, 8)}, (_, i) => {
                                    const page = i + 1;
                                    return `<li class="page-item ${page === this.currentPage ? 'active' : ''}">
                                        <a class="page-link" onclick="inventorySystem.goToPage(${page})">${page}</a>
                                    </li>`;
                                }).join('')}
                                ${this.totalPages > 8 ? `<li class="page-item disabled"><span class="page-link">...</span></li>` : ''}
                                <li class="page-item ${this.currentPage >= this.totalPages ? 'disabled' : ''}">
                                    <a class="page-link" onclick="inventorySystem.goToPage(${this.currentPage + 1})">Next</a>
                                </li>
                            </ul>
                        </nav>
                        <p class="text-center text-muted small">Showing ${start + 1} - ${Math.min(start + this.itemsPerPage, this.totalItems)} of ${this.totalItems} items</p>
                    ` : ''}
                </div>
            `;
        }

        onSearch(query) { this.searchQuery = query; this.currentPage = 1; this.loadInventory(); }
        onCategoryFilter(value) { this.filterCategory = value; this.currentPage = 1; this.loadInventory(); }
        onStatusFilter(value) { this.filterStatus = value; this.currentPage = 1; this.loadInventory(); }
        onSort(value) { this.sortField = value; this.loadInventory(); }
        goToPage(page) { this.currentPage = page; this.loadInventory(); }

        // ==================== TRANSACTIONS ====================
        async loadTransactions() {
            try {
                const params = { page: 1, limit: 100 };
                if (this.transactionFilter !== 'all') params.type = this.transactionFilter;

                const result = await API.getTransactions(params);
                this.transactions = result.transactions;

                this.content.innerHTML = `
                    <div class="container-fluid mt-3">
                        <div class="row mb-3">
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                    <h4><i class="fas fa-exchange-alt text-primary"></i> Transaction History</h4>
                                    <button class="btn btn-primary btn-sm" onclick="inventorySystem.openTransactionModal()">
                                        <i class="fas fa-plus"></i> New Transaction
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3">
                                <select class="form-select" id="txnFilter" onchange="inventorySystem.onTxnFilter(this.value)">
                                    <option value="all" ${this.transactionFilter === 'all' ? 'selected' : ''}>All Transactions</option>
                                    <option value="in" ${this.transactionFilter === 'in' ? 'selected' : ''}>Stock In</option>
                                    <option value="out" ${this.transactionFilter === 'out' ? 'selected' : ''}>Stock Out</option>
                                </select>
                            </div>
                            <div class="col-md-9 text-end">
                                <span class="text-muted small">Total: ${this.transactions.length} transactions</span>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:50px">ID</th>
                                        <th style="width:110px">Date</th>
                                        <th>Item</th>
                                        <th style="width:70px">Type</th>
                                        <th style="width:70px">Qty</th>
                                        <th style="width:60px">Unit</th>
                                        <th style="width:90px">Unit Price</th>
                                        <th style="width:100px">Total</th>
                                        <th>Description</th>
                                        <th style="width:120px">Performed By</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${this.transactions.length > 0 ? this.transactions.map(txn => `
                                        <tr>
                                            <td>${txn.id}</td>
                                            <td>${new Date(txn.created_at).toLocaleDateString()}</td>
                                            <td><strong>${txn.item_name}</strong></td>
                                            <td><span class="badge badge-${txn.type.toLowerCase()}">${txn.type}</span></td>
                                            <td class="${txn.type === 'IN' ? 'text-success' : 'text-warning'} fw-bold">${txn.quantity}</td>
                                            <td>${txn.unit}</td>
                                            <td>${Number(txn.unit_price).toFixed(2)}</td>
                                            <td>${Number(txn.total_price).toFixed(2)}</td>
                                            <td>${txn.description || '-'}</td>
                                            <td>${txn.performed_by || '-'}</td>
                                        </tr>
                                    `).join('') : `
                                        <tr><td colspan="10" class="text-center text-muted py-4">No transactions found</td></tr>
                                    `}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        onTxnFilter(value) { this.transactionFilter = value; this.loadTransactions(); }

        // ==================== MODALS ====================
        openAddItemModal() {
            this.editItemId = null;
            this.showModal('Add New Item', `
                <form id="itemForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Item Name *</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Unit *</label>
                            <select class="form-select" id="itemUnit">
                                ${['pcs','kg','meter','liter','gallon','roll','packet','set','ton','mm'].map(u => `<option value="${u}">${u}</option>`).join('')}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Quantity *</label>
                            <input type="number" class="form-control" id="itemQty" value="0" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Unit Price (Birr) *</label>
                            <input type="number" class="form-control" id="itemPrice" value="0" min="0" step="0.01" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category *</label>
                            <select class="form-select" id="itemCategory">
                                ${['raw_material','fixed_asset','consumable'].map(c => `<option value="${c}">${c.replace('_',' ').toUpperCase()}</option>`).join('')}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="itemStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="used">Used</option>
                                <option value="damaged">Damaged</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="itemDesc" rows="2"></textarea>
                        </div>
                    </div>
                </form>
            `, () => this.saveItem());
        }

        async saveItem() {
            const name = document.getElementById('itemName').value.trim();
            const unit = document.getElementById('itemUnit').value;
            const quantity = parseFloat(document.getElementById('itemQty').value) || 0;
            const unitPrice = parseFloat(document.getElementById('itemPrice').value) || 0;
            const category = document.getElementById('itemCategory').value;
            const status = document.getElementById('itemStatus').value;
            const description = document.getElementById('itemDesc').value.trim();

            if (!name) { showToast('Please enter an item name.', 'error'); return; }

            try {
                await API.createItem({ name, unit, quantity, unitPrice, category, status, description });
                this.closeModal();
                this.loadInventory();
                showToast(`Item "${name}" added successfully!`, 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async editItem(id) {
            try {
                const item = await API.getItem(id);
                this.editItemId = id;

                this.showModal(`Edit Item: ${item.id}`, `
                    <form id="editItemForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Item Name *</label>
                                <input type="text" class="form-control" id="editItemName" value="${item.name}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Unit *</label>
                                <select class="form-select" id="editItemUnit">
                                    ${['pcs','kg','meter','liter','gallon','roll','packet','set','ton','mm'].map(u => `<option value="${u}" ${u === item.unit ? 'selected' : ''}>${u}</option>`).join('')}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Quantity *</label>
                                <input type="number" class="form-control" id="editItemQty" value="${item.quantity}" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Unit Price (Birr) *</label>
                                <input type="number" class="form-control" id="editItemPrice" value="${item.unit_price}" min="0" step="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Category *</label>
                                <select class="form-select" id="editItemCategory">
                                    ${['raw_material','fixed_asset','consumable'].map(c => `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c.replace('_',' ').toUpperCase()}</option>`).join('')}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="editItemStatus">
                                    <option value="active" ${item.status === 'active' ? 'selected' : ''}>Active</option>
                                    <option value="inactive" ${item.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                                    <option value="used" ${item.status === 'used' ? 'selected' : ''}>Used</option>
                                    <option value="damaged" ${item.status === 'damaged' ? 'selected' : ''}>Damaged</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" id="editItemDesc" rows="2">${item.description || ''}</textarea>
                            </div>
                        </div>
                    </form>
                `, () => this.updateItem());
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async updateItem() {
            const id = this.editItemId;
            const name = document.getElementById('editItemName').value.trim();
            const unit = document.getElementById('editItemUnit').value;
            const quantity = parseFloat(document.getElementById('editItemQty').value) || 0;
            const unitPrice = parseFloat(document.getElementById('editItemPrice').value) || 0;
            const category = document.getElementById('editItemCategory').value;
            const status = document.getElementById('editItemStatus').value;
            const description = document.getElementById('editItemDesc').value.trim();

            if (!name) { showToast('Please enter an item name.', 'error'); return; }

            try {
                await API.updateItem(id, { name, unit, quantity, unitPrice, category, status, description });
                this.closeModal();
                this.loadInventory();
                showToast(`Item "${name}" updated successfully!`, 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            try {
                await API.deleteItem(id);
                this.loadInventory();
                showToast('Item deleted successfully!', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        stockIn(id) { this.openTransactionModal(id, 'IN'); }
        stockOut(id) { this.openTransactionModal(id, 'OUT'); }

        async openTransactionModal(itemId = null, type = 'IN') {
            try {
                const items = await API.getItems({ limit: 1000 });
                const defaultItem = itemId ? items.items.find(i => i.id === itemId) : null;

                this.showModal('New Transaction', `
                    <form id="txnForm">
                        <div class="mb-3">
                            <label class="form-label">Item *</label>
                            <select class="form-select" id="txnItem" required>
                                <option value="">Select an item...</option>
                                ${items.items.map(i => `
                                    <option value="${i.id}" ${defaultItem && i.id === defaultItem.id ? 'selected' : ''}>
                                        ${i.id} - ${i.name} (${i.quantity} ${i.unit} available)
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Transaction Type *</label>
                            <select class="form-select" id="txnType" required>
                                <option value="IN" ${type === 'IN' ? 'selected' : ''}>Stock In</option>
                                <option value="OUT" ${type === 'OUT' ? 'selected' : ''}>Stock Out</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity *</label>
                            <input type="number" class="form-control" id="txnQty" value="1" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="txnDesc" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Reference</label>
                            <input type="text" class="form-control" id="txnRef" placeholder="PO number, work order, etc.">
                        </div>
                    </form>
                `, () => this.executeTransaction());
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async executeTransaction() {
            const itemId = parseInt(document.getElementById('txnItem').value);
            const type = document.getElementById('txnType').value;
            const quantity = parseFloat(document.getElementById('txnQty').value) || 0;
            const description = document.getElementById('txnDesc').value.trim();
            const reference = document.getElementById('txnRef').value.trim();

            if (!itemId) { showToast('Please select an item.', 'error'); return; }
            if (quantity <= 0) { showToast('Please enter a valid quantity.', 'error'); return; }

            try {
                await API.createTransaction({ itemId, type, quantity, description, reference });
                this.closeModal();
                if (this.currentView === 'transactions') this.loadTransactions();
                else this.loadInventory();
                showToast(`Transaction completed! ${type}: ${quantity} units`, 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // ==================== MODAL UTILITY ====================
        showModal(title, bodyHTML, onSave) {
            const modalId = 'dynamicModal';
            const existing = document.getElementById(modalId);
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.className = 'modal fade';
            modal.id = modalId;
            modal.innerHTML = `
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">${title}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">${bodyHTML}</div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-check"></i> Save</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
            const bsModal = new bootstrap.Modal(modal);
            bsModal.show();

            document.getElementById('modalSaveBtn').addEventListener('click', onSave);
            modal.addEventListener('hidden.bs.modal', () => {
                modal.remove();
                document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                document.body.classList.remove('modal-open');
                document.body.style.overflow = '';
            });
        }

        closeModal() {
            const modal = document.getElementById('dynamicModal');
            if (modal) {
                const bsModal = bootstrap.Modal.getInstance(modal);
                if (bsModal) bsModal.hide();
                else modal.remove();
            }
            document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
            document.body.classList.remove('modal-open');
            document.body.style.overflow = '';
        }

        // ==================== REPORTS ====================
        async loadReport() {
            try {
                const [topItems, monthlySummary, lowStock] = await Promise.all([
                    API.getTopItems(10),
                    API.getMonthlySummary(),
                    API.getLowStock()
                ]);

                this.content.innerHTML = `
                    <div class="container-fluid mt-3">
                        <div class="row mb-3">
                            <div class="col-12">
                                <h4><i class="fas fa-file-alt text-primary"></i> Reports & Analytics</h4>
                                <p class="text-muted">Comprehensive inventory reports and insights</p>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="stat-card">
                                    <h6><i class="fas fa-chart-bar"></i> Top 10 Items by Value</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm mb-0">
                                            <thead><tr><th>#</th><th>Item</th><th>Value (Birr)</th></tr></thead>
                                            <tbody>
                                                ${topItems.map((item, i) => `
                                                    <tr>
                                                        <td>${i + 1}</td>
                                                        <td>${item.name}</td>
                                                        <td>${Number(item.total_price).toFixed(2)}</td>
                                                    </tr>
                                                `).join('')}
                                                ${topItems.length === 0 ? '<tr><td colspan="3" class="text-center text-muted">No items found</td></tr>' : ''}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stat-card">
                                    <h6><i class="fas fa-calendar-alt"></i> Monthly Transaction Summary</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm mb-0">
                                            <thead><tr><th>Month</th><th>Stock In</th><th>Stock Out</th></tr></thead>
                                            <tbody>
                                                ${monthlySummary.map(m => `
                                                    <tr>
                                                        <td>${m.month}</td>
                                                        <td class="text-success">${m.stock_in || 0}</td>
                                                        <td class="text-warning">${m.stock_out || 0}</td>
                                                    </tr>
                                                `).join('')}
                                                ${monthlySummary.length === 0 ? '<tr><td colspan="3" class="text-center text-muted">No transactions</td></tr>' : ''}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <div class="stat-card">
                                    <h6><i class="fas fa-exclamation-triangle text-warning"></i> Low Stock Items</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm mb-0">
                                            <thead><tr><th>Item</th><th>Qty</th><th>Min Level</th><th>Unit</th></tr></thead>
                                            <tbody>
                                                ${lowStock.map(item => `
                                                    <tr>
                                                        <td>${item.name}</td>
                                                        <td class="text-danger fw-bold">${item.quantity}</td>
                                                        <td>${item.min_stock_level || 5}</td>
                                                        <td>${item.unit}</td>
                                                    </tr>
                                                `).join('')}
                                                ${lowStock.length === 0 ? '<tr><td colspan="4" class="text-center text-muted">No low stock items</td></tr>' : ''}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="stat-card">
                                    <h6><i class="fas fa-download"></i> Export Options</h6>
                                    <button class="btn btn-primary btn-sm me-2" onclick="inventorySystem.exportInventory()">
                                        <i class="fas fa-file-excel"></i> Export Inventory
                                    </button>
                                    <button class="btn btn-success btn-sm" onclick="inventorySystem.exportTransactions()">
                                        <i class="fas fa-file-excel"></i> Export Transactions
                                    </button>
                                    <hr>
                                    <p class="text-muted small">Data is stored in SQLite database. Export to CSV for further analysis.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // ==================== EXPORT ====================
        async exportInventory() {
            try {
                const result = await API.getItems({ limit: 10000 });
                const items = result.items;
                const headers = ['ID', 'Name', 'Unit', 'Quantity', 'Unit Price', 'Total Value', 'Category', 'Status'];
                const rows = items.map(i => [
                    i.id, `"${i.name}"`, i.unit, i.quantity,
                    Number(i.unit_price).toFixed(2), Number(i.total_price || i.quantity * i.unit_price).toFixed(2),
                    i.category, i.status || 'Active'
                ]);
                this.downloadCSV([headers, ...rows], 'inventory_export.csv');
                showToast('Inventory exported successfully!', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async exportTransactions() {
            try {
                const result = await API.getTransactions({ limit: 10000 });
                const transactions = result.transactions;
                const headers = ['ID', 'Date', 'Item ID', 'Item Name', 'Type', 'Quantity', 'Unit', 'Unit Price', 'Total', 'Description'];
                const rows = transactions.map(t => [
                    t.id, new Date(t.created_at).toLocaleDateString(), t.item_id, `"${t.item_name}"`,
                    t.type, t.quantity, t.unit, Number(t.unit_price).toFixed(2),
                    Number(t.total_price).toFixed(2), `"${t.description || ''}"`
                ]);
                this.downloadCSV([headers, ...rows], 'transactions_export.csv');
                showToast('Transactions exported successfully!', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        downloadCSV(rows, filename) {
            const csv = rows.map(row => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    }

    // ============================================================
    // INITIALIZE
    // ============================================================
    let inventorySystem;

    document.addEventListener('DOMContentLoaded', () => {
        inventorySystem = new StoreInventorySystem();
        window.inventorySystem = inventorySystem;
    });
    </script>
</body>
</html>
