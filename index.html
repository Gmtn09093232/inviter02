<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Warehouse IMS — Storekeeper</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --primary:#0f766e; --primary-dark:#115e59; --accent:#f59e0b;
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --success:#16a34a; --warning:#f59e0b; --danger:#dc2626;
    --info:#0284c7; --sidebar:#0f172a;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  button { cursor: pointer; border: none; background: none; }
  #loginScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#0f172a,#134e4a); padding: 20px; z-index: 2000; }
  .login-box { background:#fff; border-radius:16px; padding: 32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .login-box h1 { font-size:22px; margin-bottom: 6px; color: var(--primary-dark); }
  .login-box p { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  .app { display: none; min-height: 100vh; }
  .app.active { display: flex; }
  .sidebar { width: 240px; background: var(--sidebar); color: #cbd5e1; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index: 100; }
  .brand { padding: 20px; border-bottom: 1px solid #1e293b; }
  .brand h2 { color: #fff; font-size: 16px; }
  .brand small { color: #64748b; font-size: 11px; }
  .nav { flex: 1; padding: 10px 0; }
  .nav a { display: flex; align-items:center; gap: 10px; padding: 11px 20px; color:#cbd5e1; font-size: 13.5px; border-left: 3px solid transparent; cursor:pointer; }
  .nav a:hover { background: #1e293b; color:#fff; }
  .nav a.active { background:#1e293b; color:#fff; border-left-color: var(--accent); }
  .nav .section { padding: 14px 20px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color:#475569; }
  .nav .badge { margin-left:auto; background: var(--danger); color:#fff; border-radius: 10px; padding: 1px 7px; font-size: 10px; }
  .main { flex:1; margin-left:240px; min-width: 0; }
  .topbar { background:#fff; border-bottom:1px solid var(--border); padding: 12px 22px; display:flex; align-items:center; gap: 14px; position:sticky; top:0; z-index: 50; }
  .topbar h3 { font-size: 16px; flex: 1; }
  .user-chip { display:flex; align-items:center; gap:8px; font-size: 13px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-weight:600; font-size: 12px; }
  .content { padding: 20px; max-width: 1400px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
  .card .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card.warn .value { color: var(--warning); }
  .card.danger .value { color: var(--danger); }
  .card.success .value { color: var(--success); }
  .card.info .value { color: var(--info); }
  .panel { background:#fff; border-radius:12px; border:1px solid var(--border); margin-bottom: 18px; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .panel-head h4 { font-size: 14.5px; flex:1; }
  .panel-body { padding: 16px 18px; }
  .form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .field { display:flex; flex-direction:column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select, textarea { width:100%; padding: 9px 11px; border:1px solid var(--border); border-radius: 8px; background:#fff; outline:none; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; background: var(--primary); color:#fff; }
  .btn:hover { background: var(--primary-dark); }
  .btn.sec { background:#fff; color: var(--text); border:1px solid var(--border); }
  .btn.danger { background: var(--danger); }
  .btn.warn { background: var(--warning); color:#fff; }
  .btn.success { background: var(--success); }
  .btn.sm { padding: 6px 11px; font-size: 12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); background:#fff; }
  table { width:100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th { text-align:left; padding: 10px 12px; background:#f8fafc; color: var(--muted); font-weight:600; font-size: 11.5px; text-transform: uppercase; border-bottom:1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  .num { text-align: right; }
  .badge-status { display:inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .s-normal { background:#dcfce7; color:#166534; }
  .s-low { background:#fef3c7; color:#92400e; }
  .s-critical { background:#fed7aa; color:#9a3412; }
  .s-out { background:#fee2e2; color:#991b1b; }
  .s-draft { background:#e2e8f0; color:#475569; }
  .s-pending { background:#fef3c7; color:#92400e; }
  .s-approved { background:#dcfce7; color:#166534; }
  .s-rejected { background:#fee2e2; color:#991b1b; }
  .s-correction { background:#e0e7ff; color:#3730a3; }
  .s-reversed { background:#f3e8ff; color:#6b21a8; }
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index: 1000; padding: 14px; }
  .modal-overlay.active { display: flex; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width: 900px; max-height: 92vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { padding: 16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap: 10px; }
  .modal-head h4 { flex:1; font-size: 15.5px; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 14px 20px; border-top:1px solid var(--border); display:flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .x-btn { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size: 18px; color: var(--muted); }
  .empty { text-align:center; padding: 30px; color: var(--muted); font-size: 13px; }
  .empty-state { text-align:center; padding: 50px 20px; }
  .empty-state .icon { font-size: 54px; margin-bottom: 14px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 6px; }
  .empty-state p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background:#0f172a; color:#fff; padding: 12px 18px; border-radius:10px; z-index: 3000; font-size: 13px; transform: translateY(100px); opacity:0; transition: .25s; }
  .toast.show { transform: translateY(0); opacity:1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warn { background: var(--warning); }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background:#e2e8f0; color:#475569; font-weight: 600; }
  .mobile-nav { display: none; }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); transition:.25s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .mobile-nav { display:grid; grid-template-columns: repeat(5,1fr); position: fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); z-index: 90; }
    .mobile-nav button { padding: 9px 4px; font-size: 10.5px; display:flex; flex-direction:column; align-items:center; gap: 3px; color: var(--muted); }
    .mobile-nav button.active { color: var(--primary); }
    .menu-btn { display:grid; }
    .content { padding-bottom: 70px; }
  }
  .menu-btn { display:none; width:36px; height:36px; border-radius:8px; background:#f1f5f9; place-items:center; font-size:16px; }
  .chart-wrap { position: relative; height: 280px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🏭 Warehouse IMS</h1>
    <p>Warehouse Inventory Management System</p>
    <div class="field" style="margin-bottom:12px">
      <label>Username</label>
      <input id="loginUser" value="store" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Password</label>
      <input id="loginPass" type="password" value="store" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;justify-content:center" onclick="doLogin()" id="loginBtn">Sign In</button>
    <p style="margin-top:14px;font-size:11.5px;text-align:center;color:#94a3b8">
      Demo: admin/admin · manager/manager · store/store · auditor/auditor
    </p>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>🏭 Warehouse IMS</h2>
      <small id="brandSub">Loading…</small>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h3 id="pageTitle">Dashboard</h3>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">S</div>
        <div>
          <div style="font-weight:600" id="userName">Storekeeper</div>
          <div style="font-size:11px;color:var(--muted)" id="userRole">Storekeeper</div>
        </div>
        <button class="btn sec sm" onclick="logout()" style="margin-left:6px">Logout</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <button data-page="dashboard" onclick="go('dashboard')"><span>📊</span><span>Home</span></button>
    <button data-page="stockin" onclick="go('stockin')"><span>📥</span><span>Stock IN</span></button>
    <button data-page="stockout" onclick="go('stockout')"><span>📤</span><span>Stock OUT</span></button>
    <button data-page="currentstock" onclick="go('currentstock')"><span>📦</span><span>Stock</span></button>
    <button data-page="search" onclick="go('search')"><span>🔍</span><span>Search</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================================
   SUPABASE CONFIG — replace with your own project credentials
   ============================================================================ */
const SUPABASE_URL      = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
const EMAIL_DOMAIN      = '@wms.local';   // username@wms.local

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================================
   IN-MEMORY CACHE
   Data is fetched from Supabase into these arrays for fast UI rendering.
   Every write goes to Supabase first, then the cache refreshes.
   ============================================================================ */
const db = {
  user: null,
  items: [],
  categories: [],
  suppliers: [],
  departments: [],
  transactions: [],
  stock: [],              // from the current_stock view
  settings: { currency:'ETB', company:'Warehouse', slaHours:24, allowNegativeStock:false },
};

let currentPage = 'dashboard';
let dashChart = null;

/* ============================================================================
   HELPERS
   ============================================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = (n,d=2) => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const fmtQty = n => (Number(n)||0).toLocaleString('en-US');
const fmtMoney = n => `${db.settings.currency} ${fmt(n)}`;
const fmtDate = d => d ? new Date(d).toISOString().slice(0,10) : '-';
const fmtDateTime = d => d ? new Date(d).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
const today = () => new Date().toISOString().slice(0,10);

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._tid); t._tid = setTimeout(()=> t.classList.remove('show'), 2600);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); }

// Lookups (fast, cache-based)
const getItem       = id => db.items.find(i => i.id === id);
const getCategory   = id => db.categories.find(c => c.id === id);
const getSupplier   = id => db.suppliers.find(s => s.id === id);
const getDepartment = id => db.departments.find(d => d.id === id);
const getStockRow   = id => db.stock.find(s => s.item_id === id);
const getStock      = id => getStockRow(id)?.current_stock || 0;
const getUser       = id => ({ name: db.transactions.find(t=>t.requested_by===id)?.requester_name || '-' });

function getStockStatus(item){
  const qty = getStock(item.id);
  if(qty <= 0) return {label:'Out of Stock', cls:'s-out'};
  if(qty <= item.min_stock) return {label:'Critical', cls:'s-critical'};
  if(qty <= item.reorder_level) return {label:'Low Stock', cls:'s-low'};
  return {label:'Normal', cls:'s-normal'};
}

/* ============================================================================
   AUTH
   ============================================================================ */
async function doLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  document.getElementById('loginBtn').disabled = true;

  const { data, error } = await sb.auth.signInWithPassword({
    email: username + EMAIL_DOMAIN,
    password,
  });
  document.getElementById('loginBtn').disabled = false;

  if(error){ toast(error.message, 'error'); return; }

  // Load profile
  const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if(pErr || !profile){ toast('Profile not found', 'error'); await sb.auth.signOut(); return; }

  db.user = profile;
  await loadAll();
  enterApp();
}

async function logout(){
  await sb.auth.signOut();
  db.user = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
}

async function loadAll(){
  const [items, cats, sups, depts, txns, stock, settingsRows] = await Promise.all([
    sb.from('items').select('*').order('name'),
    sb.from('categories').select('*').order('name'),
    sb.from('suppliers').select('*').order('name'),
    sb.from('departments').select('*').order('name'),
    sb.from('transactions').select('*').order('created_at', { ascending:false }).limit(500),
    sb.from('current_stock').select('*'),
    sb.from('settings').select('*'),
  ]);

  db.items       = items.data || [];
  db.categories  = cats.data || [];
  db.suppliers   = sups.data || [];
  db.departments = depts.data || [];
  db.transactions= txns.data || [];
  db.stock       = stock.data || [];

  // Settings into a flat object
  const s = {};
  (settingsRows.data || []).forEach(r => s[r.key] = r.value);
  db.settings = {
    company: s.company || 'Warehouse',
    address: s.address || '',
    phone: s.phone || '',
    currency: s.currency || 'ETB',
    slaHours: parseInt(s.sla_hours || '24'),
    allowNegativeStock: s.allow_negative_stock === '1',
  };

  // Attach requester names to transactions (single join equivalent)
  if(db.transactions.length){
    const reqIds = [...new Set(db.transactions.map(t => t.requested_by))];
    const { data: profiles } = await sb.from('profiles').select('id,name').in('id', reqIds);
    const nameMap = {};
    (profiles || []).forEach(p => nameMap[p.id] = p.name);
    db.transactions.forEach(t => {
      t.requester_name = nameMap[t.requested_by] || '-';
      t.approver_name  = nameMap[t.approved_by]  || '-';
    });
  }
}

async function refreshStock(){
  const { data } = await sb.from('current_stock').select('*');
  db.stock = data || [];
}

async function refreshItems(){ 
  const { data } = await sb.from('items').select('*').order('name');
  db.items = data || [];
  await refreshStock();
}

async function refreshTransactions(){
  const { data } = await sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(500);
  db.transactions = data || [];
  if(db.transactions.length){
    const ids = [...new Set(db.transactions.flatMap(t => [t.requested_by, t.approved_by].filter(Boolean)))];
    const { data: profiles } = await sb.from('profiles').select('id,name').in('id', ids);
    const map = {};
    (profiles || []).forEach(p => map[p.id] = p.name);
    db.transactions.forEach(t => {
      t.requester_name = map[t.requested_by] || '-';
      t.approver_name  = map[t.approved_by]  || '-';
    });
  }
}

/* ============================================================================
   PERMISSIONS
   ============================================================================ */
const PERMS = {
  super_admin: ['*'],
  warehouse_manager: ['view_dashboard','view_items','manage_items','view_categories','manage_categories',
    'view_suppliers','manage_suppliers','view_departments','manage_departments',
    'view_transactions','view_stock','view_reports','view_analysis','view_audit','manage_users'],
  storekeeper: ['view_dashboard','view_items','manage_items','view_categories','manage_categories',
    'view_suppliers','manage_suppliers','view_departments','manage_departments',
    'view_transactions','view_stock','view_reports','view_analysis','view_item_history'],
  auditor: ['view_dashboard','view_items','view_stock','view_transactions','view_reports','view_analysis','view_audit'],
};
function can(p){
  if(!db.user) return false;
  const arr = PERMS[db.user.role] || [];
  return arr.includes('*') || arr.includes(p);
}

/* ============================================================================
   NAV / ROUTER
   ============================================================================ */
const NAV_ITEMS = [
  {section:'MAIN'},
  {page:'dashboard', label:'Dashboard', icon:'📊'},
  {page:'setup', label:'Setup Guide', icon:'🚀', perm:'manage_items'},

  {section:'MASTER DATA'},
  {page:'items', label:'Items / Products', icon:'📦', perm:'view_items'},
  {page:'categories', label:'Categories', icon:'🏷️', perm:'view_categories'},
  {page:'suppliers', label:'Suppliers', icon:'🚚', perm:'view_suppliers'},
  {page:'departments', label:'Departments', icon:'🏢', perm:'view_departments'},

  {section:'OPERATIONS'},
  {page:'stockin', label:'Stock IN', icon:'📥', perm:'view_transactions'},
  {page:'stockout', label:'Stock OUT', icon:'📤', perm:'view_transactions'},
  {page:'currentstock', label:'Current Stock', icon:'📋', perm:'view_stock'},
  {page:'adjustment', label:'Stock Adjustment', icon:'⚖️', perm:'view_transactions'},
  {page:'history', label:'Stock History', icon:'📜', perm:'view_transactions'},

  {section:'ANALYSIS'},
  {page:'analysis', label:'Inventory Analysis', icon:'📈', perm:'view_analysis'},
  {page:'fastmoving', label:'Fast-Moving', icon:'⚡', perm:'view_analysis'},
  {page:'slowmoving', label:'Slow-Moving', icon:'🐢', perm:'view_analysis'},
  {page:'deadstock', label:'Dead Stock', icon:'💀', perm:'view_analysis'},

  {section:'REPORTS'},
  {page:'reports', label:'Reports', icon:'📄', perm:'view_reports'},

  {section:'ADMIN'},
  {page:'audit', label:'Audit Log', icon:'🔒', perm:'view_audit'},
  {page:'settings', label:'Settings', icon:'⚙️'},
];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    if(item.section){
      const s = document.createElement('div'); s.className='section'; s.textContent=item.section;
      nav.appendChild(s); return;
    }
    if(item.perm && !can(item.perm)) return;
    const a = document.createElement('a');
    a.dataset.page = item.page;
    a.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    a.onclick = () => { go(item.page); document.getElementById('sidebar').classList.remove('open'); };
    nav.appendChild(a);
  });
}

function go(page){
  currentPage = page;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  document.querySelectorAll('.mobile-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const titles = { dashboard:'Dashboard', setup:'Setup Guide', items:'Items', categories:'Categories',
    suppliers:'Suppliers', departments:'Departments', stockin:'Stock IN', stockout:'Stock OUT',
    currentstock:'Current Stock', adjustment:'Stock Adjustment', history:'Stock History',
    analysis:'Inventory Analysis', fastmoving:'Fast-Moving', slowmoving:'Slow-Moving',
    deadstock:'Dead Stock', reports:'Reports', audit:'Audit Log', settings:'Settings', search:'Search' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  const c = document.getElementById('content');
  const R = { dashboard: renderDashboard, setup: renderSetup, items: renderItems,
    categories: renderCategories, suppliers: renderSuppliers, departments: renderDepartments,
    stockin: renderStockIn, stockout: renderStockOut, currentstock: renderCurrentStock,
    adjustment: renderAdjustment, history: renderHistory, analysis: renderAnalysis,
    fastmoving: renderFastMoving, slowmoving: renderSlowMoving, deadstock: renderDeadStock,
    reports: renderReports, audit: renderAudit, settings: renderSettings, search: renderSearch };
  (R[page] || renderDashboard)(c);
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = db.user.name;
  document.getElementById('userRole').textContent = db.user.role;
  document.getElementById('userAvatar').textContent = db.user.name.charAt(0).toUpperCase();
  document.getElementById('brandSub').textContent = db.settings.company;
  buildNav();
  go(db.items.length === 0 ? 'setup' : 'dashboard');
}

/* ============================================================================
   PILLS
   ============================================================================ */
function typePill(type){
  const map = { STOCK_IN:['📥','In','#dcfce7','#166534'], STOCK_OUT:['📤','Out','#fee2e2','#991b1b'],
    ADJUSTMENT_IN:['⚖️','Adj+','#dbeafe','#1e40af'], ADJUSTMENT_OUT:['⚖️','Adj-','#fef3c7','#92400e'],
    OPENING:['🏁','Opening','#e0e7ff','#3730a3'], REVERSAL:['↩️','Rev','#f3e8ff','#6b21a8'] };
  const [i,l,bg,c] = map[type] || ['•',type,'#e2e8f0','#475569'];
  return `<span class="pill" style="background:${bg};color:${c}">${i} ${l}</span>`;
}
function statusPill(s){
  const map = { Draft:'s-draft', 'Pending Approval':'s-pending', Approved:'s-approved',
    Rejected:'s-rejected', 'Needs Correction':'s-correction', Reversed:'s-reversed' };
  return `<span class="badge-status ${map[s]||'s-draft'}">${esc(s)}</span>`;
}

function renderSetup(c){

    {done: db.items.length > 0,      label:'Create Items',      desc:'Add products, location, min levels.', action:"go('items')", icon:'📦'},
    {done: db.transactions.some(t => t.type==='STOCK_IN'), label:'Record First Stock IN', desc:'Load opening stock.', action:"go('stockin')", icon:'📥'},
  ];
  const done = steps.filter(s=>s.done).length;
  const pct = Math.round((done/steps.length)*100);

  c.innerHTML = `

  const totalValue = db.stock.reduce((s,r)=>s+Math.max(0,Number(r.current_stock))*Number(r.unit_cost),0);

  const todayStr = today();
  const todayIn = db.transactions.filter(t=>t.status==='Approved'&&t.type==='STOCK_IN'&&t.date===todayStr)

  const todayOut = db.transactions.filter(t=>t.status==='Approved'&&t.type==='STOCK_OUT'&&t.date===todayStr)

      <div class="card"><div class="label">Transactions</div><div class="value">${txnCount}</div></div>
    </div>
    <div class="panel">

      <div class="panel-body" style="padding:0">

                  <td>${esc(i.warehouse||'')} · ${esc(i.rack||'')}/${esc(i.shelf||'')}/${esc(i.bin||'')}</td>

async function saveItem(id){
  const data = {
    code: document.getElementById('f_code').value.trim(),
    name: document.getElementById('f_name').value.trim(),
    category_id: +document.getElementById('f_cat').value || null,
    unit: document.getElementById('f_unit').value,
    unit_cost: +document.getElementById('f_cost').value || 0,
    min_stock: +document.getElementById('f_min').value || 0,
    reorder_level: +document.getElementById('f_reorder').value || 0,
    max_stock: +document.getElementById('f_max').value || 0,
    supplier_id: +document.getElementById('f_sup').value || null,
    warehouse: document.getElementById('f_wh').value.trim() || 'Main Warehouse',
    rack: document.getElementById('f_rack').value.trim(),
    shelf: document.getElementById('f_shelf').value.trim(),
    bin: document.getElementById('f_bin').value.trim(),
    barcode: document.getElementById('f_bar').value.trim() || null,
    status: document.getElementById('f_status').value,
    updated_at: new Date().toISOString(),
  };
  if(!data.code || !data.name){ toast('Code and Name required', 'error'); return; }

  let err;
  if(id){
    ({ error: err } = await sb.from('items').update(data).eq('id', id));
  } else {
    ({ error: err } = await sb.from('items').insert([data]));
  }
  if(err){ toast(err.message, 'error'); return; }

  await sb.from('audit_logs').insert([{ user_id: db.user.id, user_name: db.user.name,
    action: id ? 'ITEM_UPDATED' : 'ITEM_CREATED', item_name: data.name, note: data.code }]);

  toast(id ? 'Item updated' : 'Item created', 'success');
  closeModal();
  await refreshItems();
  renderItems(document.getElementById('content'));
}

    c.innerHTML = `<div class="empty-state"><div class="icon">📦</div><h3>No items</h3>
      <button class="btn" onclick="go('items')">Go to Items</button></div>`;
    return;
  }
  stockInCart = [];
  c.innerHTML = `

        <div class="form-grid">
          <div class="field"><label>Date</label><input id="in_date" type="date" value="${today()}"></div>

            <select id="in_supplier"><option value="">--</option>
              ${db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}

        </div>
      </div>
    </div>

      <div class="panel-head"><h4>Items</h4>

        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th class="num">Unit Cost</th><th class="num">Total</th><th></th></tr></thead>

          </table>
        </div>
      </div>
      <div class="panel-body" style="border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end">
        <button class="btn sec" onclick="saveStockIn('Draft')">💾 Draft</button>
        <button class="btn" onclick="saveStockIn('submit')">📨 Submit</button>
      </div>
    </div>`;
  renderStockInLines();
}
function addStockInLine(){
  stockInCart.push({item_id:'', qty:1, unit_cost:0});
  renderStockInLines();
}
function renderStockInLines(){
  document.getElementById('inLines').innerHTML = stockInCart.length ? stockInCart.map((l, idx) => {
    const item = l.item_id ? getItem(+l.item_id) : null;
    return `<tr>
      <td><select onchange="updateInLine(${idx},'item_id',+this.value)" style="min-width:180px">
        <option value="">-- Select --</option>
        ${db.items.filter(i=>i.status==='Active').map(i=>`<option value="${i.id}" ${i.id==l.item_id?'selected':''}>${esc(i.code)} - ${esc(i.name)}</option>`).join('')}
      </select></td>
      <td><input type="number" value="${l.qty}" onchange="updateInLine(${idx},'qty',+this.value)" style="width:80px"></td>
      <td>${item?esc(item.unit):'-'}</td>
      <td><input type="number" step="0.01" value="${l.unit_cost}" onchange="updateInLine(${idx},'unit_cost',+this.value)" style="width:100px"></td>
      <td class="num">${fmt(l.qty*l.unit_cost)}</td>
      <td><button class="btn sec sm" onclick="removeInLine(${idx})">✕</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="empty">No items added.</td></tr>';
  document.getElementById('inTotal').innerHTML = `<b>${fmt(stockInCart.reduce((s,l)=>s+l.qty*l.unit_cost,0))}</b>`;
}
function updateInLine(idx, key, val){
  stockInCart[idx][key] = val;
  if(key === 'item_id'){ const item = getItem(val); if(item) stockInCart[idx].unit_cost = Number(item.unit_cost); }
  renderStockInLines();
}
function removeInLine(idx){ stockInCart.splice(idx,1); renderStockInLines(); }

async function saveStockIn(mode){
  const valid = stockInCart.filter(l => l.item_id && l.qty > 0);
  if(!valid.length){ toast('Add items first', 'error'); return; }

  // Generate number
  const { data: numData } = await sb.rpc('next_txn_number', { p_type: 'STOCK_IN' });
  const number = numData;

  const { data: txn, error } = await sb.from('transactions').insert([{
    number, type:'STOCK_IN', date: document.getElementById('in_date').value || today(),
    status:'Draft', requested_by: db.user.id,
    supplier_id: +document.getElementById('in_supplier').value || null,
    reference: document.getElementById('in_ref').value.trim(),
    notes: document.getElementById('in_notes').value.trim(),
  }]).select().single();
  if(error){ toast(error.message, 'error'); return; }

  const itemRows = valid.map(l => ({
    transaction_id: txn.id, item_id: l.item_id, qty: l.qty,
    unit_cost: l.unit_cost, unit: getItem(l.item_id).unit,
  }));
  const { error: itemErr } = await sb.from('transaction_items').insert(itemRows);
  if(itemErr){ toast(itemErr.message, 'error'); return; }

  await sb.from('approval_history').insert([{ transaction_id: txn.id, user_id: db.user.id,
    user_name: db.user.name, action: 'Created' }]);
  await sb.from('audit_logs').insert([{ user_id: db.user.id, user_name: db.user.name,
    action: 'STOCK_IN_CREATED', txn_number: number, note: `${valid.length} items` }]);

  if(mode === 'submit'){
    const { data: res, error: rpcErr } = await sb.rpc('submit_transaction', { p_txn_id: txn.id });
    if(rpcErr || !res?.success){ toast(rpcErr?.message || res?.error, 'error'); return; }
    toast('Submitted for approval', 'success');
  } else {
    toast('Saved as draft', 'success');
  }
  await refreshTransactions();
  await refreshStock();
  go('stockin');
}

function addStockOutLine(){ stockOutCart.push({item_id:'', qty:1}); renderStockOutLines(); }
function renderStockOutLines(){
  document.getElementById('outLines').innerHTML = stockOutCart.length ? stockOutCart.map((l, idx) => {
    const item = l.item_id ? getItem(+l.item_id) : null;
    const avail = item ? getStock(item.id) : 0;
    const exceeded = item && !db.settings.allowNegativeStock && l.qty > avail;
    return `<tr${exceeded?' style="background:#fef2f2"':''}>
      <td><select onchange="updateOutLine(${idx},'item_id',+this.value)" style="min-width:180px">
        <option value="">-- Select --</option>
        ${db.items.filter(i=>i.status==='Active').map(i=>`<option value="${i.id}" ${i.id==l.item_id?'selected':''}>${esc(i.code)} - ${esc(i.name)}</option>`).join('')}
      </select></td>
      <td class="num">${item?fmtQty(avail):'-'}</td>
      <td><input type="number" value="${l.qty}" onchange="updateOutLine(${idx},'qty',+this.value)" style="width:90px"></td>
      <td>${item?esc(item.unit):'-'}</td>
      <td><button class="btn sec sm" onclick="removeOutLine(${idx})">✕</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No items added.</td></tr>';
}
function updateOutLine(idx, key, val){ stockOutCart[idx][key] = val; renderStockOutLines(); }
function removeOutLine(idx){ stockOutCart.splice(idx,1); renderStockOutLines(); }

async function saveStockOut(mode){
  const valid = stockOutCart.filter(l => l.item_id && l.qty > 0);
  if(!valid.length){ toast('Add items first', 'error'); return; }

  for(const l of valid){
    const item = getItem(l.item_id);
    const avail = getStock(item.id);
    if(!db.settings.allowNegativeStock && l.qty > avail){
      toast(`Insufficient stock for ${item.name}`, 'error'); return;
    }
  }

  const { data: number } = await sb.rpc('next_txn_number', { p_type: 'STOCK_OUT' });
  const { data: txn, error } = await sb.from('transactions').insert([{
    number, type:'STOCK_OUT', date: document.getElementById('out_date').value || today(),
    status:'Draft', requested_by: db.user.id,
    department_id: +document.getElementById('out_dept').value || null,
    recipient: document.getElementById('out_recipient').value.trim(),
    reference: document.getElementById('out_ref').value.trim(),
    purpose: document.getElementById('out_purpose').value.trim(),
    notes: document.getElementById('out_notes').value.trim(),
  }]).select().single();
  if(error){ toast(error.message, 'error'); return; }

  const itemRows = valid.map(l => {
    const item = getItem(l.item_id);
    return { transaction_id: txn.id, item_id: l.item_id, qty: l.qty,
      unit_cost: item.unit_cost, unit: item.unit };
  });
  const { error: itemErr } = await sb.from('transaction_items').insert(itemRows);
  if(itemErr){ toast(itemErr.message, 'error'); return; }

  await sb.from('approval_history').insert([{ transaction_id: txn.id, user_id: db.user.id,
    user_name: db.user.name, action: 'Created' }]);
  await sb.from('audit_logs').insert([{ user_id: db.user.id, user_name: db.user.name,
    action: 'STOCK_OUT_CREATED', txn_number: number, note: `${valid.length} items` }]);

  if(mode === 'submit'){
    const { data: res, error: rpcErr } = await sb.rpc('submit_transaction', { p_txn_id: txn.id });
    if(rpcErr || !res?.success){ toast(rpcErr?.message || res?.error, 'error'); return; }
    toast('Submitted for approval', 'success');
  } else {
    toast('Saved as draft', 'success');
  }
  await refreshTransactions();
  await refreshStock();
  go('stockout');
}

   STOCK ADJUSTMENT
   ============================================================================ */
function renderAdjustment(c){
  if(db.items.length === 0){
    c.innerHTML = `<div class="empty-state"><div class="icon">⚖️</div><h3>No items</h3>
      <button class="btn" onclick="go('items')">Go to Items</button></div>`;
    return;
  }
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h4>⚖️ Stock Adjustment</h4></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>Item</label>
            <select id="adj_item" onchange="updateAdjPreview()">
              <option value="">-- Select --</option>
              ${db.items.filter(i=>i.status==='Active').map(i=>`<option value="${i.id}">${esc(i.code)} - ${esc(i.name)} (${getStock(i.id)})</option>`).join('')}
            </select></div>
          <div class="field"><label>System Qty</label><input id="adj_sys" readonly></div>
          <div class="field"><label>Physical Qty</label><input id="adj_phys" type="number" onchange="updateAdjPreview()"></div>
          <div class="field"><label>Difference</label><input id="adj_diff" readonly></div>
          <div class="field"><label>Reason</label>
            <select id="adj_reason">
              <option>Physical count difference</option><option>Damaged item</option>
              <option>Lost item</option><option>Found item</option><option>Other</option>
            </select></div>
          <div class="field" style="grid-column:1/-1"><label>Notes *</label><textarea id="adj_notes" rows="2"></textarea></div>
        </div>
      </div>
      <div class="panel-body" style="border-top:1px solid var(--border);display:flex;justify-content:flex-end">
        <button class="btn" onclick="submitAdjustment()">Submit for Approval</button>
      </div>
    </div>`;
}
function updateAdjPreview(){
  const id = +document.getElementById('adj_item').value;
  if(!id) return;
  const sys = getStock(id);
  document.getElementById('adj_sys').value = sys;
  const phys = +document.getElementById('adj_phys').value;
  if(!isNaN(phys)) document.getElementById('adj_diff').value = phys - sys;
}
async function submitAdjustment(){
  const itemId = +document.getElementById('adj_item').value;
  const sys = +document.getElementById('adj_sys').value;
  const phys = +document.getElementById('adj_phys').value;
  const reason = document.getElementById('adj_reason').value;
  const notes = document.getElementById('adj_notes').value.trim();
  if(!itemId){ toast('Select item', 'error'); return; }
  if(isNaN(phys)){ toast('Enter physical qty', 'error'); return; }
  if(!notes){ toast('Notes required', 'error'); return; }
  const diff = phys - sys;
  if(diff === 0){ toast('No difference', 'warn'); return; }

  const item = getItem(itemId);
  const type = diff > 0 ? 'ADJUSTMENT_IN' : 'ADJUSTMENT_OUT';
  const { data: number } = await sb.rpc('next_txn_number', { p_type: type });

  const { data: txn, error } = await sb.from('transactions').insert([{
    number, type, date: today(), status: 'Draft', requested_by: db.user.id,
    reason, notes, adj_system: sys, adj_physical: phys, adj_diff: diff,
  }]).select().single();
  if(error){ toast(error.message, 'error'); return; }

  await sb.from('transaction_items').insert([{
    transaction_id: txn.id, item_id: itemId, qty: Math.abs(diff),
    unit_cost: item.unit_cost, unit: item.unit
  }]);
  await sb.from('approval_history').insert([{ transaction_id: txn.id, user_id: db.user.id,
    user_name: db.user.name, action: 'Created', comment: `System ${sys} → Physical ${phys}` }]);
  await sb.from('audit_logs').insert([{ user_id: db.user.id, user_name: db.user.name,
    action: 'ADJUSTMENT_CREATED', txn_number: number, item_name: item.name,
    old_value: sys, new_value: phys }]);

  const { data: res, error: rpcErr } = await sb.rpc('submit_transaction', { p_txn_id: txn.id });
  if(rpcErr || !res?.success){ toast(rpcErr?.message || res?.error, 'error'); return; }

  toast('Submitted for approval', 'success');
  await refreshTransactions();
  go('adjustment');
}

function renderHistory(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h4>📜 Transactions</h4>
        <select id="hist_type" style="width:auto" onchange="renderHistoryRows()">
          <option value="">All Types</option>
          <option>STOCK_IN</option><option>STOCK_OUT</option>
          <option>ADJUSTMENT_IN</option><option>ADJUSTMENT_OUT</option>
        </select>
        <select id="hist_status" style="width:auto" onchange="renderHistoryRows()">
          <option value="">All Status</option>
          <option>Draft</option><option>Pending Approval</option><option>Approved</option>
          <option>Rejected</option><option>Needs Correction</option><option>Reversed</option>
        </select>
      </div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap" style="border:none">
          <table>
            <thead><tr><th>Date</th><th>Number</th><th>Type</th><th class="num">Qty</th><th>Status</th><th>Requested By</th><th></th></tr></thead>
            <tbody id="histBody"></tbody>
          </table>
        </div>
      </div>
    </div>`;
  renderHistoryRows();
}
async function renderHistoryRows(){
  const type = document.getElementById('hist_type').value;
  const status = document.getElementById('hist_status').value;
  let q = sb.from('transactions').select('*').order('created_at', {ascending:false}).limit(300);
  if(type) q = q.eq('type', type);
  if(status) q = q.eq('status', status);
  const { data } = await q;
  const rows = data || [];

  // Fetch item counts per txn
  const ids = rows.map(r => r.id);
  const { data: items } = ids.length
    ? await sb.from('transaction_items').select('transaction_id,qty').in('transaction_id', ids)
    : { data: [] };
  const totals = {};
  (items||[]).forEach(i => { totals[i.transaction_id] = (totals[i.transaction_id]||0) + Number(i.qty); });

  document.getElementById('histBody').innerHTML = rows.length ? rows.map(t => `
    <tr>
      <td>${fmtDate(t.date)}</td>
      <td><b>${esc(t.number)}</b></td>
      <td>${typePill(t.type)}</td>
      <td class="num">${fmtQty(totals[t.id]||0)}</td>
      <td>${statusPill(t.status)}</td>
      <td>${esc(t.requester_name || '-')}</td>
      <td><button class="btn sec sm" onclick="viewTransaction('${t.id}')">View</button></td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">No transactions</td></tr>';
}

async function viewTransaction(id){
  const t = db.transactions.find(x => x.id === id) || (await sb.from('transactions').select('*').eq('id', id).single()).data;
  if(!t) return;
  const { data: items } = await sb.from('transaction_items').select('*').eq('transaction_id', id);
  const { data: history } = await sb.from('approval_history').select('*').eq('transaction_id', id).order('created_at');

  openModal(`
    <div class="modal-head"><h4>${typePill(t.type)} ${esc(t.number)} ${statusPill(t.status)}</h4>
      <button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="padding:6px 0">Date: <b>${fmtDate(t.date)}</b></div>
      ${t.reference?`<div style="padding:6px 0">Reference: <b>${esc(t.reference)}</b></div>`:''}
      ${t.notes?`<div style="padding:6px 0">Notes: <b>${esc(t.notes)}</b></div>`:''}
      <div class="panel" style="margin-top:14px">
        <div class="panel-head"><h4>Items</h4></div>
        <div class="panel-body" style="padding:0">
          <table style="min-width:auto">
            <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit Cost</th><th class="num">Total</th></tr></thead>
            <tbody>${(items||[]).map(l => {
              const item = getItem(l.item_id);
              return `<tr><td>${esc(item?.name||'-')}</td>
                <td class="num">${fmtQty(l.qty)}</td>
                <td class="num">${fmt(l.unit_cost)}</td>
                <td class="num">${fmt(l.qty*l.unit_cost)}</td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>
      </div>
      <div class="panel" style="margin-top:14px">
        <div class="panel-head"><h4>Approval History</h4></div>
        <div class="panel-body">
          ${(history||[]).map(h => `
            <div style="padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px">
              <b>${esc(h.user_name)}</b> · ${esc(h.action)} · ${fmtDateTime(h.created_at)}
              ${h.comment?`<div style="color:var(--muted);font-size:12px">${esc(h.comment)}</div>`:''}
            </div>`).join('') || '<div class="empty">No history</div>'}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      ${t.status === 'Draft' && t.requested_by === db.user.id ?
        `<button class="btn" onclick="submitFromView('${t.id}')">Submit for Approval</button>` : ''}
      <button class="btn sec" onclick="closeModal()">Close</button>
    </div>`);
}
async function submitFromView(id){
  const { data, error } = await sb.rpc('submit_transaction', { p_txn_id: id });
  if(error || !data?.success){ toast(error?.message || data?.error, 'error'); return; }
  toast('Submitted for approval', 'success');
  closeModal();
  await refreshTransactions();
  go(currentPage);
}

/* ============================================================================
   ANALYSIS
   ============================================================================ */
function renderAnalysis(c){
  if(db.items.length === 0){
    c.innerHTML = `<div class="empty-state"><div class="icon">📈</div><h3>Nothing to analyse</h3></div>`;
    return;
  }
  const totalValue = db.stock.reduce((s,r)=>s+Math.max(0,Number(r.current_stock))*Number(r.unit_cost),0);
  const totalQty = db.stock.reduce((s,r)=>s+Math.max(0,Number(r.current_stock)),0);

  const catValues = {};
  db.items.forEach(i => {
    const cat = getCategory(i.category_id);
    const name = cat?.name || 'Uncategorized';
    catValues[name] = (catValues[name]||0) + getStock(i.id) * Number(i.unit_cost);
  });

  c.innerHTML = `
    <div class="cards">
      <div class="card success"><div class="label">Inventory Value</div><div class="value" style="font-size:18px">${fmtMoney(totalValue)}</div></div>
      <div class="card info"><div class="label">Total Qty</div><div class="value">${fmtQty(totalQty)}</div></div>
      <div class="card"><div class="label">Active Items</div><div class="value">${db.items.filter(i=>i.status==='Active').length}</div></div>
      <div class="card warn"><div class="label">Empty Items</div><div class="value">${db.items.filter(i=>getStock(i.id)<=0).length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h4>💰 Value by Category</h4></div>
      <div class="panel-body"><div class="chart-wrap"><canvas id="catChart"></canvas></div></div>
    </div>`;
  setTimeout(() => {
    const ctx = document.getElementById('catChart');
    if(!ctx) return;
    if(dashChart) dashChart.destroy();
    dashChart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels:Object.keys(catValues),
        datasets:[{data:Object.values(catValues), backgroundColor:['#0f766e','#0284c7','#f59e0b','#dc2626','#7c3aed','#16a34a']}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right'}}}
    });
  }, 30);
}

/* ============================================================================
   REPORTS (sample — extend as needed)
   ============================================================================ */
function renderReports(c){
  const reports = [
    {id:'current_stock', title:'Current Stock', icon:'📦'},
    {id:'valuation', title:'Inventory Valuation', icon:'💰'},
    {id:'low_stock', title:'Low Stock', icon:'⚠️'},
    {id:'out_of_stock', title:'Out-of-Stock', icon:'❌'},
  ];
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h4>📄 Reports</h4></div>
      <div class="panel-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
          ${reports.map(r => `<button class="btn sec" style="padding:14px;justify-content:flex-start" onclick="runReport('${r.id}')">
            <span style="font-size:18px">${r.icon}</span> ${r.title}</button>`).join('')}
        </div>
      </div>
    </div>`;
}
function runReport(id){
  let rows = [];
  if(id === 'current_stock'){
    rows = [['Code','Name','Location','Qty','Unit','Value','Status']];
    db.stock.forEach(r => {
      rows.push([r.code, r.item_name, `${r.warehouse||''} ${r.rack||''}/${r.shelf||''}/${r.bin||''}`,
        r.current_stock, r.unit, (Number(r.current_stock)*Number(r.unit_cost)).toFixed(2), getStockStatus(getItem(r.item_id)).label]);
    });
  } else if(id === 'valuation'){
    rows = [['Code','Item','Qty','Unit Cost','Total Value']];
    db.stock.forEach(r => rows.push([r.code, r.item_name, r.current_stock, r.unit_cost, (Number(r.current_stock)*Number(r.unit_cost)).toFixed(2)]));
    rows.push(['','','','TOTAL', db.stock.reduce((s,r)=>s+Number(r.current_stock)*Number(r.unit_cost),0).toFixed(2)]);
  } else if(id === 'low_stock'){
    rows = [['Code','Item','Qty','Min','Reorder']];
    db.items.forEach(i => { const s = getStockStatus(i).label; if(s==='Low Stock'||s==='Critical')
      rows.push([i.code, i.name, getStock(i.id), i.min_stock, i.reorder_level]); });
  } else if(id === 'out_of_stock'){
    rows = [['Code','Item','Unit Cost']];
    db.items.filter(i=>getStock(i.id)<=0).forEach(i => rows.push([i.code, i.name, i.unit_cost]));
  }

  openModal(`
    <div class="modal-head"><h4>${id}</h4><button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="table-wrap"><table>
        <thead><tr>${(rows[0]||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.slice(1).map(r => `<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="modal-foot">
      <button class="btn sec" onclick="downloadCSV('${id}', ${JSON.stringify(rows).replace(/'/g,"\\'")})">⬇ CSV</button>
      <button class="btn sec" onclick="closeModal()">Close</button>
    </div>`);
}
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}_${today()}.csv`;
  a.click();
}

async function saveSettings(){
  const rows = [
    {key:'company', value:document.getElementById('set_company').value},
    {key:'address', value:document.getElementById('set_address').value},
    {key:'currency', value:document.getElementById('set_currency').value},
  ];
  for(const r of rows) await sb.from('settings').upsert(r);
  await loadAll();
  toast('Saved', 'success');
}

/* ============================================================================
   SEARCH
   ============================================================================ */
function renderSearch(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h4>🔍 Search Item</h4></div>
      <div class="panel-body">
        <div class="field"><label>Search by name, code, or barcode</label>
          <input id="searchInput" autofocus placeholder="Type..."></div>
        <div id="searchResult" style="margin-top:14px"></div>
      </div>
    </div>`;
  const input = document.getElementById('searchInput');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    const res = document.getElementById('searchResult');
    if(!q){ res.innerHTML = ''; return; }
    const matches = db.items.filter(i =>
      i.code.toLowerCase().includes(q) ||
      i.name.toLowerCase().includes(q) ||
      (i.barcode||'').includes(q)
    ).slice(0, 10);
    res.innerHTML = matches.length ? matches.map(i => {
      const s = getStockStatus(i);
      return `<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between">
        <div><div style="font-weight:600">${esc(i.name)}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(i.code)} · ${esc(i.warehouse)} · ${esc(i.rack)}/${esc(i.shelf)}/${esc(i.bin)}</div>
          <div style="margin-top:4px"><span class="badge-status ${s.cls}">${s.label}</span>
            <b style="margin-left:8px">${fmtQty(getStock(i.id))} ${esc(i.unit)}</b></div></div>
        <button class="btn sm" onclick="viewItemDetail(${i.id})">View</button>
      </div>`;
    }).join('') : '<div class="empty">No matches</div>';
  });
}

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(profile){
      db.user = profile;
      await loadAll();
      enterApp();
      return;
    }
  }
  document.getElementById('loginScreen').style.display = 'flex';
})();
