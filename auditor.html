<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> AMIMTDE Auditor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --primary:#1e40af; --primary-dark:#1e3a8a; --accent:#0284c7;
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --success:#16a34a; --warn:#f59e0b; --danger:#dc2626;
    --sidebar:#0c1e3e;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size:14px; }
  button, input, select, textarea { font-family: inherit; font-size:14px; }
  button { cursor:pointer; border:none; background:none; }
  #loginScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#0c1e3e,#1e3a8a); padding:20px; z-index:2000; }
  .login-box { background:#fff; border-radius:16px; padding:32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .login-box h1 { font-size:20px; margin-bottom:4px; color:#1e3a8a; }
  .role-badge { display:inline-block; background:#dbeafe; color:#1e40af; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; margin-bottom:14px; }
  .login-box p { color: var(--muted); margin-bottom:20px; font-size:12.5px; }
  .app { display:none; min-height:100vh; }
  .app.active { display:flex; }
  .sidebar { width:250px; background:var(--sidebar); color:#cbd5e1; flex-shrink:0; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:100; }
  .brand { padding:20px; border-bottom:1px solid #1e293b; }
  .brand h2 { color:#fff; font-size:15px; }
  .brand small { color:#7dd3fc; font-size:11px; font-weight:600; }
  .nav { flex:1; padding:10px 0; }
  .nav a { display:flex; align-items:center; gap:10px; padding:11px 20px; color:#cbd5e1; font-size:13.5px; border-left:3px solid transparent; cursor:pointer; }
  .nav a:hover { background:#1e293b; color:#fff; }
  .nav a.active { background:#1e293b; color:#fff; border-left-color:#38bdf8; }
  .nav .section { padding:14px 20px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#475569; }
  .main { flex:1; margin-left:250px; min-width:0; }
  .topbar { background:#fff; border-bottom:1px solid var(--border); padding:12px 22px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:50; }
  .topbar h3 { font-size:16px; flex:1; }
  .user-chip { display:flex; align-items:center; gap:8px; font-size:13px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-weight:600; font-size:12px; }
  .content { padding:20px; max-width:1500px; }
  .menu-btn { display:none; width:36px; height:36px; border-radius:8px; background:#f1f5f9; place-items:center; font-size:16px; }
  .readonly-banner { background:#dbeafe; color:#1e40af; padding:8px 14px; border-radius:8px; font-size:12.5px; margin-bottom:14px; font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--card); border-radius:12px; padding:16px; border:1px solid var(--border); }
  .card .label { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card .value { font-size:24px; font-weight:700; margin-top:6px; }
  .card.warn .value { color:var(--warn); }
  .card.danger .value { color:var(--danger); }
  .card.success .value { color:var(--success); }
  .card.info .value { color:#0284c7; }
  .panel { background:#fff; border-radius:12px; border:1px solid var(--border); margin-bottom:18px; }
  .panel-head { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel-head h4 { font-size:14.5px; flex:1; }
  .panel-body { padding:16px 18px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:600px; }
  th { text-align:left; padding:10px 12px; background:#f8fafc; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid #f1f5f9; }
  .num { text-align:right; }
  .badge-status { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .s-draft { background:#e2e8f0; color:#475569; }
  .s-pending { background:#fef3c7; color:#92400e; }
  .s-approved { background:#dcfce7; color:#166534; }
  .s-rejected { background:#fee2e2; color:#991b1b; }
  .s-correction { background:#e0e7ff; color:#3730a3; }
  .s-reversed { background:#f3e8ff; color:#6b21a8; }
  .s-exception { background:#fecaca; color:#7f1d1d; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:#e2e8f0; color:#475569; font-weight:600; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:8px; font-weight:600; font-size:13px; background:var(--primary); color:#fff; }
  .btn.sec { background:#fff; color:var(--text); border:1px solid var(--border); }
  .btn.sm { padding:6px 11px; font-size:12px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:14px; }
  .modal-overlay.active { display:flex; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:960px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .modal-head h4 { flex:1; font-size:15.5px; }
  .modal-body { padding:20px; overflow-y:auto; flex:1; }
  .modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .x-btn { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:18px; color:var(--muted); }
  .empty { text-align:center; padding:30px; color:var(--muted); font-size:13px; }
  .toast { position:fixed; bottom:20px; right:20px; background:#0f172a; color:#fff; padding:12px 18px; border-radius:10px; z-index:3000; font-size:13px; transform:translateY(100px); opacity:0; transition:.25s; }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.success { background:var(--success); }
  .toast.error { background:var(--danger); }
  .toast.warn { background:var(--warn); }
  .stat-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .stat-row:last-child { border-bottom:none; }
  .chart-wrap { position:relative; height:280px; }
  @media (max-width:900px){
    .sidebar { transform:translateX(-100%); transition:.25s; }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .menu-btn { display:grid; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="role-badge">🔍 WAREHOUSE AUDITOR</div>
    <h1>Auditor Review Portal</h1>
    <p>Independent, read-only review of warehouse transactions, approvals and audit trail.</p>
    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:var(--muted);font-weight:600">Username</label>
      <input id="loginUser" value="auditor" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-top:5px">
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:12px;color:var(--muted);font-weight:600">Password</label>
      <input id="loginPass" type="password" value="auditor" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-top:5px">
    </div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
    <div id="deniedMsg" style="background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;font-size:12.5px;margin-top:12px;display:none"></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>🔍 Auditor Portal</h2>
      <small>Read-Only Access</small>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h3 id="pageTitle">Auditor Dashboard</h3>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">A</div>
        <div>
          <div style="font-weight:600" id="userName">Auditor</div>
          <div style="font-size:11px;color:var(--muted)" id="userRole">Auditor</div>
        </div>
        <button class="btn sec sm" onclick="logout()" style="margin-left:6px">Logout</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================================
   API CLIENT
   ============================================================================ */
const Api = (() => {
  let token = localStorage.getItem('wms_token') || null;
  let user  = JSON.parse(localStorage.getItem('wms_user') || 'null');
  async function req(method, path, body){
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type':'application/json', ...(token ? { Authorization:`Bearer ${token}` } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401){ logout(); throw new Error('Session expired'); }
    return res.json().catch(() => ({ success:false, error:'BAD_JSON' }));
  }
  function login(t,u){
    token = t; user = u;
    localStorage.setItem('wms_token', t);
    localStorage.setItem('wms_user', JSON.stringify(u));
  }
  function logout(){
    token = null; user = null;
    localStorage.removeItem('wms_token');
    localStorage.removeItem('wms_user');
    location.reload();
  }
  return {
    get token(){ return token; },
    get user(){ return user; },
    login, logout,
    isLoggedIn: () => !!token,
    doLogin: (u,p) => req('POST','/api/auth/login',{username:u,password:p}),
    transactions: (q='') => req('GET','/api/transactions' + q),
    transaction:  (id)   => req('GET',`/api/transactions/${id}`),
    stock:        ()     => req('GET','/api/stock'),
    items:        ()     => req('GET','/api/items'),
    auditLogs:    (q='') => req('GET','/api/audit-logs' + q),
  };
})();

let db = { user:null, transactions:[], stock:[], items:[] };
let currentPage = 'dashboard';

/* Helpers */
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtQty = n => (Number(n)||0).toLocaleString('en-US');
const fmtMoney = n => `ETB ${fmt(n)}`;
const fmtDate = d => d ? new Date(d).toISOString().slice(0,10) : '-';
const fmtDateTime = d => d ? new Date(d).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2600);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); }

function typePill(type){
  const map = {
    STOCK_IN:['📥','In','#dcfce7','#166534'],
    STOCK_OUT:['📤','Out','#fee2e2','#991b1b'],
    ADJUSTMENT_IN:['⚖️','Adj+','#dbeafe','#1e40af'],
    ADJUSTMENT_OUT:['⚖️','Adj-','#fef3c7','#92400e'],
    OPENING:['🏁','Opening','#e0e7ff','#3730a3'],
  };
  const [i,l,bg,c] = map[type] || ['•',type,'#e2e8f0','#475569'];
  return `<span class="pill" style="background:${bg};color:${c}">${i} ${l}</span>`;
}
function statusPill(s){
  const map = { Draft:'s-draft', 'Pending Approval':'s-pending', Approved:'s-approved',
    Rejected:'s-rejected', 'Needs Correction':'s-correction', Reversed:'s-reversed' };
  return `<span class="badge-status ${map[s]||'s-draft'}">${esc(s)}</span>`;
}

/* ============================================================================
   AUTH
   ============================================================================ */
async function doLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await Api.doLogin(username, password);
    if (!res.success){
      const d = document.getElementById('deniedMsg');
      d.textContent = '❌ ' + (res.message || 'Login failed');
      d.style.display = 'block';
      return;
    }
    if (!['auditor','super_admin'].includes(res.user.role)){
      const d = document.getElementById('deniedMsg');
      d.textContent = '❌ This portal is restricted to Auditors.';
      d.style.display = 'block';
      return;
    }
    Api.login(res.token, res.user);
    db.user = res.user;
    enterApp();
  } catch(e){ toast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}
async function logout(){
  try { await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:`Bearer ${Api.token}`}}); } catch(e){}
  Api.logout();
}

/* ============================================================================
   NAV
   ============================================================================ */
const NAV_ITEMS = [
  { section:'AUDITOR' },
  { page:'dashboard', label:'Auditor Dashboard', icon:'📊' },
  { section:'REVIEW' },
  { page:'transactions', label:'All Transactions', icon:'📋' },
  { page:'auditlog', label:'Audit Log', icon:'🔒' },
  { section:'CONTROL' },
  { page:'reconciliation', label:'Stock Reconciliation', icon:'⚖️' },
  { page:'exceptions', label:'Audit Exceptions', icon:'🚨' },
];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    if (item.section){
      const s = document.createElement('div');
      s.className = 'section'; s.textContent = item.section;
      nav.appendChild(s); return;
    }
    const a = document.createElement('a');
    a.dataset.page = item.page;
    a.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    a.onclick = () => go(item.page);
    nav.appendChild(a);
  });
}

function go(page){
  currentPage = page;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  const titles = { dashboard:'Auditor Dashboard', transactions:'All Transactions',
    auditlog:'Audit Log', reconciliation:'Stock Reconciliation', exceptions:'Audit Exceptions' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  const c = document.getElementById('content');
  if (page === 'dashboard')        renderDashboard(c);
  else if (page === 'transactions') renderTransactions(c);
  else if (page === 'auditlog')     renderAuditLog(c);
  else if (page === 'reconciliation') renderReconciliation(c);
  else if (page === 'exceptions')   renderExceptions(c);
}

async function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = db.user.name;
  document.getElementById('userRole').textContent = db.user.role === 'super_admin' ? 'Super Admin (Audit)' : 'Auditor';
  document.getElementById('userAvatar').textContent = db.user.name.charAt(0).toUpperCase();
  buildNav();
  await refreshData();
  go('dashboard');
}

async function refreshData(){
  const [txns, stock, items] = await Promise.all([
    Api.transactions(), Api.stock(), Api.items(),
  ]);
  db.transactions = txns.data || [];
  db.stock = stock.data || [];
  db.items = items.data || [];
}

/* ============================================================================
   DASHBOARD
   ============================================================================ */
async function renderDashboard(c){
  const t = db.transactions;
  const byType = { STOCK_IN:0, STOCK_OUT:0, ADJUSTMENT:0 };
  const byStatus = { Approved:0, Rejected:0, Reversed:0, 'Pending Approval':0, 'Needs Correction':0 };
  t.forEach(x => {
    const cat = x.type.startsWith('ADJUSTMENT') ? 'ADJUSTMENT' : x.type;
    byType[cat] = (byType[cat] || 0) + 1;
    byStatus[x.status] = (byStatus[x.status] || 0) + 1;
  });

  // Auto-detect exceptions
  const selfApproved = t.filter(x => x.approved_by === x.requested_by).length;
  const largeAdj = t.filter(x => x.type.startsWith('ADJUSTMENT') && Number(x.total_qty||0) >= 100).length;
  const overdue = t.filter(x => x.status === 'Pending Approval' &&
    x.submitted_at && (Date.now() - new Date(x.submitted_at)) > 24*3600*1000).length;
  const discrepancies = db.stock.filter(r =>
    Number(r.current_stock) > 0 && Number(r.current_stock) <= Number(r.reorder_level) / 2
  ).length;

  c.innerHTML = `
    <div class="readonly-banner">🔒 READ-ONLY — The auditor cannot approve, reject, edit or delete anything.</div>
    <div class="cards">
      <div class="card"><div class="label">Total Transactions</div><div class="value">${t.length}</div></div>
      <div class="card info"><div class="label">Stock IN</div><div class="value">${byType.STOCK_IN}</div></div>
      <div class="card info"><div class="label">Stock OUT</div><div class="value">${byType.STOCK_OUT}</div></div>
      <div class="card info"><div class="label">Adjustments</div><div class="value">${byType.ADJUSTMENT}</div></div>
      <div class="card success"><div class="label">Approved</div><div class="value">${byStatus.Approved}</div></div>
      <div class="card danger"><div class="label">Rejected</div><div class="value">${byStatus.Rejected}</div></div>
      <div class="card warn"><div class="label">Reversed</div><div class="value">${byStatus.Reversed}</div></div>
      <div class="card warn"><div class="label">Pending</div><div class="value">${byStatus['Pending Approval']}</div></div>
      <div class="card ${selfApproved+largeAdj+overdue>0?'danger':'success'}">
        <div class="label">Audit Exceptions</div><div class="value">${selfApproved + largeAdj + overdue}</div></div>
      <div class="card ${discrepancies>0?'warn':'success'}">
        <div class="label">Low-Stock Alerts</div><div class="value">${discrepancies}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h4>📈 Transaction Summary</h4></div>
      <div class="panel-body">
        <div class="stat-row"><span>Stock IN transactions</span><b>${byType.STOCK_IN}</b></div>
        <div class="stat-row"><span>Stock OUT transactions</span><b>${byType.STOCK_OUT}</b></div>
        <div class="stat-row"><span>Adjustment transactions</span><b>${byType.ADJUSTMENT}</b></div>
        <div class="stat-row"><span>Approved</span><b>${byStatus.Approved}</b></div>
        <div class="stat-row"><span>Rejected</span><b>${byStatus.Rejected}</b></div>
        <div class="stat-row"><span>Reversed</span><b>${byStatus.Reversed}</b></div>
        <div class="stat-row"><span>Pending Approval</span><b>${byStatus['Pending Approval']}</b></div>
      </div>
    </div>`;
}

/* ============================================================================
   TRANSACTIONS
   ============================================================================ */
function renderTransactions(c){
  c.innerHTML = `
    <div class="readonly-banner">🔒 READ-ONLY — You can inspect transactions but cannot modify them.</div>
    <div class="panel">
      <div class="panel-head"><h4>📋 All Transactions</h4></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Number</th><th>Type</th><th>Requested By</th><th>Approved By</th>
              <th class="num">Qty</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${db.transactions.length ? db.transactions.map(t => `
                <tr>
                  <td>${fmtDate(t.date)}</td>
                  <td><b>${esc(t.number)}</b></td>
                  <td>${typePill(t.type)}</td>
                  <td>${esc(t.requester_name)}</td>
                  <td>${esc(t.approver_name || '-')}</td>
                  <td class="num">${fmtQty(t.total_qty||0)}</td>
                  <td>${statusPill(t.status)}</td>
                  <td><button class="btn sec sm" onclick="viewTransaction('${t.id}')">View</button></td>
                </tr>`).join('') : '<tr><td colspan="8" class="empty">No transactions</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function viewTransaction(id){
  const r = await Api.transaction(id);
  if (!r.success){ toast(r.message, 'error'); return; }
  const t = r.data;

  openModal(`
    <div class="modal-head">
      <h4>${typePill(t.type)} ${esc(t.number)} ${statusPill(t.status)}</h4>
      <button class="x-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="readonly-banner">🔒 Read-only</div>
      <div class="panel">
        <div class="panel-head"><h4>Transaction Info</h4></div>
        <div class="panel-body">
          <div class="stat-row"><span>Date</span><b>${fmtDate(t.date)}</b></div>
          <div class="stat-row"><span>Requested By</span><b>${esc(t.requested_by_user?.name||'-')}</b></div>
          ${t.approved_by_user ? `<div class="stat-row"><span>Approved By</span><b>${esc(t.approved_by_user.name)} · ${fmtDateTime(t.approved_at)}</b></div>`:''}
          ${t.rejected_by_user ? `<div class="stat-row" style="color:var(--danger)"><span>Rejected By</span><b>${esc(t.rejected_by_user.name)} · ${fmtDateTime(t.rejected_at)}</b></div>`:''}
          ${t.rejection_reason ? `<div class="stat-row"><span>Rejection Reason</span><b>${esc(t.rejection_reason)}</b></div>`:''}
          ${t.approval_comment ? `<div class="stat-row"><span>Approval Comment</span><b>${esc(t.approval_comment)}</b></div>`:''}
          ${t.reference ? `<div class="stat-row"><span>Reference</span><b>${esc(t.reference)}</b></div>`:''}
          ${t.notes ? `<div class="stat-row"><span>Notes</span><b>${esc(t.notes)}</b></div>`:''}

      </div>
      <div class="panel">
        <div class="panel-head"><h4>Items</h4></div>
        <div class="panel-body" style="padding:0">
          <table style="min-width:auto">
            <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit Cost</th><th class="num">Total</th></tr></thead>
            <tbody>
              ${(t.items||[]).map(l => `
                <tr>
                  <td>${esc(l.name||'-')}<br><span style="font-size:11px;color:var(--muted)">${esc(l.code||'')}</span></td>
                  <td class="num">${fmtQty(l.qty)}</td>
                  <td class="num">${fmt(l.unit_cost)}</td>
                  <td class="num">${fmt(l.qty*l.unit_cost)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h4>Complete Approval History</h4></div>
        <div class="panel-body">
          ${(t.approval_history||[]).map((h,i) => `
            <div style="padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px">
              <b>#${i+1} ${esc(h.user_name)}</b> · ${esc(h.action)} · <span style="color:var(--muted)">${fmtDateTime(h.created_at)}</span>
              ${h.comment ? `<div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(h.comment)}</div>`:''}
            </div>`).join('') || '<div class="empty">No history</div>'}

      </div>
    </div>
    <div class="modal-foot">
      <button class="btn sec" onclick="closeModal()">Close</button>
    </div>`);
}

/* ============================================================================
   RECONCILIATION (READ-ONLY comparison of current stock)
   ============================================================================ */
function renderReconciliation(c){
  const rows = db.stock.map(r => {
    const sys = Number(r.current_stock);
    return {
      code: r.code, name: r.item_name, unit: r.unit,
      system: sys,
      min: Number(r.min_stock),
      reorder: Number(r.reorder_level),
      value: sys * Number(r.unit_cost),
      status: sys <= 0 ? 'OUT'
        : sys <= Number(r.min_stock) ? 'CRITICAL'
        : sys <= Number(r.reorder_level) ? 'LOW'
        : 'NORMAL',
    };
  });

  const matches = rows.filter(r => r.status === 'NORMAL').length;
  const diffs = rows.length - matches;

  c.innerHTML = `
    <div class="readonly-banner">🔒 Reconciliation is a read-only comparison against system stock.</div>
    <div class="cards">
      <div class="card success"><div class="label">Normal Stock</div><div class="value">${matches}</div></div>
      <div class="card warn"><div class="label">Low / Critical</div><div class="value">${rows.filter(r=>r.status==='LOW'||r.status==='CRITICAL').length}</div></div>
      <div class="card danger"><div class="label">Out of Stock</div><div class="value">${rows.filter(r=>r.status==='OUT').length}</div></div>
      <div class="card info"><div class="label">Total SKUs</div><div class="value">${rows.length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h4>⚖️ System vs Thresholds</h4></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Code</th><th>Item</th><th class="num">System Qty</th><th class="num">Min</th><th class="num">Reorder</th><th class="num">Value</th><th>Status</th></tr></thead>
            <tbody>
              ${rows.map(r => {
                const cls = { NORMAL:'s-approved', LOW:'s-pending', CRITICAL:'s-rejected', OUT:'s-rejected' }[r.status];
                return `<tr>
                  <td><b>${esc(r.code)}</b></td>
                  <td>${esc(r.name)}</td>
                  <td class="num">${fmtQty(r.system)} ${esc(r.unit)}</td>
                  <td class="num">${fmtQty(r.min)}</td>
                  <td class="num">${fmtQty(r.reorder)}</td>
                  <td class="num">${fmt(r.value)}</td>
                  <td><span class="badge-status ${cls}">${r.status}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ============================================================================
   EXCEPTIONS
   ============================================================================ */
function renderExceptions(c){
  const exceptions = [];

  // 1. Self-approval
  db.transactions.filter(t => t.approved_by && t.approved_by === t.requested_by).forEach(t => {
    exceptions.push({ severity:'critical', title:'Self-Approval', txn:t.number,
      detail:`Transaction ${t.number} was approved by the same user who created it.` });
  });

  // 2. Large adjustments
  db.transactions.filter(t => t.type.startsWith('ADJUSTMENT') && Number(t.total_qty||0) >= 100).forEach(t => {
    exceptions.push({ severity:'warn', title:'Large Adjustment', txn:t.number,
      detail:`Adjustment of ${t.total_qty} units exceeds 100-unit threshold.` });
  });

  // 3. Approval delays
  db.transactions.filter(t => t.status === 'Pending Approval' && t.submitted_at &&
    (Date.now() - new Date(t.submitted_at)) > 24*3600*1000).forEach(t => {
    const hrs = Math.floor((Date.now() - new Date(t.submitted_at)) / 3600000);
    exceptions.push({ severity:'warn', title:'Approval Delay', txn:t.number,
      detail:`Pending for ${hrs}h (SLA: 24h).` });
  });

  // 4. Repeated rejections
  const rejectionsBy = {};
  db.transactions.filter(t => t.status === 'Rejected').forEach(t => {
    rejectionsBy[t.requested_by] = (rejectionsBy[t.requested_by]||0) + 1;
  });
  Object.entries(rejectionsBy).forEach(([uid, n]) => {
    if (n >= 2){
      const name = db.transactions.find(t => t.requested_by === uid)?.requester_name || uid;
      exceptions.push({ severity:'warn', title:'Repeated Rejections',
        detail:`${name} has ${n} rejected transactions.` });
    }
  });

  // 5. Excessive reversals
  const revCount = db.transactions.filter(t => t.status === 'Reversed').length;
  if (revCount >= 3){
    exceptions.push({ severity:'warn', title:'Excessive Reversals',
      detail:`${revCount} transactions have been reversed.` });
  }

  const crit = exceptions.filter(e => e.severity === 'critical');
  const warns = exceptions.filter(e => e.severity === 'warn');

  c.innerHTML = `
    <div class="readonly-banner">🚨 Auto-detected exceptions</div>
    <div class="cards">
      <div class="card danger"><div class="label">Critical</div><div class="value">${crit.length}</div></div>
      <div class="card warn"><div class="label">Warnings</div><div class="value">${warns.length}</div></div>
      <div class="card"><div class="label">Total</div><div class="value">${exceptions.length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h4>🚨 Exceptions</h4></div>
      <div class="panel-body">
        ${exceptions.length ? exceptions.map(e => `
          <div style="border-left:4px solid ${e.severity==='critical'?'var(--danger)':'var(--warn)'};
                     background:${e.severity==='critical'?'#fef2f2':'#fffbeb'};
                     padding:12px 14px;border-radius:8px;margin-bottom:10px">
            <div style="font-weight:700;font-size:13.5px">${e.severity==='critical'?'🛑':'⚠️'} ${esc(e.title)}
              ${e.txn?`<span class="pill">${esc(e.txn)}</span>`:''}</div>
            <div style="font-size:12.5px;color:#475569;margin-top:4px">${esc(e.detail)}</div>
          </div>`).join('') : '<div class="empty">✅ No exceptions detected.</div>'}
      </div>
    </div>`;
}
