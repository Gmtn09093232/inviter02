<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --primary:#92400e; --primary-dark:#78350f; --accent:#f59e0b;
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --success:#16a34a; --warn:#f59e0b; --danger:#dc2626; --info:#0284c7;
    --sidebar:#0f172a;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  button { cursor: pointer; border: none; background: none; }
  #loginScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#0f172a,#7c2d12); padding: 20px; z-index: 2000; }
  .login-box { background:#fff; border-radius:16px; padding: 32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .login-box h1 { font-size:20px; margin-bottom:4px; color:var(--primary); }
  .login-box .role-badge { display:inline-block; background:#fef3c7; color:#92400e; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; margin-bottom:14px; }
  .login-box p { color: var(--muted); margin-bottom:20px; font-size:12.5px; }
  .app { display:none; min-height:100vh; }
  .app.active { display:flex; }
  .sidebar { width:250px; background:var(--sidebar); color:#cbd5e1; flex-shrink:0; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:100; }
  .brand { padding:20px; border-bottom:1px solid #1e293b; }
  .brand h2 { color:#fff; font-size:15px; }
  .brand small { color:#f59e0b; font-size:11px; font-weight:600; }
  .nav { flex:1; padding:10px 0; }
  .nav a { display:flex; align-items:center; gap:10px; padding:11px 20px; color:#cbd5e1; font-size:13.5px; border-left:3px solid transparent; cursor:pointer; }
  .nav a:hover { background:#1e293b; color:#fff; }
  .nav a.active { background:#1e293b; color:#fff; border-left-color:var(--accent); }
  .nav .section { padding:14px 20px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#475569; }
  .main { flex:1; margin-left:250px; min-width:0; }
  .topbar { background:#fff; border-bottom:1px solid var(--border); padding:12px 22px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:50; }
  .topbar h3 { font-size:16px; flex:1; }
  .user-chip { display:flex; align-items:center; gap:8px; font-size:13px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:600; font-size:12px; }
  .content { padding:20px; max-width:1500px; }
  .menu-btn { display:none; width:36px; height:36px; border-radius:8px; background:#f1f5f9; place-items:center; font-size:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--card); border-radius:12px; padding:16px; border:1px solid var(--border); }
  .card .label { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card .value { font-size:24px; font-weight:700; margin-top:6px; }
  .card.warn .value { color:var(--warn); }
  .card.danger .value { color:var(--danger); }
  .card.success .value { color:var(--success); }
  .card.info .value { color:var(--info); }
  .panel { background:#fff; border-radius:12px; border:1px solid var(--border); margin-bottom:18px; }
  .panel-head { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel-head h4 { font-size:14.5px; flex:1; }
  .panel-body { padding:16px 18px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:600px; }
  th { text-align:left; padding:10px 12px; background:#f8fafc; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid #f1f5f9; }
  .num { text-align:right; }
  .badge-status { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .s-draft { background:#e2e8f0; color:#475569; }
  .s-pending { background:#fef3c7; color:#92400e; }
  .s-approved { background:#dcfce7; color:#166534; }
  .s-rejected { background:#fee2e2; color:#991b1b; }
  .s-correction { background:#e0e7ff; color:#3730a3; }
  .s-reversed { background:#f3e8ff; color:#6b21a8; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:#e2e8f0; color:#475569; font-weight:600; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:8px; font-weight:600; font-size:13px; background:var(--primary); color:#fff; }
  .btn:hover { background:var(--primary-dark); }
  .btn.sec { background:#fff; color:var(--text); border:1px solid var(--border); }
  .btn.danger { background:var(--danger); }
  .btn.warn { background:var(--warn); color:#fff; }
  .btn.success { background:var(--success); }
  .btn.sm { padding:6px 11px; font-size:12px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:14px; }
  .modal-overlay.active { display:flex; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:960px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .modal-head h4 { flex:1; font-size:15.5px; }
  .modal-body { padding:20px; overflow-y:auto; flex:1; }
  .modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .x-btn { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:18px; color:var(--muted); }
  .empty { text-align:center; padding:30px; color:var(--muted); font-size:13px; }
  .toast { position:fixed; bottom:20px; right:20px; background:#0f172a; color:#fff; padding:12px 18px; border-radius:10px; z-index:3000; font-size:13px; transform:translateY(100px); opacity:0; transition:.25s; }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.success { background:var(--success); }
  .toast.error { background:var(--danger); }
  .toast.warn { background:var(--warn); }
  .stat-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .stat-row:last-child { border-bottom:none; }
  @media (max-width:900px){
    .sidebar { transform:translateX(-100%); transition:.25s; }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .menu-btn { display:grid; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="role-badge">🏢 WAREHOUSE MANAGER</div>
    <h1>Manager Approval Portal</h1>
    <p>Sign in to review and approve warehouse transactions.</p>
    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:var(--muted);font-weight:600">Username</label>
      <input id="loginUser" value="manager" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-top:5px">
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:12px;color:var(--muted);font-weight:600">Password</label>
      <input id="loginPass" type="password" value="manager" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-top:5px">
    </div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
    <div id="deniedMsg" style="background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;font-size:12.5px;margin-top:12px;display:none"></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>🏢 Manager Portal</h2>
      <small>Approval Dashboard</small>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h3 id="pageTitle">Manager Dashboard</h3>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">M</div>
        <div>
          <div style="font-weight:600" id="userName">Manager</div>
          <div style="font-size:11px;color:var(--muted)" id="userRole">Warehouse Manager</div>
        </div>
        <button class="btn sec sm" onclick="logout()" style="margin-left:6px">Logout</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================================
   API CLIENT
   ============================================================================ */
const Api = (() => {
  let token = localStorage.getItem('wms_token') || null;
  let user  = JSON.parse(localStorage.getItem('wms_user') || 'null');
  async function req(method, path, body){
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type':'application/json', ...(token ? { Authorization:`Bearer ${token}` } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401){ logout(); throw new Error('Session expired'); }
    return res.json().catch(() => ({ success:false, error:'BAD_JSON' }));
  }
  function login(t, u){
    token = t; user = u;
    localStorage.setItem('wms_token', t);
    localStorage.setItem('wms_user', JSON.stringify(u));
  }
  function logout(){
    token = null; user = null;
    localStorage.removeItem('wms_token');
    localStorage.removeItem('wms_user');
    location.reload();
  }
  return {
    get token(){ return token; },
    get user(){ return user; },
    login, logout,
    isLoggedIn: () => !!token,
    doLogin: (u,p) => req('POST','/api/auth/login',{username:u,password:p}),
    approvals: ()            => req('GET',  '/api/manager/approvals'),
    transaction: (id)        => req('GET',  `/api/transactions/${id}`),
    approve: (id, comment)   => req('POST', `/api/manager/approvals/${id}/approve`, { comment }),
    reject:  (id, reason)    => req('POST', `/api/manager/approvals/${id}/reject`,  { reason }),
    returnTxn: (id, comment) => req('POST', `/api/manager/approvals/${id}/return`,  { comment }),
  };
})();

const db = { user:null, settings:{currency:'ETB'} };
let currentPage = 'dashboard';
let pendingCache = [];

/* Helpers */
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtQty = n => (Number(n)||0).toLocaleString('en-US');
const fmtMoney = n => `ETB ${fmt(n)}`;
const fmtDate = d => d ? new Date(d).toISOString().slice(0,10) : '-';
const fmtDateTime = d => d ? new Date(d).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2600);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); }

function typePill(type){
  const map = {
    STOCK_IN:['📥','In','#dcfce7','#166534'],
    STOCK_OUT:['📤','Out','#fee2e2','#991b1b'],
    ADJUSTMENT_IN:['⚖️','Adj+','#dbeafe','#1e40af'],
    ADJUSTMENT_OUT:['⚖️','Adj-','#fef3c7','#92400e'],
    OPENING:['🏁','Opening','#e0e7ff','#3730a3'],
  };
  const [i,l,bg,c] = map[type] || ['•',type,'#e2e8f0','#475569'];
  return `<span class="pill" style="background:${bg};color:${c}">${i} ${l}</span>`;
}
function statusPill(s){
  const map = { Draft:'s-draft', 'Pending Approval':'s-pending', Approved:'s-approved',
    Rejected:'s-rejected', 'Needs Correction':'s-correction', Reversed:'s-reversed' };
  return `<span class="badge-status ${map[s]||'s-draft'}">${esc(s)}</span>`;
}

/* ============================================================================
   AUTH
   ============================================================================ */
async function doLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await Api.doLogin(username, password);
    if (!res.success){
      const d = document.getElementById('deniedMsg');
      d.textContent = '❌ ' + (res.message || 'Login failed');
      d.style.display = 'block';
      return;
    }
    if (!['warehouse_manager', 'super_admin'].includes(res.user.role)){
      const d = document.getElementById('deniedMsg');
      d.textContent = '❌ This portal is restricted to Warehouse Managers.';
      d.style.display = 'block';
      return;
    }
    Api.login(res.token, res.user);
    db.user = res.user;
    enterApp();
  } catch (e){
    toast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}
async function logout(){
  try { await fetch('/api/auth/logout', { method:'POST', headers:{ Authorization:`Bearer ${Api.token}` }}); } catch(e){}
  Api.logout();
}

/* ============================================================================
   NAV
   ============================================================================ */
const NAV_ITEMS = [
  { section:'MANAGER' },
  { page:'dashboard', label:'Dashboard', icon:'📊' },
  { page:'pending_in', label:'Stock IN Approvals', icon:'📥' },
  { page:'pending_out', label:'Stock OUT Approvals', icon:'📤' },
  { page:'pending_adj', label:'Adjustment Approvals', icon:'⚖️' },
  { page:'history', label:'Approval History', icon:'📜' },
];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    if (item.section){
      const s = document.createElement('div');
      s.className = 'section'; s.textContent = item.section;
      nav.appendChild(s); return;
    }
    const a = document.createElement('a');
    a.dataset.page = item.page;
    a.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    a.onclick = () => go(item.page);
    nav.appendChild(a);
  });
}

function go(page){
  currentPage = page;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  const titles = { dashboard:'Manager Dashboard', pending_in:'Stock IN Approvals',
    pending_out:'Stock OUT Approvals', pending_adj:'Adjustment Approvals', history:'Approval History' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  const c = document.getElementById('content');
  if (page === 'dashboard')  renderDashboard(c);
  else if (page === 'pending_in')  renderPending(c, 'STOCK_IN');
  else if (page === 'pending_out') renderPending(c, 'STOCK_OUT');
  else if (page === 'pending_adj') renderPending(c, 'ADJUSTMENT');
  else if (page === 'history')     renderHistory(c);
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = db.user.name;
  document.getElementById('userRole').textContent = db.user.role === 'super_admin' ? 'Super Admin' : 'Warehouse Manager';
  document.getElementById('userAvatar').textContent = db.user.name.charAt(0).toUpperCase();
  buildNav();
  go('dashboard');
}

/* ============================================================================
   DASHBOARD
   ============================================================================ */
async function renderDashboard(c){
  c.innerHTML = '<div class="empty">⏳ Loading approvals…</div>';
  const r = await Api.approvals();
  pendingCache = r.data || [];
  const today = new Date().toISOString().slice(0,10);
  const approvedToday = pendingCache.filter(t => (t.approved_at||'').slice(0,10) === today).length;
  const rejectedToday = pendingCache.filter(t => (t.rejected_at||'').slice(0,10) === today).length;
  const overdue = pendingCache.filter(t => t.overdue).length;
  const totalValue = pendingCache.reduce((s, t) => s + Number(t.total_value||0), 0);

  c.innerHTML = `
    <div class="cards">
      <div class="card warn"><div class="label">Pending Approvals</div><div class="value">${pendingCache.length}</div><div class="sub">${fmtMoney(totalValue)} total</div></div>
      <div class="card success"><div class="label">Approved Today</div><div class="value">${approvedToday}</div></div>
      <div class="card danger"><div class="label">Rejected Today</div><div class="value">${rejectedToday}</div></div>
      <div class="card danger"><div class="label">Overdue</div><div class="value">${overdue}</div><div class="sub">> 24h waiting</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h4>⏳ Pending Approvals</h4>
        <button class="btn sec sm" onclick="go('pending_in')">Stock IN</button>
        <button class="btn sec sm" onclick="go('pending_out')">Stock OUT</button>
        <button class="btn sec sm" onclick="go('pending_adj')">Adjustments</button>
      </div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Requested By</th><th class="num">Qty</th><th class="num">Value</th><th>Waiting</th><th></th></tr></thead>
            <tbody>
              ${pendingCache.length ? pendingCache.slice(0,10).map(t => `
                <tr${t.overdue ? ' style="background:#fef2f2"' : ''}>
                  <td><b>${esc(t.number)}</b></td>
                  <td>${typePill(t.type)}</td>
                  <td>${fmtDate(t.date)}</td>
                  <td>${esc(t.requester_name)}</td>
                  <td class="num">${fmtQty(t.total_qty||0)}</td>
                  <td class="num">${fmt(t.total_value||0)}</td>
                  <td>${waitTime(t.waited_minutes)}${t.overdue ? ' ⚠️' : ''}</td>
                  <td><button class="btn sm" onclick="openTransaction('${t.id}')">Review</button></td>
                </tr>`).join('') : '<tr><td colspan="8" class="empty">🎉 No pending approvals</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ============================================================================
   PENDING LISTS
   ============================================================================ */
async function renderPending(c, typeFilter){
  c.innerHTML = '<div class="empty">⏳ Loading…</div>';
  const r = await Api.approvals();
  const rows = (r.data || []).filter(t => {
    if (!typeFilter) return true;
    if (typeFilter === 'ADJUSTMENT') return t.type === 'ADJUSTMENT_IN' || t.type === 'ADJUSTMENT_OUT';
    return t.type === typeFilter;
  });
  const title = typeFilter === 'STOCK_IN' ? 'Stock IN Approvals'
    : typeFilter === 'STOCK_OUT' ? 'Stock OUT Approvals' : 'Adjustment Approvals';

  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h4>📋 ${title} — ${rows.length} pending</h4></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Requested By</th>
              <th class="num">Qty</th><th class="num">Value</th><th>Waiting</th><th>Action</th></tr></thead>
            <tbody>
              ${rows.length ? rows.map(t => `
                <tr${t.overdue ? ' style="background:#fef2f2"' : ''}>
                  <td><b>${esc(t.number)}</b></td>
                  <td>${typePill(t.type)}</td>
                  <td>${fmtDate(t.date)}</td>
                  <td>${esc(t.requester_name)}</td>
                  <td class="num">${fmtQty(t.total_qty||0)}</td>
                  <td class="num">${fmt(t.total_value||0)}</td>
                  <td>${waitTime(t.waited_minutes)}${t.overdue ? ' ⚠️' : ''}</td>
                  <td style="white-space:nowrap">
                    <button class="btn sec sm" onclick="openTransaction('${t.id}')">View</button>
                    ${t.can_approve ? `
                      <button class="btn success sm" onclick="quickApprove('${t.id}')">✓</button>
                      <button class="btn danger sm" onclick="quickReject('${t.id}')">✕</button>
                      <button class="btn warn sm" onclick="quickReturn('${t.id}')">↩</button>
                    ` : ''}
                  </td>
                </tr>`).join('') : '<tr><td colspan="8" class="empty">🎉 No pending in this category</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ============================================================================
   TRANSACTION DETAIL + APPROVE / REJECT / RETURN
   ============================================================================ */
async function openTransaction(id){
  const r = await Api.transaction(id);
  if (!r.success){ toast(r.message, 'error'); return; }
  const t = r.data;
  const isOwn = t.requested_by === db.user.id;
  const canAct = t.status === 'Pending Approval' && !isOwn;

  openModal(`
    <div class="modal-head">
      <h4>${typePill(t.type)} ${esc(t.number)} ${statusPill(t.status)}</h4>
      <button class="x-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      ${isOwn ? `<div style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:12.5px;margin-bottom:14px">⚠️ You are the requester. You cannot approve your own transaction.</div>`:''}

      <div class="panel">
        <div class="panel-head"><h4>Transaction Information</h4></div>
        <div class="panel-body">
          <div class="stat-row"><span>Date</span><b>${fmtDate(t.date)}</b></div>
          <div class="stat-row"><span>Requested By</span><b>${esc(t.requested_by_user?.name || '-')}</b></div>
          <div class="stat-row"><span>Submitted</span><b>${fmtDateTime(t.submitted_at)}</b></div>
          ${t.reference ? `<div class="stat-row"><span>Reference</span><b>${esc(t.reference)}</b></div>`:''}
          ${t.purpose ? `<div class="stat-row"><span>Purpose</span><b>${esc(t.purpose)}</b></div>`:''}
          ${t.reason ? `<div class="stat-row"><span>Reason</span><b>${esc(t.reason)}</b></div>`:''}
          ${t.notes ? `<div class="stat-row"><span>Notes</span><b>${esc(t.notes)}</b></div>`:''}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h4>Items</h4></div>
        <div class="panel-body" style="padding:0">
          <table style="min-width:auto">
            <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit Cost</th><th class="num">Total</th></tr></thead>
            <tbody>
              ${(t.items||[]).map(l => `
                <tr>
                  <td>${esc(l.name||'-')}<br><span style="font-size:11px;color:var(--muted)">${esc(l.code||'')}</span></td>
                  <td class="num">${fmtQty(l.qty)} ${esc(l.unit||'')}</td>
                  <td class="num">${fmt(l.unit_cost)}</td>
                  <td class="num">${fmt(l.qty * l.unit_cost)}</td>
                </tr>`).join('')}
              <tr><td colspan="3" style="text-align:right"><b>Total</b></td><td class="num"><b>${fmt((t.items||[]).reduce((s,l)=>s+l.qty*l.unit_cost,0))}</b></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h4>Approval History</h4></div>
        <div class="panel-body">
          ${(t.approval_history||[]).map(h => `
            <div style="padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px">
              <b>${esc(h.user_name)}</b> · ${esc(h.action)} · <span style="color:var(--muted)">${fmtDateTime(h.created_at)}</span>
              ${h.comment ? `<div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(h.comment)}</div>`:''}
            </div>`).join('') || '<div class="empty">No history</div>'}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      ${canAct ? `
        <button class="btn warn" onclick="doReturn('${t.id}')">Return for Correction</button>
        <button class="btn danger" onclick="doReject('${t.id}')">Reject</button>
        <button class="btn success" onclick="doApprove('${t.id}')">Approve</button>
      ` : isOwn ? `<div style="color:var(--muted);font-size:12.5px;align-self:center">You cannot approve your own transaction</div>` : ''}
      <button class="btn sec" onclick="closeModal()">Close</button>
    </div>`);
}

async function doApprove(id){
  const comment = prompt('Approval comment (optional):') || '';
  const r = await Api.approve(id, comment);
  if (!r.success){ toast(r.message, 'error'); return; }
  toast('Transaction approved ✓', 'success');
  closeModal();
  go(currentPage);
}
async function doReject(id){
  const reason = prompt('Rejection reason (required):');
  if (reason === null) return;
  if (!reason.trim()){ toast('Reason required', 'error'); return; }
  const r = await Api.reject(id, reason);
  if (!r.success){ toast(r.message, 'error'); return; }
  toast('Transaction rejected', 'warn');
  closeModal();
  go(currentPage);
}
async function doReturn(id){
  const comment = prompt('Comment for the requester (required):');
  if (comment === null) return;
  if (!comment.trim()){ toast('Comment required', 'error'); return; }
  const r = await Api.returnTxn(id, comment);
  if (!r.success){ toast(r.message, 'error'); return; }
  toast('Returned for correction', 'warn');
  closeModal();
  go(currentPage);
}

function quickApprove(id){ openTransaction(id).then(() => setTimeout(() => doApprove(id), 100)); }
function quickReject(id){ openTransaction(id).then(() => setTimeout(() => doReject(id), 100)); }
function quickReturn(id){ openTransaction(id).then(() => setTimeout(() => doReturn(id), 100)); }

function waitTime(min){
  if (min == null) return '-';
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m`;
  const h = Math.floor(min/60);
  if (h < 24) return `${h}h ${min%60}m`;
  return `${Math.floor(h/24)}d ${h%24}h`;
}

/* ============================================================================
   HISTORY
   ============================================================================ */
function renderHistory(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h4>📜 Approval History</h4></div>
      <div class="panel-body">
        <div id="histBody" class="empty">⏳ Loading…</div>
      </div>
    </div>`;
  // Simple client-side: pull from approvals + approved transactions.
  // For a full history, add a server endpoint later.
  Api.approvals().then(r => {
    const rows = r.data || [];
    document.getElementById('histBody').innerHTML = rows.length
      ? `<table><thead><tr><th>Number</th><th>Type</th><th>Requester</th><th>Status</th><th>Waiting</th></tr></thead>
        <tbody>${rows.map(t => `<tr><td>${esc(t.number)}</td><td>${typePill(t.type)}</td><td>${esc(t.requester_name)}</td><td>${statusPill(t.status)}</td><td>${waitTime(t.waited_minutes)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No history</div>';
  });
}

/* ============================================================================
   BOOT
   ============================================================================ */
(function boot(){
  if (Api.isLoggedIn()){
    db.user = Api.user;
    if (!['warehouse_manager','super_admin'].includes(db.user.role)){
      Api.logout(); return;
    }
    enterApp();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
  }
})();

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
